// ── Auto-link PO keluar ↔ Tagihan supplier (hutang). 1 PO = 1 tagihan pemenuhan_po (dicocokkan lewat po_id). ──
async function syncBillFromPO(po){
  try{
    // tanggal_terima HANYA di-set saat tagihan pertama kali dibuat (default = tgl PO); setelah itu JANGAN ditimpa,
    // supaya "Tanggal terima" yang kamu isi manual di Tagihan Supplier (patokan masa PPN masukan) tidak berubah.
    const base={ po_id:po.id, order_id:po.order_id||null, supplier_id:po.supplier_id||null,
      no_tagihan:po.no_po||null, nilai:Number(po.total)||0, items:po.items||[],
      jatuh_tempo:po.jatuh_tempo||null, jenis:(po.order_id?'pemenuhan_po':'persediaan'), pakai_ppn:po.pakai_ppn!==false };
    const { data:ex }=await sb.from('supplier_bills').select('id').eq('po_id',po.id).maybeSingle();
    if(ex){ await sb.from('supplier_bills').update(base).eq('id',ex.id); return ex.id; }
    const { data:nb }=await sb.from('supplier_bills').insert({ ...base, tanggal_terima: po.tanggal || today(), status:'belum' }).select('id').maybeSingle();
    return nb?nb.id:null;
  }catch(e){ console.error('syncBillFromPO gagal', e); return null; }
}
// Catat pembayaran tagihan supplier → Arus Kas (kas keluar) + bill_payments.
async function recordSupplierPayment(bill, jumlah, tgl){
  const operasional = bill.jenis==='operasional';
  const sup = bill.supplier_name || (bill.suppliers&&bill.suppliers.nama) || '';
  const its = (bill.items&&bill.items.length)? itemSummary(bill.items) : '';
  const catatan = [sup, bill.no_tagihan?('tagihan '+bill.no_tagihan):'', its].filter(Boolean).join(' · ');
  const { data:tx, error:te }=await sb.from('transactions').insert({ tanggal:tgl, arah:'keluar',
    jenis: operasional?'biaya_usaha':'bayar_hutang', jumlah, order_id:bill.order_id||null,
    kategori: operasional?'Pembelian operasional':'Raw material', catatan:catatan||('Tagihan '+(bill.no_tagihan||'')) }).select('id').maybeSingle();
  if(te) return { error:te.message };
  const { error:pe }=await sb.from('bill_payments').insert({ bill_id:bill.id, tanggal:tgl, jumlah, transaction_id:tx?tx.id:null });
  if(pe) return { error:pe.message };
  return {};
}
// Hitung ulang status tagihan dari total pembayaran, lalu samakan status PO terkait.
async function refreshBillStatus(billId){
  const { data:b }=await sb.from('supplier_bills').select('id,nilai,po_id').eq('id',billId).maybeSingle();
  if(!b) return;
  const { data:ps }=await sb.from('bill_payments').select('jumlah').eq('bill_id',billId);
  const paid=(ps||[]).reduce((s,p)=>s+(Number(p.jumlah)||0),0);
  const status=paid>=(Number(b.nilai)||0)-1?'lunas':(paid>0?'sebagian':'belum');
  await sb.from('supplier_bills').update({status}).eq('id',billId);
  if(b.po_id) await sb.from('purchase_orders').update({bayar_status:status}).eq('id',b.po_id);
}
// Lunasi sisa tagihan (dipakai saat PO ditandai Lunas).
async function settleBillFull(billId, tgl){
  let { data:b, error }=await sb.from('supplier_bills').select('id,nilai,jenis,order_id,no_tagihan,po_id,items,suppliers(nama)').eq('id',billId).maybeSingle();
  if(error){ const r=await sb.from('supplier_bills').select('id,nilai,jenis,order_id,no_tagihan,po_id').eq('id',billId).maybeSingle(); b=r.data; }
  if(!b) return;
  if(b.suppliers) b.supplier_name=b.suppliers.nama;
  const { data:ps }=await sb.from('bill_payments').select('jumlah').eq('bill_id',billId);
  const paid=(ps||[]).reduce((s,p)=>s+(Number(p.jumlah)||0),0);
  const sisa=(Number(b.nilai)||0)-paid;
  if(sisa>0.5){ const r=await recordSupplierPayment(b, sisa, tgl||today()); if(r.error){ alert('Gagal catat pembayaran supplier: '+r.error); return; } }
  await refreshBillStatus(billId);
}
async function savePO(){
  const err=document.getElementById('poErr'); err.textContent='';
  const orderSel=document.getElementById('poOrder');
  // Form "Beli stok" (tab PO Keluar) punya flag #poStokMode → order dikosongkan, tagihan jadi jenis 'persediaan' (Aset, bukan HPP).
  const isStok = !!document.getElementById('poStokMode');
  const order_id = isStok ? null : (orderSel ? orderSel.value : openOrderId);
  const ssel=document.getElementById('poSupplier').value;
  const snewEl=document.getElementById('poSupplierNew');
  const snew=snewEl?snewEl.value.trim():'';
  const no=document.getElementById('poNo').value.trim();
  const tgl=document.getElementById('poTgl').value||today();
  const items=collectItems();
  const vatOn=poVatOn()!==false;
  const total=items.length ? (vatOn?computeItemTotals(items).total:itemsTotal(items)) : (Number(document.getElementById('poTotal').value)||0);
  const bayarStatus=(document.getElementById('poStatus')||{}).value||'belum';
  const tempo=document.getElementById('poTempo')?(document.getElementById('poTempo').value||null):null;
  const deadline=document.getElementById('poDeadline')?(document.getElementById('poDeadline').value||null):null;
  if(!isStok && !order_id){ err.textContent='Pilih order dulu — atau pilih mode "Stok / persediaan".'; return; }
  if(!no){ err.textContent='No PO wajib diisi.'; return; }
  const btn=document.getElementById('poSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const reset=()=>{ btn.disabled=false; btn.textContent='Simpan PO'; };
  let supplier_id=null;
  if(ssel==='__new'){
    if(!snew){ err.textContent='Isi nama supplier baru.'; reset(); return; }
    const r=await resolveSupplierId(snew); if(r.error){ err.textContent='Gagal simpan supplier: '+r.error; reset(); return; } supplier_id=r.id;
  } else if(ssel){ supplier_id=ssel; }
  else { err.textContent='Pilih supplier.'; reset(); return; }
  const { data:newPO, error }=await sb.from('purchase_orders').insert({ no_po:no, order_id, supplier_id, tanggal:tgl, total, items, jatuh_tempo:tempo, deadline_kirim:deadline, bayar_status:bayarStatus, pakai_ppn:vatOn }).select('id').maybeSingle();
  if(error){ err.textContent='Gagal simpan PO: '+error.message; reset(); return; }
  // Link PO keluar → tagihan supplier (hutang). Bila ditandai Lunas, catat pembayaran ke Arus Kas.
  if(newPO){
    const billId=await syncBillFromPO({ id:newPO.id, order_id, supplier_id, no_po:no, total, items, jatuh_tempo:tempo, tanggal:tgl, deadline_kirim:deadline, pakai_ppn:vatOn });
    if(billId && bayarStatus==='lunas') await settleBillFull(billId);
  }
  poCache=null; billsCache=null; ledgerCache=null; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; orderSummary={};
  if(orderSel) poView='list'; else poFormOpen=false;
  render();
}
async function deletePO(id){
  if(!confirm('Hapus PO keluar ini? Tagihan supplier terhubung & pembayarannya ikut terhapus.')) return;
  // Hapus tagihan terhubung + transaksi kas dari pembayarannya agar tidak menyisakan data yatim.
  const { data:bills }=await sb.from('supplier_bills').select('id').eq('po_id',id);
  for(const b of (bills||[])){
    const { data:ps }=await sb.from('bill_payments').select('transaction_id').eq('bill_id',b.id);
    const txids=(ps||[]).map(p=>p.transaction_id).filter(Boolean);
    if(txids.length) await sb.from('transactions').delete().in('id',txids);
    await sb.from('supplier_bills').delete().eq('id',b.id);
  }
  const { error }=await sb.from('purchase_orders').delete().eq('id',id);
  if(error){ alert('Gagal hapus: '+error.message); return; }
  poCache=null; billsCache=null; ledgerCache=null; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; orderSummary={}; render();
}
// ── Alokasikan PO stok/persediaan ke sebuah order buyer → pindah jadi HPP order itu (Tahap 2). ──
async function allocatePO(poId, orderId){
  if(!poId||!orderId) return {error:'data kurang'};
  // PO stok → tautkan ke order; tagihan 'persediaan' → 'pemenuhan_po' (masuk HPP order + PPN masukan dikreditkan).
  const { error:e1 }=await sb.from('purchase_orders').update({ order_id:orderId }).eq('id',poId);
  if(e1) return {error:e1.message};
  const { error:e2 }=await sb.from('supplier_bills').update({ order_id:orderId, jenis:'pemenuhan_po' }).eq('po_id',poId);
  if(e2) return {error:e2.message};
  poCache=null; billsCache=null; ledgerCache=null; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; orderSummary={};
  return {};
}

// sebagai nama default saat "Save as PDF". Judul dikembalikan setelah dialog cetak selesai.
function printDocWithName(name){
  const clean=String(name||'Dokumen').replace(/[\\/:*?"<>|\n\r\t]+/g,'-').replace(/\s+/g,' ').trim();
  const prev=document.title;
  document.title=clean||'Dokumen';
  let done=false;
  const restore=()=>{ if(done) return; done=true; document.title=prev; window.removeEventListener('afterprint',restore); };
  window.addEventListener('afterprint',restore);
  setTimeout(restore,60000);
  window.print();
}

function openSignaturePad(onSave){
  let pad=document.getElementById('sigPadOverlay'); if(pad) pad.remove();
  pad=document.createElement('div'); pad.id='sigPadOverlay';
  pad.innerHTML=`<div class="overlay" style="align-items:center;z-index:100">

      <p style="margin:0 0 10px;font-size:12px;color:var(--ink-soft)">Gambar tanda tangan Anda di kotak (pakai mouse / trackpad / layar sentuh), lalu <b>Simpan</b>. Atau <b>Unggah gambar</b> foto tanda tangan. Tersimpan &amp; otomatis muncul di semua dokumen.</p>
      <canvas id="sigCanvas" width="430" height="170" style="width:100%;height:170px;border:1.5px dashed var(--gold);border-radius:8px;background:#FFFDF5;touch-action:none;cursor:crosshair;display:block"></canvas>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">
        <button class="o-btn" id="sigSave">Simpan tanda tangan</button>
        <button class="o-btn ghost" id="sigClear">Bersihkan</button>
        <label class="o-btn ghost" style="cursor:pointer;margin:0">Unggah gambar…<input type="file" accept="image/*" id="sigUpload" style="display:none"></label>
        ${state.seller&&state.seller.ttd?`<button class="o-btn ghost" id="sigRemove" style="color:var(--danger);border-color:#E3B9B3">Hapus TTD tersimpan</button>`:''}
        <button class="o-btn ghost" id="sigCancel" style="margin-left:auto">Batal</button>
      </div>
    </div></div>`;
  document.body.appendChild(pad);
  const cv=pad.querySelector('#sigCanvas'), ctx=cv.getContext('2d');
  ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#14315f';
  let drawing=false, dirty=false, last=null;
  const pos=(e)=>{ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(cv.width/r.width), y:(e.clientY-r.top)*(cv.height/r.height) }; };
  const start=(e)=>{ e.preventDefault(); drawing=true; last=pos(e); try{cv.setPointerCapture(e.pointerId);}catch(_){}; };
  const move=(e)=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; dirty=true; };
  const end=()=>{ drawing=false; };
  cv.addEventListener('pointerdown',start); cv.addEventListener('pointermove',move); cv.addEventListener('pointerup',end); cv.addEventListener('pointerleave',end);
  const close=()=>{ pad.remove(); };
  pad.querySelector('#sigClear').onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); dirty=false; };
  pad.querySelector('#sigCancel').onclick=close;
  const rm=pad.querySelector('#sigRemove'); if(rm) rm.onclick=async()=>{ state.seller.ttd=''; try{await saveSeller();}catch(_){}; close(); onSave(''); };
  pad.querySelector('.overlay').onclick=(e)=>{ if(e.target===pad.querySelector('.overlay')) close(); };
  pad.querySelector('#sigUpload').onchange=(ev)=>{
    const f=ev.target.files&&ev.target.files[0]; if(!f) return;
    if(f.size>2*1024*1024){ alert('Ukuran gambar tanda tangan maksimal 2MB.'); return; }
    const rd=new FileReader(); rd.onload=()=>{ close(); onSave(rd.result); }; rd.readAsDataURL(f);
  };
  pad.querySelector('#sigSave').onclick=()=>{
    if(!dirty){ alert('Gambar tanda tangan dulu di kotak, atau pakai "Unggah gambar…".'); return; }
    const url=cv.toDataURL('image/png');   // latar transparan (background kotak dari CSS, tidak digambar)
    close(); onSave(url);
  };
}

async function fetchEntityAddr(table, id){
  if(!id) return {alamat:'',kontak:'',npwp:'',telp:'',gudang:[]};
  try{ let { data }=await sb.from(table).select('alamat,kontak,npwp,telp,gudang').eq('id',id).maybeSingle();
    if(!data) return {alamat:'',kontak:'',npwp:'',telp:'',gudang:[]};
    return {...data, gudang:Array.isArray(data.gudang)?data.gudang:[]};
  }catch(e){ return {alamat:'',kontak:'',npwp:'',telp:'',gudang:[]}; }
}

const BILL_JENIS=[['pemenuhan_po','Pemenuhan PO (masuk HPP)'],['operasional','Operasional (biaya usaha)']];
function billStatusBadge(b){
  const nilai=Number(b.nilai)||0, paid=(b.paid!=null)?(Number(b.paid)||0):null, sisa=(b.sisa!=null)?(Number(b.sisa)||0):null;
  let lunas,sebagian;
  if(sisa!=null){ lunas = nilai>0 && sisa<=0; sebagian = !lunas && (paid||0)>0; } // dari sisa (sudah dijepit) — tahan status DB basi
  else { lunas=b.status==='lunas'; sebagian=b.status==='sebagian'; }
  let bg='#FBF1D8',fg='#8A5B0E',label='Belum bayar';
  if(lunas){bg='#E4F0E8';fg='#1D6B4F';label='Lunas';}
  else if(sebagian){bg='#E6EEF6';fg='#1B4E7A';label='Sebagian';}
  return `<span class="o-badge" style="background:${bg};color:${fg}">${label}</span>`;
}
async function loadBills(){
  billLoading=true;
  if(suppliersCache===null){ const { data }=await sb.from('suppliers').select('id,nama').order('nama'); suppliersCache=data||[]; }
  if(ordersCache===null){
    const { data:bs }=await sb.from('buyers').select('id,nama').order('nama'); buyersCache=bs||[];
    const { data:os }=await sb.from('orders').select('id,no_order,status,nilai_jual,nilai_sample,total_bayar_buyer,tanggal_order,buyer_id,catatan,items,po_masuk_no').order('created_at',{ascending:false});
    const bmap={}; (buyersCache||[]).forEach(b=>bmap[b.id]=b.nama);
    ordersCache=(os||[]).map(o=>({...o, buyer_name:bmap[o.buyer_id]||'—'}));
  }
  let { data, error:bErr }=await sb.from('supplier_bills').select('id,no_tagihan,po_id,order_id,supplier_id,nilai,tanggal_terima,jatuh_tempo,jenis,status,items,pakai_ppn,suppliers(nama),orders(no_order)').order('created_at',{ascending:false});
  if(bErr){ const r=await sb.from('supplier_bills').select('id,no_tagihan,po_id,order_id,supplier_id,nilai,tanggal_terima,jatuh_tempo,jenis,status,suppliers(nama),orders(no_order)').order('created_at',{ascending:false}); data=r.data; }
  billsCache=(data||[]).map(b=>({...b, supplier_name:b.suppliers?b.suppliers.nama:'—', order_no:b.orders?b.orders.no_order:'—'}));
  // Backfill sekali: PO keluar lama yang belum punya tagihan → buatkan hutang (tidak menyentuh data lain).
  if(!poBillBackfilled){
    poBillBackfilled=true;
    try{
      const { data:allPOs }=await sb.from('purchase_orders').select('id,order_id,supplier_id,no_po,total,items,jatuh_tempo,tanggal,deadline_kirim,pakai_ppn');
      const have=new Set(billsCache.filter(b=>b.po_id).map(b=>b.po_id));
      const missing=(allPOs||[]).filter(p=>!have.has(p.id));
      if(missing.length){
        // Hanya buat tagihan (hutang) — TIDAK mencatat pembayaran otomatis, supaya tidak dobel dengan
        // pembayaran yang mungkin sudah Anda catat manual. Bayar tagihan lewat menu Pembayaran.
        for(const p of missing){
          await syncBillFromPO({ id:p.id, order_id:p.order_id, supplier_id:p.supplier_id, no_po:p.no_po, total:p.total, items:p.items, jatuh_tempo:p.jatuh_tempo, tanggal:p.tanggal, deadline_kirim:p.deadline_kirim, pakai_ppn:p.pakai_ppn });
        }
        let { data:d2 }=await sb.from('supplier_bills').select('id,no_tagihan,po_id,order_id,supplier_id,nilai,tanggal_terima,jatuh_tempo,jenis,status,items,pakai_ppn,suppliers(nama),orders(no_order)').order('created_at',{ascending:false});
        if(d2) billsCache=d2.map(b=>({...b, supplier_name:b.suppliers?b.suppliers.nama:'—', order_no:b.orders?b.orders.no_order:'—'}));
        // Tagihan/pembayaran baru dibuat → segarkan cache laporan & arus kas.
        vsData=null; txData=null; hppCache=null; dashData=null; finReport=null; orderFinance=null; ledgerCache=null;
      }
    }catch(e){ console.error('backfill PO→tagihan gagal', e); }
  }
  const { data:pays }=await sb.from('bill_payments').select('id,bill_id,tanggal,jumlah,transaction_id').order('tanggal');
  const paid={}, payMap={}; (pays||[]).forEach(p=>{ paid[p.bill_id]=(paid[p.bill_id]||0)+(Number(p.jumlah)||0); (payMap[p.bill_id]||(payMap[p.bill_id]=[])).push(p); });
  billsCache.forEach(b=>{ b.paid=paid[b.id]||0; const s=(Number(b.nilai)||0)-b.paid; b.sisa=Math.abs(s)<1?0:Math.round(s); b.payments=payMap[b.id]||[]; }); // jepit sisa <1 rupiah ke 0 (hindari "-0" & status keliru)
  billLoading=false;
  render();
}

async function resolveBuyerId(name){
  const found=(buyersCache||[]).find(b=>(b.nama||'').toLowerCase()===name.toLowerCase());
  if(found) return { id:found.id };
  const { data:nb, error }=await sb.from('buyers').insert({nama:name}).select('id,nama').single();
  if(error) return { error:error.message };
  (buyersCache=buyersCache||[]).push(nb);
  return { id:nb.id };
}
async function loadShipments(){

  if(buyersCache===null){ const { data:bs }=await sb.from('buyers').select('id,nama,alamat,kontak').order('nama'); buyersCache=bs||[]; }
  if(ordersCache===null){
    const { data:os }=await sb.from('orders').select('id,no_order,status,buyer_id,items').order('created_at',{ascending:false});
    const bmap={}; (buyersCache||[]).forEach(b=>bmap[b.id]=b.nama);
    ordersCache=(os||[]).map(o=>({...o, buyer_name:bmap[o.buyer_id]||'—'}));
  }

  shipCache=(ss||[]).map(s=>({...s, buyer_name:s.buyers?s.buyers.nama:'—', buyer_alamat:(s.ship_alamat!=null&&s.ship_alamat!=='')?s.ship_alamat:(s.buyers?s.buyers.alamat:''), buyer_kontak:(s.ship_kontak!=null&&s.ship_kontak!=='')?s.ship_kontak:(s.buyers?s.buyers.kontak:''), order_no:s.orders?s.orders.no_order:null, order_po_masuk:s.orders?s.orders.po_masuk_no:null}));

function fmtShort(n){ n=Number(n)||0; const s=n<0?'-':''; const a=Math.abs(n);
  if(a>=1e9) return s+(a/1e9).toFixed(a>=1e10?0:1).replace('.0','')+'M';
  if(a>=1e6) return s+Math.round(a/1e6)+'jt';
  if(a>=1e3) return s+Math.round(a/1e3)+'rb';
  return s+Math.round(a); }
function rpKpi(n){ n=Number(n)||0; const s=n<0?'-':''; const a=Math.abs(n);
  if(a>=1e9) return s+'Rp'+(a/1e9).toFixed(1).replace('.',',').replace(',0','')+' M';
  if(a>=1e6) return s+'Rp'+(a/1e6).toFixed(1).replace('.',',').replace(',0','')+' jt';
  if(a>=1e3) return s+'Rp'+Math.round(a/1e3)+' rb';
  return s+'Rp'+Math.round(a); }
function prevMonthOf(mo){ const i=state.months.indexOf(mo); return i>0?state.months[i-1]:null; }
function kpiTrend(cur,prev,goodUp){
  if(prev==null) return `<div class="kpi-trend flat">${ic('minus',15)}—<span class="lbl">bulan pertama</span></div>`;
  const diff=cur-prev, flat=Math.abs(diff)<0.5;
  const pct = prev!==0 ? Math.round(Math.abs(diff)/Math.abs(prev)*1000)/10 : (cur!==0?100:0);
  const up=diff>0;
  const cls = flat?'flat':((goodUp?up:!up)?'up':'down');
  const icon = flat?'minus':(up?'arrow-up-right':'arrow-down-right');
  const sign = flat?'':(up?'+':'−');
  return `<div class="kpi-trend ${cls}">${ic(icon,15)}${sign}${pct}%<span class="lbl">vs bulan lalu</span></div>`;
}
function areaChartSVG(){
  const months=state.months.slice(-9);
  if(!months.length) return `<div class="empty">Belum ada data bulan</div>`;
  const sales=months.map(m=>totalPenjualanAll(m)), exp=months.map(m=>totalBiayaAll(m));
  const W=720,H=250,Pl=54,Pr=14,Pt=14,Pb=30, iw=W-Pl-Pr, ih=H-Pt-Pb, n=months.length;
  const max=Math.max(1,...sales,...exp);
  const X=i=> n<=1?Pl+iw/2:Pl+iw*i/(n-1);
  const Y=v=> Pt+ih*(1-v/max);
  let grid='',ylab='';
  for(let g=0;g<=4;g++){ const val=max*g/4,y=Y(val);
    grid+=`<line x1="${Pl}" y1="${y.toFixed(1)}" x2="${W-Pr}" y2="${y.toFixed(1)}" stroke="#EDEFEC"/>`;
    ylab+=`<text x="${Pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="cx">${fmtShort(val)}</text>`; }
  let xlab=''; months.forEach((m,i)=>{ xlab+=`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle" class="cx">${esc(m.split(' ')[0].slice(0,3))}</text>`; });
  const pts=arr=>arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const base=(Pt+ih).toFixed(1);
  const area=n>1?`<polygon points="${X(0).toFixed(1)},${base} ${pts(sales)} ${X(n-1).toFixed(1)},${base}" fill="#DDF3E5"/>`:'';
  const sLine=n>1?`<polyline points="${pts(sales)}" fill="none" stroke="#12A150" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const eLine=n>1?`<polyline points="${pts(exp)}" fill="none" stroke="#E08A00" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`:'';
  const dots=sales.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4:2.5}" fill="#12A150"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter',sans-serif"><style>.cx{font-size:10px;fill:#94A29A}</style>${grid}${area}${eLine}${sLine}${dots}${ylab}${xlab}</svg>`;
}
function barChartSVG(){
  const mo=state.currentMonth;
  const data=state.buyers.map(b=>({name:b.name,val:salesData(mo,b.id).total})).sort((a,b)=>b.val-a.val).slice(0,6);
  if(!data.length) return `<div class="empty">Belum ada buyer</div>`;
  const W=430,H=250,Pl=46,Pr=8,Pt=14,Pb=48, iw=W-Pl-Pr, ih=H-Pt-Pb, n=data.length;
  const max=Math.max(1,...data.map(d=>d.val));
  const gap=iw/n, bw=Math.min(46,gap*0.6);
  const colors=['#12A150','#2F8FDA','#E08A00','#7C5CD6','#E8455C','#0DA090'];
  let grid='',ylab='';
  for(let g=0;g<=4;g++){ const val=max*g/4,y=Pt+ih*(1-g/4);
    grid+=`<line x1="${Pl}" y1="${y.toFixed(1)}" x2="${W-Pr}" y2="${y.toFixed(1)}" stroke="#EDEFEC"/>`;
    ylab+=`<text x="${Pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="cx">${fmtShort(val)}</text>`; }
  let bars='';
  data.forEach((d,i)=>{ const x=Pl+gap*i+(gap-bw)/2, h=Math.max(0,ih*d.val/max), y=Pt+ih-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${colors[i%colors.length]}"/>`;
    const nm=d.name.length>9?d.name.slice(0,8)+'…':d.name;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-16}" text-anchor="middle" class="cx">${esc(nm)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter',sans-serif"><style>.cx{font-size:10px;fill:#94A29A}</style>${grid}${bars}${ylab}</svg>`;
}
async function loadDashboard(){
  // Ringkasan memakai METODE NETTO yang SAMA PERSIS dengan menu Laporan (loadFinReport) & HPP (viewHppModule):
  //   penjualan bersih (DPP) = njNettoCalc per order (ongkir bebas PPN);  PPN = gross − netto;
  //   HPP = (v.hpp − PPN masukan) + OPS pemenuhan PO;  Beban = costBucket 'beban' (OPS PO tidak dobel);
  //   laba kotor = netto − HPP;  profit = laba kotor − beban + pendapatan lain. Supaya angka lintas-laporan cocok.
  const sel=async(t,c)=>{ try{ const { data }=await sb.from(t).select(c); return data||[]; }catch(e){ return []; } };
  const [ords,bs,vs,tx,bills]=await Promise.all([
    sel('orders','id,tanggal_order,buyer_id,items,status'),
    sel('buyers','id,nama'),
    getVS(),
    getTX(),
    sel('supplier_bills','id,order_id,jenis,items,pakai_ppn')
  ]);
  const n=x=>Number(x)||0;
  const bmap={}; bs.forEach(b=>bmap[b.id]=b.nama);
  const omap={}; ords.forEach(o=>{ omap[o.id]=o; });
  const oMonth=id=> String((omap[id]||{}).tanggal_order||'').slice(0,7);
  const oOngkir={}; ords.forEach(o=>{ oOngkir[o.id]=ongkirTotal(o.items); });
  const inVatByOrd={}; bills.forEach(b=>{ if(b.jenis==='pemenuhan_po'&&b.order_id) inVatByOrd[b.order_id]=(inVatByOrd[b.order_id]||0)+billInputVat(b); }); // PPN masukan (kredit)
  const ym = finMonth==='all'?null:finMonth;
  const inMoTx=t=> !ym || String(t.tanggal||'').slice(0,7)===ym;
  // Grafik tren — SELALU semua bulan (penjualan gross per bulan order; biaya = beban per bulan transaksi)
  const perMonth={};
  vs.filter(v=>v.status!=='batal').forEach(v=>{ const m=oMonth(v.id); if(m)(perMonth[m]||(perMonth[m]={penjualan:0,biaya:0})).penjualan+=n(v.nilai_jual); });
  tx.forEach(t=>{ if(costBucket(t)==='beban'){ const m=(t.tanggal||'').slice(0,7); if(m)(perMonth[m]||(perMonth[m]={penjualan:0,biaya:0})).biaya+=n(t.jumlah); } });
  // KPI + per-buyer — periode aktif; iterasi atas v_order_summary (sama dgn Laporan)
  const nb=vs.filter(v=> v.status!=='batal' && (!ym || oMonth(v.id)===ym));
  let penjualanGross=0,penjualanNetto=0,piutang=0,hppRaw=0;
  const perBuyer={};
  nb.forEach(v=>{
    const nj=n(v.nilai_jual), netto=njNettoCalc(v.nilai_jual, oOngkir[v.id]);
    const rawNetto=n(v.hpp)-(inVatByOrd[v.id]||0), pi=n(v.piutang), by=(v.masuk_buyer!=null?n(v.masuk_buyer):Math.max(0,nj-pi));
    penjualanGross+=nj; penjualanNetto+=netto; piutang+=pi; hppRaw+=rawNetto;
    const bn=bmap[(omap[v.id]||{}).buyer_id]||'—';
    const pb=perBuyer[bn]||(perBuyer[bn]={penjualan:0,dibayar:0,piutang:0,hpp:0});
    pb.penjualan+=nj; pb.dibayar+=by; pb.piutang+=pi; pb.hpp+=rawNetto; // + OPS PO disematkan di bawah
  });
  const jumlahOrder=nb.length;
  const ppn=penjualanGross-penjualanNetto;
  // Transaksi periode aktif: kas, OPS pemenuhan PO (→HPP), beban usaha, pendapatan lain, sample gratis.
  let masuk=0,keluar=0,biaya=0,opsPo=0,lainMasuk=0,sampleGratis=0;
  const opsByOrd={};
  tx.filter(inMoTx).forEach(t=>{ const j=n(t.jumlah), bkt=costBucket(t);
    if(t.arah==='masuk')masuk+=j; else if(t.arah==='keluar')keluar+=j;
    if(bkt==='ops_po'){ opsPo+=j; if(t.order_id) opsByOrd[t.order_id]=(opsByOrd[t.order_id]||0)+j; }
    else if(bkt==='beban'){ biaya+=j; if(/sample/i.test(t.kategori||'')) sampleGratis+=j; }
    if(t.arah==='masuk' && t.jenis==='lain') lainMasuk+=j;
  });
  Object.keys(opsByOrd).forEach(oid=>{ const bn=bmap[(omap[oid]||{}).buyer_id]||'—'; if(perBuyer[bn]) perBuyer[bn].hpp+=opsByOrd[oid]; });
  const hpp=hppRaw+opsPo;
  const labaKotor=penjualanNetto-hpp;
  const labaBersih=labaKotor-biaya+lainMasuk;
  dashData={penjualan:penjualanGross,piutang,hpp,laba:labaKotor,biaya,lainMasuk,sampleGratis,saldoKas:masuk-keluar,ppn,labaBersih,jumlahOrder,perBuyer,perMonth,periode:ym};
  render();
}
function ymLabel(ym){ const m=parseInt(ym.slice(5,7),10); return (EN_MONTHS[m-1]||ym).slice(0,3); }
function dashAreaSVG(perMonth){
  const keys=Object.keys(perMonth).sort();
  if(!keys.length) return `<div class="empty" style="padding:24px;text-align:center;color:var(--ink-soft)">Belum ada data order</div>`;
  const sales=keys.map(k=>perMonth[k].penjualan), exp=keys.map(k=>perMonth[k].biaya);
  const W=720,H=250,Pl=54,Pr=14,Pt=14,Pb=30,iw=W-Pl-Pr,ih=H-Pt-Pb,n=keys.length;
  const max=Math.max(1,...sales,...exp);
  const X=i=> n<=1?Pl+iw/2:Pl+iw*i/(n-1);
  const Y=v=> Pt+ih*(1-v/max);
  let grid='',ylab='';
  for(let g=0;g<=4;g++){ const val=max*g/4,y=Y(val);
    grid+=`<line x1="${Pl}" y1="${y.toFixed(1)}" x2="${W-Pr}" y2="${y.toFixed(1)}" stroke="#EDEFEC"/>`;
    ylab+=`<text x="${Pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="cx">${fmtShort(val)}</text>`; }
  let xlab=''; keys.forEach((k,i)=>{ xlab+=`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle" class="cx">${esc(ymLabel(k))}</text>`; });
  const pts=arr=>arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const base=(Pt+ih).toFixed(1);
  const area=n>1?`<polygon points="${X(0).toFixed(1)},${base} ${pts(sales)} ${X(n-1).toFixed(1)},${base}" fill="#DDF3E5"/>`:'';
  const sLine=n>1?`<polyline points="${pts(sales)}" fill="none" stroke="#12A150" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const eLine=n>1?`<polyline points="${pts(exp)}" fill="none" stroke="#E08A00" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`:'';
  const dots=sales.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4:2.5}" fill="#12A150"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter',sans-serif"><style>.cx{font-size:10px;fill:#94A29A}</style>${grid}${area}${eLine}${sLine}${dots}${ylab}${xlab}</svg>`;
}
function dashBarSVG(perBuyer){
  const data=Object.keys(perBuyer).map(nm=>({name:nm,val:perBuyer[nm].penjualan})).sort((a,b)=>b.val-a.val).slice(0,6);
  if(!data.length) return `<div class="empty" style="padding:24px;text-align:center;color:var(--ink-soft)">Belum ada buyer</div>`;
  const W=430,H=250,Pl=46,Pr=8,Pt=14,Pb=48,iw=W-Pl-Pr,ih=H-Pt-Pb,n=data.length;
  const max=Math.max(1,...data.map(d=>d.val));
  const gap=iw/n, bw=Math.min(46,gap*0.6);
  const colors=['#12A150','#2F8FDA','#E08A00','#7C5CD6','#E8455C','#0DA090'];
  let grid='',ylab='';
  for(let g=0;g<=4;g++){ const val=max*g/4,y=Pt+ih*(1-g/4);
    grid+=`<line x1="${Pl}" y1="${y.toFixed(1)}" x2="${W-Pr}" y2="${y.toFixed(1)}" stroke="#EDEFEC"/>`;
    ylab+=`<text x="${Pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="cx">${fmtShort(val)}</text>`; }
  let bars='';
  data.forEach((d,i)=>{ const x=Pl+gap*i+(gap-bw)/2, h=Math.max(0,ih*d.val/max), y=Pt+ih-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${colors[i%colors.length]}"/>`;
    const nm=d.name.length>9?d.name.slice(0,8)+'…':d.name;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-16}" text-anchor="middle" class="cx">${esc(nm)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter',sans-serif"><style>.cx{font-size:10px;fill:#94A29A}</style>${grid}${bars}${ylab}</svg>`;
}

async function loadOrderFinance(){
  const tx=await getTX();
  let masuk=0, bayarSupplier=0, biaya=0, modal=0;
  (tx||[]).forEach(t=>{ const j=Number(t.jumlah)||0;
    if(t.arah==='masuk' && (t.jenis==='dp'||t.jenis==='pelunasan')) masuk+=j;
    else if(t.arah==='keluar' && t.jenis==='bayar_hutang') bayarSupplier+=j;
    else if(t.arah==='keluar' && t.jenis==='biaya_usaha') biaya+=j;
    else if(t.jenis==='modal') modal+=j;
  });
  const { data:os }=await sb.from('orders').select('nilai_jual,total_bayar_buyer,status');
  let nilaiOrder=0, piutang=0, jumlahOrder=0;
  (os||[]).forEach(o=>{ if(o.status==='batal') return; jumlahOrder++;
    const nj=Number(o.nilai_jual)||0, by=Number(o.total_bayar_buyer)||0;
    nilaiOrder+=nj; piutang+=Math.max(0,nj-by);
  });
  let hpp=0, laba=0;
  const { data:vs }=await sb.from('v_order_summary').select('hpp,laba');
  (vs||[]).forEach(v=>{ hpp+=Number(v.hpp)||0; laba+=Number(v.laba)||0; });
  orderFinance={masuk,bayarSupplier,biaya,modal,nilaiOrder,piutang,jumlahOrder,hpp,laba};
  render();
}

function tempoText(c){
  if(c.status==='lunas') return `<div class="tempo-note ok">Order sudah lunas.</div>`;
  if(!c.jatuhTempo) return `<div class="tempo-note ok">Jatuh tempo belum ditentukan (isi tanggal kirim).</div>`;
  const d=c.daysLeft;
  if(d===null) return '';
  if(d>1) return `<div class="tempo-note soon">Sisa tempo <b>${d} hari lagi</b> (jatuh tempo ${c.jatuhTempo}).</div>`;
  if(d===1) return `<div class="tempo-note soon">Jatuh tempo <b>besok</b> (${c.jatuhTempo}).</div>`;
  if(d===0) return `<div class="tempo-note over">Jatuh tempo <b>hari ini</b> (${c.jatuhTempo}).</div>`;
  return `<div class="tempo-note over">Sudah <b>lewat tempo ${Math.abs(d)} hari</b> (jatuh tempo ${c.jatuhTempo}).</div>`;
}

async function saveSampleGratisCost(){
  const err=document.getElementById('sgErr'); if(err){ err.textContent=''; err.style.color='var(--danger)'; }
  const oid=pjOrderId||openOrderId;
  const jumlah=Number(document.getElementById('sgCost').value)||0;
  const note=document.getElementById('sgNote').value.trim();
  if(jumlah<=0){ if(err) err.textContent='Isi biaya sample (lebih dari 0).'; return; }
  const btn=document.getElementById('sgSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const { error }=await sb.from('transactions').insert({ tanggal:today(), arah:'keluar', jenis:'biaya_usaha', jumlah, order_id:oid, kategori:'Sample gratis / marketing', catatan:note||null });
  if(error){ if(err) err.textContent='Gagal: '+error.message; btn.disabled=false; btn.textContent='Catat sebagai Biaya usaha (marketing)'; return; }
  delete orderSummary[oid]; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; ledgerCache=null;
  document.getElementById('sgCost').value=''; document.getElementById('sgNote').value='';
  btn.disabled=false; btn.textContent='Catat sebagai Biaya usaha (marketing)';
  if(err){ err.style.color='#1D6B4F'; err.textContent='Tersimpan sebagai Biaya usaha ✓'; }
}

// ---- PIUTANG ----
function tempoInline(c){
  if(c.status==='lunas') return '<span class="who">lunas</span>';
  if(!c.jatuhTempo) return '<span class="who">belum ada tgl</span>';
  const d=c.daysLeft;
  if(d===null) return '';
  if(d>1) return `<span class="tempo-note soon">${d} hari lagi</span>`;
  if(d===1) return `<span class="tempo-note soon">besok</span>`;
  if(d===0) return `<span class="tempo-note over">hari ini</span>`;
  return `<span class="tempo-note over">lewat ${Math.abs(d)} hari</span>`;
}
function viewPiutang(){
  const mo=state.currentMonth;
  const rows=[];
  state.buyers.forEach(b=>{
    getOrders(mo,b.id).forEach(o=>{
      const c=orderCalc(o);
      if(c.sisa>0.5){
        const statusPill = c.status==='dp'?'<span class="pill dp">DP</span>':'<span class="pill belum">Belum bayar</span>';
        rows.push(`<tr>
          <td class="txt">${b.name}</td>
          <td class="txt">Inv ${o.noInvoice||'(tanpa no)'}<div class="who">PI ${o.noPI||'-'} · ${statusPill}</div></td>
          <td class="txt">${o.tglKirim||'-'}</td>
          <td class="txt">${c.jatuhTempo||'-'}<div>${tempoInline(c)}</div></td>
          <td class="num">${rp(c.totalTagihan)}</td>
          <td class="num">${rp(c.dibayar)}<div class="who">DP ${o.dpPct||0}%</div></td>
          <td class="num">${rp(c.sisa)}</td>
        </tr>`);
      }
    });
  });
  return `
  <h2 class="sec">Piutang — ${mo}</h2>
  <p class="note">Order yang belum lunas (sisa &gt; 0). Piutang = Total tagihan − total pembayaran diterima. Detail sama dengan blok "Sisa piutang" di tiap order.</p>
  <div class="card">
    <table>
      <tr><th>Buyer</th><th>Invoice / status</th><th>Tgl kirim</th><th>Jatuh tempo</th><th class="num">Total tagihan</th><th class="num">Dibayar</th><th class="num">Sisa piutang</th></tr>
      ${rows.join('')||'<tr><td colspan="7" class="empty">Tidak ada piutang. Semua order lunas 🎉</td></tr>'}
      <tr class="total"><td colspan="6">Total piutang</td><td class="num">${rp(piutangAll(mo))}</td></tr>
    </table>
  </div>`;
}

function defaultNotes(o, isPI){
  const c=orderCalc(o);
  const dp=o.dpPct||0, rem=100-dp;
  const dpNow=Math.round(c.totalTagihan*dp/100);
  const remaining=c.totalTagihan-dpNow;
  const po=o.noPO?(' as agreed per PO No. '+o.noPO):'';
  if(isPI){
    return [
      `This Proforma Invoice covers the ${dp}% Down Payment${po}.`,
      `The remaining ${rem}% (Final Payment) of Rp ${remaining.toLocaleString('id-ID')} will be billed via a separate Invoice after the goods are shipped.`,
      `Please include the document number (${o.noPI||'-'}) as the payment reference.`
    ];
  }
  return [
    `This Invoice bills the ${rem}% Final Payment (settlement)${po}.`,
    `The ${dp}% Down Payment of Rp ${dpNow.toLocaleString('id-ID')} has been paid previously (PI ${o.noPI||'-'}).`,
    `Please include the invoice number (${o.noInvoice||'-'}) as the payment reference.`
  ];
}
function renderOverlay(){
  const mount=document.getElementById('overlayMount');
  if(!editing.doc){ mount.innerHTML=''; return; }
  const {kind,buyerId,orderId}=editing.doc;
  const mo=state.currentMonth;
  const buyer=state.buyers.find(b=>b.id===buyerId);
  const o=findOrder(mo,buyerId,orderId);
  if(!buyer||!o){ mount.innerHTML=''; return; }
  const c=orderCalc(o);
  const s=state.seller||{};
  const isPI = kind==='PI';
  const dpNow = Math.round(c.totalTagihan*(o.dpPct||0)/100);
  const remaining = c.totalTagihan - dpNow;
  const docNo = isPI ? (o.noPI||'-') : (o.noInvoice||'-');
  const docDate = isPI ? o.tglOrder : (o.invoiceDate||o.tglKirim||o.tglOrder);

  const itemRows=(o.items||[]).map((r,i)=>`
    <tr><td class="c">${i+1}</td><td class="t">${esc(r.desc)}</td><td class="t">${esc(r.pack||'')}</td><td class="c">${r.qty} ${r.unit||''}</td>
    <td class="r">${(Number(r.harga)||0).toLocaleString('id-ID')}</td><td class="r">${(r.qty*r.harga).toLocaleString('id-ID')}</td></tr>`).join('');
  const blankRows = Array.from({length:Math.max(0,3-(o.items||[]).length)}).map(()=>`<tr><td class="c">&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>`).join('');

  const notesArr = defaultNotes(o,isPI);
  const extraNotes = (s.notes||'').trim();
  const notesHtml = `<ol>${notesArr.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>`
    + (extraNotes ? `<div class="free">${esc(extraNotes)}</div>` : '');

  const buyerAddr = (buyer.alamat||'').trim();

  const profForm = editing.docEdit ? `
    <div class="profedit no-print">
      <div class="shead" style="margin-bottom:8px;">Info penjual (dipakai di semua dokumen)</div>
      <div class="fieldgrid">
        <div><label>Brand</label><input id="sBrand" value="${esc(s.brand)}"></div>
        <div><label>Nama badan hukum</label><input id="sLegal" value="${esc(s.legal)}"></div>
        <div><label>Website</label><input id="sWeb" value="${esc(s.website)}"></div>
        <div><label>Telepon</label><input id="sTelp" value="${esc(s.telp)}"></div>
        <div><label>NPWP penjual</label><input id="sNpwp" value="${esc(s.npwp)}"></div>
        <div><label>Kota (tanda tangan)</label><input id="sKota" value="${esc(s.kota)}"></div>
        <div><label>Nama penanda tangan</label><input id="sSigner" value="${esc(s.signer)}"></div>
        <div style="grid-column:1/-1;"><label>Alamat penjual</label><input id="sAlamat" value="${esc(s.alamat)}"></div>
      </div>
      <div class="shead" style="margin:14px 0 8px;">Rekening pembayaran</div>
      <div class="fieldgrid">
        <div><label>Nama bank</label><input id="sBank" value="${esc(s.bankName)}"></div>
        <div><label>Atas nama</label><input id="sBankNm" value="${esc(s.bankAccName)}"></div>
        <div><label>No. rekening</label><input id="sBankNo" value="${esc(s.bankAccNo)}"></div>
      </div>
      <div class="shead" style="margin:14px 0 8px;">Catatan tambahan / Additional notes (opsional — ditambahkan setelah 3 poin otomatis)</div>
      <div class="fieldgrid"><div style="grid-column:1/-1;"><textarea id="sNotes" rows="4" style="width:100%;border:1px solid var(--paper-line);border-radius:6px;padding:8px;font-family:'Inter',sans-serif;font-size:13px;background:#FCFAF3;">${esc(s.notes)}</textarea></div></div>
      <div class="shead" style="margin:14px 0 8px;">Info pembeli: ${buyer.name}</div>
      <div class="fieldgrid">
        <div><label>NPWP pembeli</label><input id="bNpwp" value="${esc(buyer.npwp)}"></div>
        <div style="grid-column:1/-1;"><label>Alamat pembeli</label><input id="bAlamat" value="${esc(buyer.alamat)}"></div>
      </div>
      <div class="form-row"><button data-save-prof="1">Simpan info</button><button class="cancel" data-cancel-prof="1">Tutup</button></div>
    </div>` : '';

  mount.innerHTML=`
  <div class="overlay">
    <div class="doc-wrap">
      <div class="doc-bar no-print">
        <button class="edit" data-edit-prof="1">Edit info penjual/pembeli</button>
        <button class="edit" data-po-ttd="1">${s.ttd?'Ganti tanda tangan':'Tambah tanda tangan'}</button>
        <button class="print" data-print="1">Print / Simpan PDF</button>
        <button class="close" data-close-doc="1">Tutup</button>
      </div>
      <div id="printArea">
        <div class="inv inv-sale">
          <div class="inv-head">
            <div class="inv-brand">
              ${invLogo()}
              <div class="txt">
                <div class="b">${esc(s.brand)||'TROPICA FARM'}</div>
                <div class="l">${esc(s.legal)}</div>
                <div class="a">${esc(s.alamat)}</div>
              </div>
            </div>
            <a class="inv-web">${esc(s.website)}</a>
          </div>
          <div class="inv-rule"></div>

          <div class="inv-title">${isPI?'PROFORMA INVOICE':'INVOICE'}</div>
          <div class="inv-banner">${isPI?`DOWN PAYMENT ${o.dpPct||0}%`:`FINAL PAYMENT ${100-(o.dpPct||0)}%`}</div>

          <div class="inv-info">
            <div class="left">
              <div class="r"><span class="k">${isPI?'PI No.':'Invoice No.'}</span><span>${docNo}</span></div>
              <div class="r"><span class="k">${isPI?'PI Date':'Invoice Date'}</span><span>${fmtLong(docDate)}</span></div>
              <div class="r"><span class="k">PO Reference</span><span>${o.noPO||'-'}</span></div>
              <div class="r"><span class="k">Payment Term</span><span>${isPI?`${o.dpPct||0}% DP (Down Payment)`:`${100-(o.dpPct||0)}% Final Payment`}</span></div>
              <div class="r"><span class="k">Ship Date</span><span>${fmtLong(o.tglKirim)}</span></div>
            </div>
            <div class="right">
              <div class="k">BILL TO</div>
              <div class="nm">${esc(buyer.name)}</div>
              ${buyerAddr?`<div class="ad">${esc(buyerAddr)}</div>`:''}
              ${buyer.npwp?`<div class="ad">NPWP: ${esc(buyer.npwp)}</div>`:''}
            </div>
          </div>

          <table class="inv-tbl">
            <tr><th style="width:38px;">No.</th><th>Description</th><th style="width:124px;">Pack Size</th><th style="width:74px;">Qty</th><th style="width:104px;">Unit Price (Rp)</th><th style="width:140px;">Total (Rp)</th></tr>
            ${itemRows||''}
            ${blankRows}
            <tr class="sum"><td></td><td></td><td></td><td></td><td class="lbl">Sub Total</td><td class="r">${mcell(c.subtotalBarang)}</td></tr>
            <tr class="sum"><td></td><td></td><td></td><td></td><td class="lbl">Tax (11%)</td><td class="r">${mcell(c.ppn)}</td></tr>
            <tr class="sum"><td></td><td></td><td></td><td></td><td class="lbl">Shipping</td><td class="r">${mcell(c.ongkir)}</td></tr>
            <tr class="grand"><td></td><td></td><td></td><td></td><td class="lbl">TOTAL</td><td class="r">${mcell(c.totalTagihan)}</td></tr>
          </table>

          <div class="inv-due"><span>AMOUNT DUE NOW — ${isPI?`${o.dpPct||0}% DOWN PAYMENT`:`${100-(o.dpPct||0)}% FINAL PAYMENT`}</span>${mcell(isPI?dpNow:remaining)}</div>
          ${isPI
            ? `<div class="inv-note-line">Due max. ${o.tempoDpHari!=null?o.tempoDpHari:3} days after PI date. Remaining Rp ${remaining.toLocaleString('id-ID')} (Final Payment) will be billed via a separate Invoice after the goods are shipped.</div>`
            : `<div class="inv-breakdown"><span>Total Order Value</span><span>Rp ${Math.round(c.totalTagihan).toLocaleString('id-ID')}</span></div>
          <div class="inv-breakdown"><span>Down Payment ${o.dpPct||0}% already paid (PI ${esc(o.noPI)||'-'})</span><span>— Rp ${dpNow.toLocaleString('id-ID')}</span></div>
          <div class="inv-note-line">Due max. ${o.tempoHari||7} days after the goods are received (${fmtLong(addDays(docDate, o.tempoHari||7))}).</div>`}

          <div class="inv-sec-h">PAYMENT INSTRUCTIONS</div>
          <table class="inv-pay">
            <tr><td class="k">Bank Name</td><td>${esc(s.bankName)||'-'}</td></tr>
            <tr><td class="k">Account Name</td><td>${esc(s.bankAccName)||'-'}</td></tr>
            <tr><td class="k">Account Number</td><td>${esc(s.bankAccNo)||'-'}</td></tr>
          </table>

          <div class="inv-sec-h">NOTES</div>
          <div class="inv-notes">${notesHtml}</div>

          <div class="inv-sign">
            <div class="city">${esc(s.kota)||'Purwakarta'}, ${fmtLong(docDate)}</div>
            <div class="co">${esc(s.legal)||esc(s.brand)}</div>
            ${s.ttd?`<img class="inv-ttd" src="${s.ttd}" alt="Tanda tangan">`:`<div class="sp"></div>`}

            <div class="nm">${esc(s.signer)||''}</div>
          </div>
        </div>
      </div>
      ${profForm}
    </div>
  </div>`;

  mount.querySelector('[data-close-doc]').onclick=()=>{ delete editing.doc; delete editing.docEdit; renderOverlay(); };
  mount.querySelector('[data-print]').onclick=()=>window.print();
  const ovEl=mount.querySelector('.overlay');
  const ttdBtn=mount.querySelector('[data-po-ttd]'); if(ttdBtn) ttdBtn.onclick=()=>openSignaturePad(url=>applyTtdToOverlay(ovEl,url));
  mount.querySelector('[data-edit-prof]').onclick=()=>{ editing.docEdit=true; renderOverlay(); };
  const cp=mount.querySelector('[data-cancel-prof]'); if(cp) cp.onclick=()=>{ delete editing.docEdit; renderOverlay(); };
  const sp=mount.querySelector('[data-save-prof]'); if(sp) sp.onclick=async()=>{
    state.seller={
      ...state.seller,
      brand:val('sBrand'), legal:val('sLegal'), website:val('sWeb'), telp:val('sTelp'),

    };
    buyer.npwp=val('bNpwp'); buyer.alamat=val('bAlamat');
    await saveSeller(); await saveBuyers();
    delete editing.docEdit; renderOverlay();
  };
  const ov=mount.querySelector('.overlay');
  ov.onclick=(e)=>{ if(e.target===ov){ delete editing.doc; delete editing.docEdit; renderOverlay(); } };
}

function bindEvents(){
  const c=document.getElementById('content');

  // modal
  c.querySelectorAll('[data-del-capital]').forEach(el=>el.onclick=async()=>{ state.capital=state.capital.filter(r=>r.id!==el.dataset.delCapital); await saveCapital(); render(); });
  const addCap=c.querySelector('[data-add="capital"]');
  if(addCap) addCap.onclick=async()=>{ const name=val('capName'),note=val('capNote'),amount=num('capAmount'); if(!name||!amount)return; state.capital.push({id:uid(),name,note,amount,by:who()}); await saveCapital(); render(); };

  // buyer delete
  c.querySelectorAll('[data-del-buyer]').forEach(el=>el.onclick=async()=>{
    if(el.dataset.confirming!=='1'){ el.dataset.confirming='1'; el.textContent='klik lagi untuk hapus'; setTimeout(()=>{el.dataset.confirming='0';el.textContent='hapus buyer';},3000); return; }
    state.buyers=state.buyers.filter(b=>b.id!==el.dataset.delBuyer); await saveBuyers(); render();
  });

  // cash
  c.querySelectorAll('[data-add-cash]').forEach(el=>el.onclick=()=>cashSubmit(el.dataset.addCash,null));
  c.querySelectorAll('[data-update-cash]').forEach(el=>el.onclick=()=>cashSubmit(el.dataset.updateCash,el.dataset.row));
  c.querySelectorAll('[data-edit-cash]').forEach(el=>el.onclick=()=>{ const[b,r]=el.dataset.editCash.split(':'); editing['cash_'+b]=r; render(); });
  c.querySelectorAll('[data-cancel-cash]').forEach(el=>el.onclick=()=>{ delete editing['cash_'+el.dataset.cancelCash]; render(); });
  c.querySelectorAll('[data-del-cash]').forEach(el=>el.onclick=async()=>{ const mo=state.currentMonth; const[b,r]=el.dataset.delCash.split(':'); state.cash[mo][b]=state.cash[mo][b].filter(x=>x.id!==r); await saveCash(mo,b); render(); });

  // documents (PI / Invoice)
  c.querySelectorAll('[data-toggle-order]').forEach(el=>el.onclick=()=>{ const id=el.dataset.toggleOrder; collapsed[id]=!collapsed[id]; render(); });
  c.querySelectorAll('[data-doc]').forEach(el=>el.onclick=()=>{
    const [kind,buyerId,orderId]=el.dataset.doc.split(':');
    editing.doc={kind,buyerId,orderId}; renderOverlay();
  });

  // orders
  c.querySelectorAll('[data-add-order]').forEach(el=>el.onclick=async()=>{
    const mo=state.currentMonth, b=el.dataset.addOrder;
    const o=blankOrder();
    o.noInvoice=genInvoice(o.tglOrder);
    state.invSeq=(state.invSeq||1077)+1;
    o.noPI=genPI(o.tglOrder);
    state.piSeq=(state.piSeq||1045)+1;
    await saveInvSeq(); await savePiSeq();
    state.sales[mo][b].orders.push(o); editing['ord_'+o.id]=true; await saveSales(mo,b); render();
  });
  c.querySelectorAll('[data-edit-order]').forEach(el=>el.onclick=()=>{ const[,oid]=el.dataset.editOrder.split(':'); editing['ord_'+oid]=true; render(); });
  c.querySelectorAll('[data-cancel-order]').forEach(el=>el.onclick=()=>{ const[,oid]=el.dataset.cancelOrder.split(':'); delete editing['ord_'+oid]; render(); });
  c.querySelectorAll('[data-save-order]').forEach(el=>el.onclick=()=>saveOrderHeader(el.dataset.saveOrder));
  c.querySelectorAll('[data-del-order]').forEach(el=>el.onclick=async()=>{
    const mo=state.currentMonth; const[b,oid]=el.dataset.delOrder.split(':');
    if(el.dataset.confirming!=='1'){ el.dataset.confirming='1'; el.textContent='klik lagi'; setTimeout(()=>{el.dataset.confirming='0';el.textContent='hapus';},3000); return; }
    state.sales[mo][b].orders=state.sales[mo][b].orders.filter(o=>o.id!==oid); await saveSales(mo,b); render();
  });
  c.querySelectorAll('[data-del-buyer]').forEach(el=>el.onclick=async()=>{
    const id=el.dataset.delBuyer;
    if(el.dataset.confirming!=='1'){ el.dataset.confirming='1'; el.textContent='klik lagi utk hapus'; setTimeout(()=>{el.dataset.confirming='0';el.textContent='hapus buyer';},3000); return; }
    state.buyers=state.buyers.filter(x=>x.id!==id);
    state.months.forEach(mo=>{ if(state.sales[mo]) delete state.sales[mo][id]; if(state.cash[mo]) delete state.cash[mo][id]; });
    await saveBuyers(); render();
  });
  // Ambil item dari Daftar Order (Supabase) -> isi otomatis ke order buku-kas
  c.querySelectorAll('[data-link-order]').forEach(el=>el.onchange=async()=>{
    const oid=el.value; if(!oid) return;
    const src=(ordersCache||[]).find(x=>x.id===oid); if(!src) return;
    const mo=state.currentMonth; const [b,orderId]=el.dataset.linkOrder.split(':');
    const ord=((state.sales[mo]||{})[b]||{}).orders?state.sales[mo][b].orders.find(o=>o.id===orderId):null; if(!ord) return;
    (src.items||[]).forEach(it=>{
      if(isOngkir(it)){ ord.ongkir=(Number(ord.ongkir)||0)+(Number(it.harga)||0); return; }
      ord.items.push({id:uid(), desc:it.nama||'', pack:it.packaging||it.pack||'', qty:Number(it.qty)||0, unit:it.satuan||'KG', harga:Number(it.harga)||0, ppn:11});
    });
    ord.linkedOrderId=src.id;                                             // KUNCI: tautkan ke order relational (untuk HPP/piutang/arus kas per order)
    ord.linkedOrderNo=src.no_order;
    if(!ord.noPO && (src.po_masuk_no||src.no_order)) ord.noPO=src.po_masuk_no||src.no_order;
    if(src.tanggal_order) ord.tglOrder=src.tanggal_order;                 // link tgl order
    if(src.tanggal_serah_terima){ ord.tglKirim=src.tanggal_serah_terima; }   // link tgl serah terima dari order
    else { try{ const { data:sh }=await sb.from('shipments').select('tanggal_terima,tanggal_kirim').eq('order_id',oid).order('tanggal_kirim',{ascending:false}).limit(1);
      if(sh&&sh[0]){ ord.tglKirim=sh[0].tanggal_terima||sh[0].tanggal_kirim||ord.tglKirim; } }catch(e){} }   // fallback: dari Pengiriman
    await saveSales(mo,b); render();
  });

  // items
  c.querySelectorAll('[data-add-item]').forEach(el=>el.onclick=()=>itemSubmit(el.dataset.addItem,null));
  c.querySelectorAll('[data-update-item]').forEach(el=>el.onclick=()=>itemSubmit(el.dataset.updateItem,el.dataset.row));
  c.querySelectorAll('[data-edit-item]').forEach(el=>el.onclick=()=>{ const[oid,rid]=el.dataset.editItem.split(':'); editing['item_'+oid]=rid; render(); });
  c.querySelectorAll('[data-cancel-item]').forEach(el=>el.onclick=()=>{ delete editing['item_'+el.dataset.cancelItem]; render(); });
  c.querySelectorAll('[data-del-item]').forEach(el=>el.onclick=async()=>{ const[oid,rid]=el.dataset.delItem.split(':'); const mo=state.currentMonth; const b=findBuyerOfOrder(mo,oid); const o=findOrder(mo,b,oid); o.items=o.items.filter(x=>x.id!==rid); await saveSales(mo,b); render(); });

  // payments
  c.querySelectorAll('[data-pay-jenis]').forEach(el=>el.onchange=()=>{
    const oid=el.dataset.payJenis;
    const nomEl=document.getElementById('pNom_'+oid);
    if(nomEl) nomEl.value = el.value==='DP' ? (el.dataset.dp||'') : (el.dataset.sisa||'');
  });
  c.querySelectorAll('[data-add-pay]').forEach(el=>el.onclick=()=>paySubmit(el.dataset.addPay,null));
  c.querySelectorAll('[data-update-pay]').forEach(el=>el.onclick=()=>paySubmit(el.dataset.updatePay,el.dataset.row));
  c.querySelectorAll('[data-edit-pay]').forEach(el=>el.onclick=()=>{ const[oid,pid]=el.dataset.editPay.split(':'); editing['pay_'+oid]=pid; render(); });
  c.querySelectorAll('[data-cancel-pay]').forEach(el=>el.onclick=()=>{ delete editing['pay_'+el.dataset.cancelPay]; render(); });
  c.querySelectorAll('[data-del-pay]').forEach(el=>el.onclick=async()=>{ const[oid,pid]=el.dataset.delPay.split(':'); const mo=state.currentMonth; const b=findBuyerOfOrder(mo,oid); const o=findOrder(mo,b,oid); const p=(o.payments||[]).find(x=>x.id===pid); if(p&&p.txId){ try{ await sb.from('transactions').delete().eq('id',p.txId); }catch(e){} } o.payments=o.payments.filter(x=>x.id!==pid); await saveSales(mo,b); orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; ledgerCache=null; render(); });

  // investor / petty
  const addInv=c.querySelector('[data-add-inv]'); if(addInv) addInv.onclick=()=>invSubmit(null);
  const updInv=c.querySelector('[data-update-inv]'); if(updInv) updInv.onclick=()=>invSubmit(updInv.dataset.updateInv);
  c.querySelectorAll('[data-edit-inv]').forEach(el=>el.onclick=()=>{ editing.inv=el.dataset.editInv; render(); });
  const cancelInv=c.querySelector('[data-cancel-inv]'); if(cancelInv) cancelInv.onclick=()=>{ delete editing.inv; render(); };
  c.querySelectorAll('[data-del-inv]').forEach(el=>el.onclick=async()=>{ const mo=state.currentMonth; state.settings[mo].investors=(state.settings[mo].investors||[]).filter(i=>i.id!==el.dataset.delInv); await saveSettings(mo); render(); });
  const addPetty=c.querySelector('[data-add="petty"]'); if(addPetty) addPetty.onclick=async()=>{ const mo=state.currentMonth; state.settings[mo].pettyCash=num('pettyInput'); await saveSettings(mo); render(); };
}

function findBuyerOfOrder(mo,orderId){
  for(const b of state.buyers){ if(getOrders(mo,b.id).some(o=>o.id===orderId)) return b.id; }
  return null;
}

async function cashSubmit(buyerId,rowId){
  const mo=state.currentMonth, ek='cash_'+buyerId;
  const desc=val('desc_'+ek); if(!desc) return;
  const type=sel('type_'+ek);
  const category=type==='keluar'?sel('cat_'+ek):null;
  const qty=num('qty_'+ek)||1, unit=sel('unit_'+ek), unitPrice=num('price_'+ek), amount=qty*unitPrice;
  if(!amount) return;
  const data={date:val('date_'+ek),desc,type,category,qty,unit,unitPrice,amount,by:who()};
  const arr=state.cash[mo][buyerId];
  if(rowId){ const i=arr.findIndex(x=>x.id===rowId); if(i>=0) arr[i]={...arr[i],...data}; delete editing[ek]; }
  else arr.push({id:uid(),...data});
  await saveCash(mo,buyerId); render();
}
async function saveOrderHeader(key){
  const mo=state.currentMonth; const[b,oid]=key.split(':'); const o=findOrder(mo,b,oid); if(!o) return;
  o.tglOrder=val('oOrder_'+oid); o.tglKirim=val('oKirim_'+oid); o.noInvoice=val('oInv_'+oid); o.noPI=val('oPI_'+oid); o.noPO=val('oPO_'+oid);
  o.dpPct=num('oDp_'+oid); o.tempoHari=num('oTempo_'+oid); o.tempoDpHari=num('oTempoDp_'+oid); o.invoiceDate=val('oInvDate_'+oid);
  o.fpDp={no:val('oFpDpNo_'+oid), tgl:val('oFpDpTgl_'+oid)};
  o.fpPel={no:val('oFpPelNo_'+oid), tgl:val('oFpPelTgl_'+oid)};
  delete editing['ord_'+oid];
  await saveSales(mo,b); render();
}
async function itemSubmit(orderId,rowId){
  const mo=state.currentMonth, b=findBuyerOfOrder(mo,orderId), o=findOrder(mo,b,orderId);
  const desc=val('iDesc_'+orderId), qty=num('iQty_'+orderId);
  const ongkirEl=document.getElementById('iOngkir_'+orderId);
  if(ongkirEl) o.ongkir=Number(ongkirEl.value)||0; // ongkir saved from the item row
  if(!desc||!qty){ if(ongkirEl){ await saveSales(mo,b); render(); } return; }
  const data={desc,pack:val('iPack_'+orderId),qty,unit:sel('iUnit_'+orderId),harga:num('iHarga_'+orderId),ppn:num('iPpn_'+orderId)};
  if(rowId){ const i=o.items.findIndex(x=>x.id===rowId); if(i>=0) o.items[i]={...o.items[i],...data}; delete editing['item_'+orderId]; }
  else o.items.push({id:uid(),...data});
  await saveSales(mo,b); render();
}
async function paySubmit(orderId,rowId){
  const mo=state.currentMonth, b=findBuyerOfOrder(mo,orderId), o=findOrder(mo,b,orderId);
  const nominal=num('pNom_'+orderId); if(!nominal) return;
  const data={tgl:val('pTgl_'+orderId),jenis:sel('pJenis_'+orderId),nominal,noKwitansi:val('pKw_'+orderId)};
  // Penjualan → Arus Kas: DP/pelunasan buyer di sini tercatat sebagai UANG MASUK (sumber tunggal pendapatan).
  const buyerNm=(state.buyers.find(x=>x.id===b)||{}).name||'';
  const txPayload={ tanggal:data.tgl||today(), arah:'masuk', jenis:(data.jenis==='DP'?'dp':'pelunasan'), jumlah:nominal, kategori:'Penjualan', order_id:(o.linkedOrderId||null), catatan:`Inv ${o.noInvoice||o.noPI||'-'} · ${buyerNm}` };
  if(rowId){
    const i=o.payments.findIndex(x=>x.id===rowId);
    if(i>=0){ const old=o.payments[i]; o.payments[i]={...old,...data};
      if(old.txId){ try{ await sb.from('transactions').update(txPayload).eq('id',old.txId); }catch(e){} }
      else { try{ const { data:tx }=await sb.from('transactions').insert(txPayload).select('id').single(); if(tx) o.payments[i].txId=tx.id; }catch(e){} } }
    delete editing['pay_'+orderId];
  } else {
    let txId=null;
    try{ const { data:tx }=await sb.from('transactions').insert(txPayload).select('id').single(); txId=tx?tx.id:null; }catch(e){}
    o.payments.push({id:uid(),...data,txId});
  }
  await saveSales(mo,b);
  ledgerCache=null; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; ordersCache=null;
  render();
}
async function invSubmit(invId){
  const mo=state.currentMonth;
  const name=val('invName'), sourceBuyerId=sel('invSource'), amount=num('invAmount');
  if(!amount) return;
  if(!state.settings[mo].investors) state.settings[mo].investors=[];
  const arr=state.settings[mo].investors;
  if(invId){ const i=arr.findIndex(x=>x.id===invId); if(i>=0) arr[i]={...arr[i],name,sourceBuyerId,amount}; delete editing.inv; }
  else arr.push({id:uid(),name,sourceBuyerId,amount});
  await saveSettings(mo); render();
}

// month/buyer add
const monthForm=document.getElementById('addMonthForm');
const buyerForm=document.getElementById('addBuyerForm');
document.getElementById('addMonthBtn').onclick=()=>{ buyerForm.style.display='none'; monthForm.style.display=monthForm.style.display==='none'?'inline-flex':'none'; if(monthForm.style.display!=='none') document.getElementById('newMonthName').focus(); };
document.getElementById('addBuyerBtn').onclick=()=>{ monthForm.style.display='none'; buyerForm.style.display=buyerForm.style.display==='none'?'inline-flex':'none'; if(buyerForm.style.display!=='none') document.getElementById('newBuyerName').focus(); };
async function submitNewMonth(){ const input=document.getElementById('newMonthName'); const name=input.value.trim(); if(!name) return; if(state.months.includes(name)){ input.value=''; input.placeholder='Bulan sudah ada'; return; } state.months.push(name); await ensureMonth(name); state.currentMonth=name; await saveMonths(); input.value=''; monthForm.style.display='none'; render(); }
async function submitNewBuyer(){ const input=document.getElementById('newBuyerName'); const name=input.value.trim(); if(!name) return; const b={id:uid(),name}; state.buyers.push(b); await saveBuyers(); for(const mo of state.months){ await ensureBuyerData(mo,b.id); } input.value=''; buyerForm.style.display='none'; render(); }
document.getElementById('saveMonthBtn').onclick=submitNewMonth;
document.getElementById('saveBuyerBtn').onclick=submitNewBuyer;

// ====== Autentikasi & boot ======
function showLogin(){
  document.getElementById('loginOverlay').style.display='flex';
  document.querySelector('.app').style.display='none';
}
async function showApp(session){
  document.getElementById('loginOverlay').style.display='none';
  document.querySelector('.app').style.display='flex';
  const ub=document.getElementById('userBar'); if(ub) ub.style.display='flex';
  const em=document.getElementById('userEmail'); if(em) em.textContent=session.user.email;
  const who=document.getElementById('whoName');
  if(who && !who.value){ who.value=(session.user.user_metadata && session.user.user_metadata.name) || session.user.email.split('@')[0]; }
  try{
    const { data:prof } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    currentRole = (prof && prof.role) || 'sales';
  }catch(e){ currentRole='sales'; }
  const av=document.getElementById('userAv'); if(av) av.textContent=(session.user.email||'?').slice(0,2).toUpperCase();
  const ur=document.getElementById('userRole'); if(ur) ur.textContent=({owner:'Pemilik',keuangan:'Keuangan',staff:'Staff',sales:'Sales'})[currentRole]||currentRole;
  currentUserId = session.user.id;
  activeTab = LANDING[currentRole] || 'daftar_order';
  await loadAll();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!email||!pass){ errEl.textContent='Isi email dan kata sandi.'; return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='Memproses…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  btn.disabled=false; btn.textContent='Masuk';
  if(error){ errEl.textContent='Gagal masuk: '+error.message; return; }
  await showApp(data.session);
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function boot(){
  if(SUPABASE_URL.indexOf('GANTI_')===0 || SUPABASE_ANON_KEY.indexOf('GANTI_')===0){
    showLogin();
    document.getElementById('loginErr').textContent='Aplikasi belum dikonfigurasi. Isi SUPABASE_URL & SUPABASE_ANON_KEY di file HTML.';
    return;
  }
  document.getElementById('loginBtn').onclick=doLogin;
  document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  const lo=document.getElementById('logoutBtn'); if(lo) lo.onclick=doLogout;
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await showApp(session); } else { showLogin(); }
  sb.auth.onAuthStateChange((_e, sess)=>{ if(!sess) showLogin(); });
}

// ── Auto-refresh: tarik ulang data dari cloud saat jendela kembali aktif ──
// Alasan: aplikasi tidak punya live-sync, jadi perubahan rekan baru terlihat setelah reload.
// Ini me-refresh otomatis saat tab difokuskan, TAPI dilewati bila sedang mengisi form
// (biar isian yang belum disimpan tidak hilang).
function isEditingUI(){
  if(document.querySelector('.overlay')) return true;                 // dokumen cetak (PI/Invoice/PO/DO) terbuka
  const ae=document.activeElement;
  if(ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable)) return true;
  try{
    if(typeof shipView!=='undefined' && (shipView==='new'||shipView==='edit')) return true;
    if(typeof orderView!=='undefined' && (orderView==='new'||orderView==='edit'||orderView==='card')) return true;
    if(typeof dataEditId!=='undefined' && dataEditId!=null) return true;
    if(typeof editing!=='undefined' && editing && Object.keys(editing).length>0) return true;
  }catch(e){}
  return false;
}
function softRefresh(){
  const app=document.querySelector('.app');
  if(!app || app.style.display==='none') return;   // masih di layar login
  if(isEditingUI()) return;                         // jangan ganggu form yang sedang diisi
  // kosongkan cache baris (order/buyer/supplier/PO/tagihan/pengiriman) → dimuat ulang otomatis oleh render()
  ordersCache=buyersCache=suppliersCache=poCache=billsCache=shipCache=null;
  dashData=hppCache=finReport=orderFinance=vsData=txData=null; orderSummary={};
  try{ render(); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) softRefresh(); });
window.addEventListener('focus', softRefresh);

boot();
