function bindEvents(){
  const c=document.getElementById('content');

  // modal
  c.querySelectorAll('[data-del-capital]').forEach(el=>el.onclick=async()=>{ state.capital=state.capital.filter(r=>r.id!==el.dataset.delCapital); await saveCapital(); render(); });
  const addCap=c.querySelector('[data-add="capital"]');
  if(addCap) addCap.onclick=async()=>{ const name=val('capName'),note=val('capNote'),amount=num('capAmount'); if(!name||!amount)return; state.capital.push({id:uid(),name,note,amount,by:who()}); await saveCapital(); render(); };

  // buyer delete
  c.querySelectorAll('[data-del-buyer]').forEach(el=>el.onclick=async()=>{
    if(el.dataset.confirming!=='1'){ el.dataset.confirming='1'; el.textContent='klik lagi untuk hapus'; setTimeout(()=>{el.dataset.confirming='0';el.textContent='hapus buyer';},3000); return; }
    state.buyers=state.buyers.filter(b=>b.id!==el.dataset.delBuyer); await saveBuyers(); render();
  });

  // cash
  c.querySelectorAll('[data-add-cash]').forEach(el=>el.onclick=()=>cashSubmit(el.dataset.addCash,null));
  c.querySelectorAll('[data-update-cash]').forEach(el=>el.onclick=()=>cashSubmit(el.dataset.updateCash,el.dataset.row));
  c.querySelectorAll('[data-edit-cash]').forEach(el=>el.onclick=()=>{ const[b,r]=el.dataset.editCash.split(':'); editing['cash_'+b]=r; render(); });
  c.querySelectorAll('[data-cancel-cash]').forEach(el=>el.onclick=()=>{ delete editing['cash_'+el.dataset.cancelCash]; render(); });
  c.querySelectorAll('[data-del-cash]').forEach(el=>el.onclick=async()=>{ const mo=state.currentMonth; const[b,r]=el.dataset.delCash.split(':'); state.cash[mo][b]=state.cash[mo][b].filter(x=>x.id!==r); await saveCash(mo,b); render(); });

  // documents (PI / Invoice)
  c.querySelectorAll('[data-toggle-order]').forEach(el=>el.onclick=()=>{ const id=el.dataset.toggleOrder; collapsed[id]=!collapsed[id]; render(); });
  c.querySelectorAll('[data-doc]').forEach(el=>el.onclick=()=>{
    const [kind,buyerId,orderId]=el.dataset.doc.split(':');
    editing.doc={kind,buyerId,orderId}; renderOverlay();
  });

  // orders
  c.querySelectorAll('[data-add-order]').forEach(el=>el.onclick=async()=>{
    const mo=state.currentMonth, b=el.dataset.addOrder;
    const o=blankOrder();
    o.noInvoice=genInvoice(o.tglOrder);
    state.invSeq=(state.invSeq||1077)+1;
    o.noPI=genPI(o.tglOrder);
    state.piSeq=(state.piSeq||1045)+1;
    await saveInvSeq(); await savePiSeq();
    state.sales[mo][b].orders.push(o); editing['ord_'+o.id]=true; await saveSales(mo,b); render();
  });
  c.querySelectorAll('[data-edit-order]').forEach(el=>el.onclick=()=>{ const[,oid]=el.dataset.editOrder.split(':'); editing['ord_'+oid]=true; render(); });
  c.querySelectorAll('[data-cancel-order]').forEach(el=>el.onclick=()=>{ const[,oid]=el.dataset.cancelOrder.split(':'); delete editing['ord_'+oid]; render(); });
  c.querySelectorAll('[data-save-order]').forEach(el=>el.onclick=()=>saveOrderHeader(el.dataset.saveOrder));
  c.querySelectorAll('[data-del-order]').forEach(el=>el.onclick=async()=>{
    const mo=state.currentMonth; const[b,oid]=el.dataset.delOrder.split(':');
    if(el.dataset.confirming!=='1'){ el.dataset.confirming='1'; el.textContent='klik lagi'; setTimeout(()=>{el.dataset.confirming='0';el.textContent='hapus';},3000); return; }
    state.sales[mo][b].orders=state.sales[mo][b].orders.filter(o=>o.id!==oid); await saveSales(mo,b); render();
  });

  // items
  c.querySelectorAll('[data-add-item]').forEach(el=>el.onclick=()=>itemSubmit(el.dataset.addItem,null));
  c.querySelectorAll('[data-update-item]').forEach(el=>el.onclick=()=>itemSubmit(el.dataset.updateItem,el.dataset.row));
  c.querySelectorAll('[data-edit-item]').forEach(el=>el.onclick=()=>{ const[oid,rid]=el.dataset.editItem.split(':'); editing['item_'+oid]=rid; render(); });
  c.querySelectorAll('[data-cancel-item]').forEach(el=>el.onclick=()=>{ delete editing['item_'+el.dataset.cancelItem]; render(); });
  c.querySelectorAll('[data-del-item]').forEach(el=>el.onclick=async()=>{ const[oid,rid]=el.dataset.delItem.split(':'); const mo=state.currentMonth; const b=findBuyerOfOrder(mo,oid); const o=findOrder(mo,b,oid); o.items=o.items.filter(x=>x.id!==rid); await saveSales(mo,b); render(); });

  // payments
  c.querySelectorAll('[data-pay-jenis]').forEach(el=>el.onchange=()=>{
    const oid=el.dataset.payJenis;
    const nomEl=document.getElementById('pNom_'+oid);
    if(nomEl) nomEl.value = el.value==='DP' ? (el.dataset.dp||'') : (el.dataset.sisa||'');
  });
  c.querySelectorAll('[data-add-pay]').forEach(el=>el.onclick=()=>paySubmit(el.dataset.addPay,null));
  c.querySelectorAll('[data-update-pay]').forEach(el=>el.onclick=()=>paySubmit(el.dataset.updatePay,el.dataset.row));
  c.querySelectorAll('[data-edit-pay]').forEach(el=>el.onclick=()=>{ const[oid,pid]=el.dataset.editPay.split(':'); editing['pay_'+oid]=pid; render(); });
  c.querySelectorAll('[data-cancel-pay]').forEach(el=>el.onclick=()=>{ delete editing['pay_'+el.dataset.cancelPay]; render(); });
  c.querySelectorAll('[data-del-pay]').forEach(el=>el.onclick=async()=>{ const[oid,pid]=el.dataset.delPay.split(':'); const mo=state.currentMonth; const b=findBuyerOfOrder(mo,oid); const o=findOrder(mo,b,oid); o.payments=o.payments.filter(x=>x.id!==pid); await saveSales(mo,b); render(); });

  // investor / petty
  const addInv=c.querySelector('[data-add-inv]'); if(addInv) addInv.onclick=()=>invSubmit(null);
  const updInv=c.querySelector('[data-update-inv]'); if(updInv) updInv.onclick=()=>invSubmit(updInv.dataset.updateInv);
  c.querySelectorAll('[data-edit-inv]').forEach(el=>el.onclick=()=>{ editing.inv=el.dataset.editInv; render(); });
  const cancelInv=c.querySelector('[data-cancel-inv]'); if(cancelInv) cancelInv.onclick=()=>{ delete editing.inv; render(); };
  c.querySelectorAll('[data-del-inv]').forEach(el=>el.onclick=async()=>{ const mo=state.currentMonth; state.settings[mo].investors=(state.settings[mo].investors||[]).filter(i=>i.id!==el.dataset.delInv); await saveSettings(mo); render(); });
  const addPetty=c.querySelector('[data-add="petty"]'); if(addPetty) addPetty.onclick=async()=>{ const mo=state.currentMonth; state.settings[mo].pettyCash=num('pettyInput'); await saveSettings(mo); render(); };
}

function findBuyerOfOrder(mo,orderId){
  for(const b of state.buyers){ if(getOrders(mo,b.id).some(o=>o.id===orderId)) return b.id; }
  return null;
}

async function cashSubmit(buyerId,rowId){
  const mo=state.currentMonth, ek='cash_'+buyerId;
  const desc=val('desc_'+ek); if(!desc) return;
  const type=sel('type_'+ek);
  const category=type==='keluar'?sel('cat_'+ek):null;
  const qty=num('qty_'+ek)||1, unit=sel('unit_'+ek), unitPrice=num('price_'+ek), amount=qty*unitPrice;
  if(!amount) return;
  const data={date:val('date_'+ek),desc,type,category,qty,unit,unitPrice,amount,by:who()};
  const arr=state.cash[mo][buyerId];
  if(rowId){ const i=arr.findIndex(x=>x.id===rowId); if(i>=0) arr[i]={...arr[i],...data}; delete editing[ek]; }
  else arr.push({id:uid(),...data});
  await saveCash(mo,buyerId); render();
}
async function saveOrderHeader(key){
  const mo=state.currentMonth; const[b,oid]=key.split(':'); const o=findOrder(mo,b,oid); if(!o) return;
  o.tglOrder=val('oOrder_'+oid); o.tglKirim=val('oKirim_'+oid); o.noInvoice=val('oInv_'+oid); o.noPI=val('oPI_'+oid); o.noPO=val('oPO_'+oid);
  o.dpPct=num('oDp_'+oid); o.tempoHari=num('oTempo_'+oid); o.tempoDpHari=num('oTempoDp_'+oid); o.invoiceDate=val('oInvDate_'+oid);
  o.fpDp={no:val('oFpDpNo_'+oid), tgl:val('oFpDpTgl_'+oid)};
  o.fpPel={no:val('oFpPelNo_'+oid), tgl:val('oFpPelTgl_'+oid)};
  delete editing['ord_'+oid];
  await saveSales(mo,b); render();
}
async function itemSubmit(orderId,rowId){
  const mo=state.currentMonth, b=findBuyerOfOrder(mo,orderId), o=findOrder(mo,b,orderId);
  const desc=val('iDesc_'+orderId), qty=num('iQty_'+orderId);
  const ongkirEl=document.getElementById('iOngkir_'+orderId);
  if(ongkirEl) o.ongkir=Number(ongkirEl.value)||0; // ongkir saved from the item row
  if(!desc||!qty){ if(ongkirEl){ await saveSales(mo,b); render(); } return; }
  const data={desc,qty,unit:sel('iUnit_'+orderId),harga:num('iHarga_'+orderId),ppn:num('iPpn_'+orderId)};
  if(rowId){ const i=o.items.findIndex(x=>x.id===rowId); if(i>=0) o.items[i]={...o.items[i],...data}; delete editing['item_'+orderId]; }
  else o.items.push({id:uid(),...data});
  await saveSales(mo,b); render();
}
async function paySubmit(orderId,rowId){
  const mo=state.currentMonth, b=findBuyerOfOrder(mo,orderId), o=findOrder(mo,b,orderId);
  const nominal=num('pNom_'+orderId); if(!nominal) return;
  const data={tgl:val('pTgl_'+orderId),jenis:sel('pJenis_'+orderId),nominal,noKwitansi:val('pKw_'+orderId)};
  if(rowId){ const i=o.payments.findIndex(x=>x.id===rowId); if(i>=0) o.payments[i]={...o.payments[i],...data}; delete editing['pay_'+orderId]; }
  else o.payments.push({id:uid(),...data});
  await saveSales(mo,b); render();
}
async function invSubmit(invId){
  const mo=state.currentMonth;
  const name=val('invName'), sourceBuyerId=sel('invSource'), amount=num('invAmount');
  if(!amount) return;
  if(!state.settings[mo].investors) state.settings[mo].investors=[];
  const arr=state.settings[mo].investors;
  if(invId){ const i=arr.findIndex(x=>x.id===invId); if(i>=0) arr[i]={...arr[i],name,sourceBuyerId,amount}; delete editing.inv; }
  else arr.push({id:uid(),name,sourceBuyerId,amount});
  await saveSettings(mo); render();
}

// month/buyer add
const monthForm=document.getElementById('addMonthForm');
const buyerForm=document.getElementById('addBuyerForm');
document.getElementById('addMonthBtn').onclick=()=>{ buyerForm.style.display='none'; monthForm.style.display=monthForm.style.display==='none'?'inline-flex':'none'; if(monthForm.style.display!=='none') document.getElementById('newMonthName').focus(); };
document.getElementById('addBuyerBtn').onclick=()=>{ monthForm.style.display='none'; buyerForm.style.display=buyerForm.style.display==='none'?'inline-flex':'none'; if(buyerForm.style.display!=='none') document.getElementById('newBuyerName').focus(); };
async function submitNewMonth(){ const input=document.getElementById('newMonthName'); const name=input.value.trim(); if(!name) return; if(state.months.includes(name)){ input.value=''; input.placeholder='Bulan sudah ada'; return; } state.months.push(name); await ensureMonth(name); state.currentMonth=name; await saveMonths(); input.value=''; monthForm.style.display='none'; render(); }
async function submitNewBuyer(){ const input=document.getElementById('newBuyerName'); const name=input.value.trim(); if(!name) return; const b={id:uid(),name}; state.buyers.push(b); await saveBuyers(); for(const mo of state.months){ await ensureBuyerData(mo,b.id); } input.value=''; buyerForm.style.display='none'; render(); }
document.getElementById('saveMonthBtn').onclick=submitNewMonth;
document.getElementById('saveBuyerBtn').onclick=submitNewBuyer;
document.getElementById('newMonthName').addEventListener('keydown',e=>{if(e.key==='Enter')submitNewMonth();});
document.getElementById('newBuyerName').addEventListener('keydown',e=>{if(e.key==='Enter')submitNewBuyer();});

// ====== Autentikasi & boot ======
function showLogin(){
  document.getElementById('loginOverlay').style.display='flex';
  document.querySelector('.app').style.display='none';
}
async function showApp(session){
  document.getElementById('loginOverlay').style.display='none';
  document.querySelector('.app').style.display='flex';
  const ub=document.getElementById('userBar'); if(ub) ub.style.display='flex';
  const em=document.getElementById('userEmail'); if(em) em.textContent=session.user.email;
  const who=document.getElementById('whoName');
  if(who && !who.value){ who.value=(session.user.user_metadata && session.user.user_metadata.name) || session.user.email.split('@')[0]; }
  try{
    const { data:prof } = await sb.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    currentRole = (prof && prof.role) || 'sales';
  }catch(e){ currentRole='sales'; }
  const av=document.getElementById('userAv'); if(av) av.textContent=(session.user.email||'?').slice(0,2).toUpperCase();
  const ur=document.getElementById('userRole'); if(ur) ur.textContent=({owner:'Pemilik',keuangan:'Keuangan',staff:'Staff',sales:'Sales'})[currentRole]||currentRole;
  currentUserId = session.user.id;
  activeTab = LANDING[currentRole] || 'daftar_order';
  await loadAll();
}
async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!email||!pass){ errEl.textContent='Isi email dan kata sandi.'; return; }
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='Memproses…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  btn.disabled=false; btn.textContent='Masuk';
  if(error){ errEl.textContent='Gagal masuk: '+error.message; return; }
  await showApp(data.session);
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function boot(){
  if(SUPABASE_URL.indexOf('GANTI_')===0 || SUPABASE_ANON_KEY.indexOf('GANTI_')===0){
    showLogin();
    document.getElementById('loginErr').textContent='Aplikasi belum dikonfigurasi. Isi SUPABASE_URL & SUPABASE_ANON_KEY di file HTML.';
    return;
  }
  document.getElementById('loginBtn').onclick=doLogin;
  document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
  const lo=document.getElementById('logoutBtn'); if(lo) lo.onclick=doLogout;
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await showApp(session); } else { showLogin(); }
  sb.auth.onAuthStateChange((_e, sess)=>{ if(!sess) showLogin(); });
}
boot();
