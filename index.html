<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tropica Farm Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --tea-dark:#1F3D33;--tea-mid:#3E6259;--gold:#E0A83A;--gold-deep:#8A611F;
    --paper:#FBF7EC;--paper-line:#DCD2BC;--ink:#232821;--ink-soft:#5C645C;--danger:#A32D2D;--green:#2F7A4F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#EDF3EE;color:var(--ink);}
  /* ===== Shell: sidebar gelap (kiri) + main pane ===== */
  .app{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{flex:none;width:242px;background:#152A23;color:#B4C6BC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:11px;padding:19px 18px 16px;}
  .brand .logo{width:42px;height:42px;border-radius:11px;flex:none;object-fit:contain;background:#F3EFE2;padding:4px;}
  .brand .bt{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:#F3EFE2;line-height:1.15;}
  .brand .bs{font-size:10px;color:#7E9488;letter-spacing:.05em;text-transform:uppercase;}
  .navwrap{flex:1;padding:8px 12px 16px;}
  .ic{flex:none;display:inline-block;vertical-align:middle;}
  .nav-item{margin-bottom:2px;}
  .nav-parent{display:flex;align-items:center;gap:11px;padding:10px 11px;font-size:13.5px;font-weight:500;color:#B4C6BC;cursor:pointer;border-radius:9px;}
  .nav-parent > span{flex:1;}
  .nav-parent .ic{opacity:.9;}
  .nav-parent > .ic:last-child{opacity:.55;transition:transform .2s ease;}
  .nav-parent:hover{background:#213A30;color:#EAF2ED;}
  .nav-parent.cur{background:var(--gold);color:#241906;font-weight:600;}
  .nav-parent.cur .ic{opacity:1;}
  .nav-parent.has-active{color:#EAF2ED;}
  .nav-item.open > .nav-parent{color:#EAF2ED;}
  .nav-item.open > .nav-parent > .ic:last-child{transform:rotate(90deg);}
  .subwrap{overflow:hidden;max-height:0;transition:max-height .24s ease;}
  .nav-item.open .subwrap{max-height:460px;}
  .sub{display:flex;align-items:center;padding:8px 11px 8px 44px;font-size:12.5px;color:#9DB3A9;cursor:pointer;border-radius:8px;margin:1px 0;position:relative;}
  .sub::before{content:'';position:absolute;left:26px;top:50%;width:5px;height:5px;border-radius:50%;background:#40584C;transform:translateY(-50%);}
  .sub > span{flex:1;}
  .sub .ic{opacity:.5;}
  .sub:hover{background:#213A30;color:#EAF2ED;}
  .sub.active{background:var(--gold);color:#241906;font-weight:600;}
  .sub.active::before{background:#241906;}
  .sub.locked{color:#617A6F;cursor:not-allowed;}
  .sub.locked::before{background:#33473D;}
  .sub.locked:hover{background:transparent;color:#617A6F;}
  .nav-parent.locked{cursor:not-allowed;color:#7C9187;}
  .nav-parent.locked:hover{background:transparent;color:#7C9187;}
  .nav-parent.locked .ic{opacity:.6;}
  .nav-parent.dim{color:#8AA096;}
  /* ===== Main pane ===== */
  .mainpane{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:#fff;border-bottom:1px solid #E4E7E4;height:60px;display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:30;}
  .ptitle{font-size:16px;font-weight:600;color:var(--tea-dark);white-space:nowrap;}
  .search{flex:1;max-width:400px;position:relative;margin-left:20px;}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94A29A;}
  .search input{width:100%;border:1px solid #E4E7E4;background:#F4F6F4;border-radius:9px;padding:9px 12px 9px 34px;font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);}
  .search input:focus{outline:none;border-color:var(--tea-mid);background:#fff;}
  .topacts{display:flex;align-items:center;gap:12px;margin-left:auto;}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid #E4E7E4;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5C6B63;font-size:18px;}
  .iconbtn:hover{background:#F4F6F4;color:var(--tea-dark);}
  .userchip{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid #E4E7E4;}
  .userchip .av{width:36px;height:36px;border-radius:9px;background:var(--tea-dark);color:#F3EFE2;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none;}
  .userchip .un{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;}
  .userchip .ur{font-size:11px;color:var(--ink-soft);}
  #logoutBtn{background:#fff;color:var(--ink-soft);border:1px solid #E4E7E4;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  #logoutBtn:hover{background:#F4F6F4;color:var(--danger);}
  /* toolbar (bulan & buyer) */
  .toolbar{background:#fff;border-bottom:1px solid #E4E7E4;padding:11px 22px;}
  .monthbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .monthbar select,.monthbar input{background:#F4F6F4;color:var(--ink);border:1px solid #E4E7E4;border-radius:8px;padding:8px 11px;font-size:13px;font-family:'Inter',sans-serif;}
  .monthbar button{background:var(--tea-dark);color:#F3EFE2;border:none;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;}
  .monthbar button:hover{background:#2B4F44;}
  .content{flex:1;min-width:0;padding:22px 24px 60px;}
  /* ===== KPI cards ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid #E7EAE7;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(30,50,40,.04);}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .kpi-l{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);}
  .kpi-ic{width:38px;height:38px;border-radius:11px;background:#E1F3E8;color:#12A150;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .kpi-ic.g{background:#DBF3E3;color:#12A150;}
  .kpi-ic.gold{background:#FDEFD3;color:#E08A00;}
  .kpi-ic.red{background:#FDE4E7;color:#E8455C;}
  .kpi-ic.teal{background:#D6F1EE;color:#0DA090;}
  .kpi-ic.violet{background:#EAE6FB;color:#7C5CD6;}
  .kpi-ic.blue{background:#DDEEFB;color:#2F8FDA;}
  .kpi-v{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;color:var(--tea-dark);letter-spacing:-.02em;white-space:nowrap;}
  .kpi-trend{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-top:9px;}
  .kpi-trend i{font-size:15px;}
  .kpi-trend .lbl{font-weight:400;color:var(--ink-soft);}
  .kpi-trend.up{color:#12A150;}
  .kpi-trend.down{color:#E8455C;}
  .kpi-trend.flat{color:var(--ink-soft);}
  /* ===== Panel/chart cards ===== */
  .panel-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:16px;}
  .panel{background:#fff;border:1px solid #E7EAE7;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(30,50,40,.04);}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .panel-head .pt{font-size:15px;font-weight:600;color:var(--tea-dark);margin:0;}
  .panel-head .ps{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  .panel-head .kebab{color:#A9B4AD;font-size:18px;cursor:pointer;}
  .chart-svg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
  .sec-row h2{margin:0;}
  .sec-row .meta{font-size:12px;color:var(--ink-soft);}
  .seg{display:inline-flex;background:#F4F6F4;border:1px solid #E4E7E4;border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--ink-soft);font-size:12px;font-weight:500;padding:6px 13px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;}
  .seg button.on{background:#fff;color:var(--tea-dark);font-weight:600;box-shadow:0 1px 2px rgba(30,50,40,.08);}
  .num.due{color:var(--danger);}
  .num.neg{color:var(--danger);}
  @media(max-width:1080px){ .kpi-grid{grid-template-columns:1fr 1fr;} .panel-grid{grid-template-columns:1fr;} }
  @media(max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:auto;height:auto;position:static;flex-direction:column;overflow:visible;}
    .navwrap{padding:8px 12px 12px;}
    .topbar{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px;}
    .search{order:5;flex:1 1 100%;max-width:none;margin:6px 0 0;}
    .content{padding:16px 14px 50px;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .card{overflow-x:auto;}
  }
  @media(max-width:860px){ .topacts{flex-wrap:wrap;} .userchip .un{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} }
  @media(max-width:560px){ .userchip .uinfo{display:none;} }
  @media(max-width:520px){ .kpi-grid{grid-template-columns:1fr;} }
  /* ===== Modul Order (Langkah 5) — tema teh dirapikan ===== */
  .o-wrap{max-width:940px;}
  .o-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .o-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--tea-dark);margin:0;}
  .o-btn{background:var(--tea-dark);color:#F3EFE2;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .o-btn:hover{background:#2B4F44;}
  .o-btn.ghost{background:transparent;color:var(--tea-dark);border:1px solid var(--paper-line);}
  .o-btn.ghost:hover{background:#F1ECDD;}
  .o-card{background:#fff;border:1px solid #EAE3D2;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(60,50,30,.05);}
  .o-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .o-table th{text-align:left;font-weight:600;color:var(--ink-soft);padding:11px 14px;border-bottom:1px solid var(--paper-line);font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#FBF8EF;}
  .o-table td{padding:13px 14px;border-bottom:1px solid #F0EADB;}
  .o-table tbody tr:last-child td{border-bottom:none;}
  .o-row{cursor:pointer;}
  .o-row:hover{background:#FBF8EF;}
  .o-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 11px;border-radius:20px;}
  .o-empty{text-align:center;color:var(--ink-soft);padding:34px 12px;}
  .o-field{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 5px;}
  .o-input{width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;box-sizing:border-box;}
  .o-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:4px;}
  .o-stat{background:#FBF8EF;border-radius:10px;padding:14px 16px;}
  .o-stat .l{font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .o-stat .v{font-size:20px;font-weight:600;color:var(--tea-dark);}
  .o-pipe{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px;}
  .o-step{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;}
  .o-kv{width:100%;border-collapse:collapse;font-size:14px;}
  .o-kv td{padding:9px 2px;border-bottom:1px solid #F0EADB;vertical-align:top;}
  .o-kv tr:last-child td{border-bottom:none;}
  .o-kv td:first-child{color:var(--ink-soft);width:42%;}
  .o-kv td:last-child{text-align:right;font-weight:600;color:var(--tea-dark);}
  h2.sec{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 14px;color:var(--tea-dark);}
  h3.sub{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--tea-dark);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  h4.buyerhead{font-family:'Fraunces',serif;font-size:16px;color:var(--tea-dark);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card{background:#fff;border:1px solid #EAE3D2;border-radius:12px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(60,50,30,.05);}
  .order{border:1px solid var(--paper-line);border-radius:10px;padding:0;margin-bottom:16px;background:#fff;overflow:hidden;}
  .ordertop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#F1ECDD;border-bottom:1px solid var(--paper-line);}
  .ordertop .invno{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--tea-dark);}
  .docgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--paper-line);}
  @media(max-width:560px){.docgrid{grid-template-columns:1fr;}}
  .docbox{padding:12px 16px;}
  .docbox.dp{background:#FBF4E4;border-right:1px solid var(--paper-line);}
  .docbox.pel{background:#EEF4F0;}
  .docbox .chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:20px;margin-bottom:8px;}
  .docbox.dp .chip{background:#EAD9AE;color:var(--gold-deep);}
  .docbox.pel .chip{background:#CFE3D6;color:var(--green);}
  .docbox .row{font-size:12px;color:var(--ink-soft);margin:3px 0;}
  .docbox .row b{color:var(--ink);font-weight:500;font-family:'IBM Plex Mono',monospace;}
  .osection{padding:12px 16px;border-bottom:1px solid var(--paper-line);}
  .osection:last-child{border-bottom:none;}
  .osection.item{background:#FFFDF8;}
  .osection.pay{background:#FCFAF3;}
  .osection.piutang{background:#F7F3E8;}
  .osection .shead{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .osection .shead::before{content:'';width:8px;height:8px;border-radius:2px;display:inline-block;}
  .osection.item .shead::before{background:var(--gold);}
  .osection.pay .shead::before{background:var(--tea-mid);}
  .osection.piutang .shead::before{background:var(--danger);}
  .piutang-big{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .piutang-big.zero{color:var(--green);}
  .piutang-big.due{color:var(--danger);}
  .tempo-note{font-size:12px;margin-top:4px;}
  .tempo-note.soon{color:var(--gold-deep);}
  .tempo-note.over{color:var(--danger);}
  .tempo-note.ok{color:var(--ink-soft);}
  /* document overlay */
  .overlay{position:fixed;inset:0;background:rgba(31,61,51,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;}
  .doc-wrap{background:#fff;max-width:760px;width:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .doc-bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-bottom:1px solid var(--paper-line);background:#F3EEE0;border-radius:10px 10px 0 0;}
  .doc-bar button{border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
  .doc-bar .print{background:var(--tea-dark);color:#F3EFE2;}
  .doc-bar .edit{background:var(--gold);color:#3A2A0F;}
  .doc-bar .close{background:#E5DCC8;color:var(--ink-soft);}
  #printArea{padding:34px 38px;color:#1c1c1c;font-family:'Inter',sans-serif;}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--tea-dark);padding-bottom:14px;margin-bottom:18px;}
  .doc-seller .nm{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--tea-dark);}
  .doc-seller .meta{font-size:11px;color:#555;line-height:1.5;margin-top:3px;white-space:pre-line;}
  .doc-title{text-align:right;}
  .doc-title .t{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:.04em;color:var(--tea-dark);}
  .doc-title .sub{font-size:11px;color:#666;}
  .doc-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:16px;font-size:12px;}
  .doc-meta .block b{display:block;color:#888;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .doc-meta .block .v{white-space:pre-line;line-height:1.5;}
  table.doc-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
  table.doc-tbl th{background:#F1ECDD;color:#333;text-align:left;padding:8px;border:1px solid var(--paper-line);font-size:11px;}
  table.doc-tbl td{padding:8px;border:1px solid var(--paper-line);font-family:'IBM Plex Mono',monospace;}
  table.doc-tbl td.t{font-family:'Inter',sans-serif;}
  .doc-tot{width:280px;margin-left:auto;font-size:12px;}
  .doc-tot tr td{padding:5px 8px;font-family:'IBM Plex Mono',monospace;}
  .doc-tot tr.grand td{border-top:2px solid var(--tea-dark);font-weight:700;font-size:14px;}
  .doc-tot tr.due td{background:#FBF4E4;font-weight:700;color:var(--gold-deep);}
  .doc-note{margin-top:20px;font-size:11px;color:#555;border-top:1px dashed var(--paper-line);padding-top:12px;line-height:1.6;}
  .doc-sign{display:flex;justify-content:flex-end;margin-top:30px;font-size:12px;text-align:center;}
  .doc-sign .box{width:200px;}
  .doc-sign .line{margin-top:54px;border-top:1px solid #333;padding-top:4px;}
  .profedit{padding:16px 38px;border-top:1px solid var(--paper-line);background:#FCFAF3;}
  /* reference-style invoice document */
  #printArea{padding:0;}
  .inv{font-family:'Inter',Arial,sans-serif;color:#222;padding:36px 40px;font-size:12px;}
  .inv-head{display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .inv-brand{display:flex;align-items:center;gap:14px;}
  .inv-brand .txt .b{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:.02em;color:#1f1f1f;line-height:1;}
  .inv-brand .txt .l{font-size:11px;font-weight:600;color:#C9A227;letter-spacing:.03em;margin-top:2px;}
  .inv-brand .txt .a{font-size:10.5px;color:#666;margin-top:3px;}
  .inv-web{font-size:11px;color:#333;text-decoration:underline;align-self:flex-end;}
  .inv-rule{height:4px;background:#E8B923;border-radius:2px;margin:10px 0 0;}
  .inv-title{text-align:center;font-family:'Fraunces',serif;font-size:30px;font-weight:600;letter-spacing:.06em;margin:20px 0 8px;color:#1f1f1f;}
  .inv-banner{background:#FBF1CE;color:#B8860B;text-align:center;font-weight:700;font-size:12px;letter-spacing:.05em;padding:7px;border-radius:2px;margin-bottom:16px;}
  .inv-info{display:flex;justify-content:space-between;gap:30px;margin-bottom:16px;}
  .inv-info .left{font-size:12px;}
  .inv-info .left .r{display:flex;margin:3px 0;}
  .inv-info .left .r .k{width:110px;font-weight:700;color:#333;}
  .inv-info .right{font-size:12px;max-width:280px;}
  .inv-info .right .k{font-weight:700;color:#333;margin-bottom:3px;}
  .inv-info .right .nm{font-weight:700;}
  .inv-info .right .ad{color:#444;line-height:1.5;white-space:pre-line;}
  table.inv-tbl{width:100%;border-collapse:collapse;margin-bottom:0;font-size:12px;}
  table.inv-tbl th{background:#EDEDED;border:1px solid #CFCFCF;padding:9px 8px;text-align:center;font-weight:700;color:#333;}
  table.inv-tbl td{border:1px solid #CFCFCF;padding:9px 8px;font-family:'IBM Plex Mono',monospace;}
  table.inv-tbl td.t{font-family:'Inter',sans-serif;}
  table.inv-tbl td.c{text-align:center;}
  table.inv-tbl td.r{text-align:right;}
  table.inv-tbl tr.sum td{font-weight:600;}
  table.inv-tbl tr.sum td.lbl{text-align:right;font-family:'Inter',sans-serif;font-weight:700;background:#FafafA;}
  table.inv-tbl tr.grand td{font-size:15px;font-weight:700;background:#EDEDED;}
  .inv-due{display:flex;justify-content:space-between;align-items:center;background:#E8B923;color:#3a2a00;font-weight:700;padding:11px 16px;border-radius:2px;margin:16px 0 4px;font-size:13px;}
  .inv-rem{display:flex;justify-content:space-between;font-style:italic;color:#555;font-size:11px;padding:0 4px 14px;}
  .inv-breakdown{display:flex;justify-content:space-between;color:#333;font-size:11.5px;padding:2px 4px;}
  .inv-note-line{color:#555;font-size:11px;font-style:italic;padding:5px 4px 14px;line-height:1.5;}
  .inv-sec-h{background:#EDEDED;border:1px solid #CFCFCF;font-weight:700;padding:8px 10px;font-size:12px;}
  table.inv-pay{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;}
  table.inv-pay td{border:1px solid #CFCFCF;padding:8px 10px;}
  table.inv-pay td.k{font-weight:700;width:180px;}
  .inv-notes{margin-bottom:10px;}
  .inv-notes ol{margin:8px 0 0;padding-left:20px;font-size:11px;color:#444;line-height:1.7;}
  .inv-notes .free{font-size:11px;color:#444;white-space:pre-line;line-height:1.7;margin-top:8px;}
  .inv-sign{margin-top:26px;text-align:right;font-size:12px;}
  .inv-sign .city{margin-bottom:2px;}
  .inv-sign .co{font-weight:700;}
  .inv-sign .sp{height:60px;}
  .inv-sign .nm{font-weight:700;}
  .inv-logo{flex:none;}
  @media print{
    body{background:#fff;}
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%;padding:0;}
    .overlay{position:static;background:#fff;padding:0;overflow:visible;}
    .doc-wrap{box-shadow:none;max-width:100%;}
    .no-print{display:none !important;}
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:#fff;border:1px solid #EAE3D2;border-radius:12px;padding:15px 17px;box-shadow:0 1px 2px rgba(60,50,30,.04);}
  .stat .l{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .stat .v{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:var(--tea-dark);}
  .stat .v.neg{color:var(--danger);}
  /* ===== Dashboard hero ===== */
  .dash-hero{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  @media(max-width:720px){.dash-hero{grid-template-columns:1fr;}}
  .hero{border-radius:12px;padding:16px 18px;}
  .hero .l{font-size:12px;display:flex;align-items:center;gap:6px;}
  .hero .v{font-family:'IBM Plex Mono',monospace;font-weight:600;margin-top:7px;letter-spacing:-.01em;}
  .hero.main{background:var(--tea-dark);color:#F3EFE2;}
  .hero.main .l{color:#B9CEC5;}
  .hero.main .v{font-size:27px;}
  .hero.main .v.neg{color:#F0B4A0;}
  .hero.main .sub{font-size:12px;color:#8FBFA6;margin-top:4px;}
  .hero.plain{background:#fff;border:1px solid #EAE3D2;box-shadow:0 1px 2px rgba(60,50,30,.04);}
  .hero.plain .l{color:var(--ink-soft);}
  .hero.plain .v{font-size:20px;color:var(--tea-dark);}
  .hero.warn{background:#FBF4E4;border:1px solid #EAD9AE;}
  .hero.warn .l,.hero.warn .v{color:var(--gold-deep);}
  .hero.warn .v{font-size:20px;}
  .sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 12px;}
  .sec-row .sec{margin:0;}
  .sec-row .meta{font-size:12px;color:var(--ink-soft);}
  .num.due{color:var(--danger);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-weight:600;color:var(--ink-soft);background:#FBF8EF;border-bottom:1px solid var(--paper-line);padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  td{padding:11px 12px;border-bottom:1px solid #F0EADB;font-family:'IBM Plex Mono',monospace;vertical-align:top;}
  td.txt{font-family:'Inter',sans-serif;}
  tr:last-child td{border-bottom:none;}
  tr.total td{font-weight:700;border-top:1px solid var(--paper-line);border-bottom:none;background:#FBF8EF;font-family:'IBM Plex Mono',monospace;}
  .num{text-align:right;}
  .form-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center;}
  .form-row input,.form-row select{flex:1;min-width:80px;border:1px solid var(--paper-line);border-radius:6px;padding:8px 9px;font-size:13px;font-family:'Inter',sans-serif;background:#FCFAF3;}
  .form-row button{background:var(--gold);color:#3A2A0F;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;}
  .form-row button:hover{background:var(--gold-deep);color:#fff;}
  .form-row button.cancel{background:#E5DCC8;color:var(--ink-soft);}
  .fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;}
  .fieldgrid label{font-size:11px;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .fieldgrid input,.fieldgrid select{width:100%;border:1px solid var(--paper-line);border-radius:6px;padding:8px 9px;font-size:13px;font-family:'Inter',sans-serif;background:#FCFAF3;}
  .kv{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12px;color:var(--ink-soft);margin:2px 0 10px;}
  .kv b{color:var(--ink);font-weight:500;font-family:'IBM Plex Mono',monospace;}
  .act{cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;}
  .act.edit{color:var(--tea-mid);margin-right:8px;}
  .act.edit:hover{text-decoration:underline;}
  .act.del{color:var(--ink-soft);}
  .act.del:hover{color:var(--danger);text-decoration:underline;}
  .buyer-x{cursor:pointer;color:#C9BBA0;font-size:12px;font-weight:400;}
  .buyer-x:hover{color:var(--danger);}
  .addbtn{background:var(--tea-dark);color:#F3EFE2;border:none;border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  .addbtn:hover{background:var(--tea-mid);}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:14px 0;text-align:center;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#EFE6D2;color:var(--gold-deep);}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;}
  .pill.lunas{background:#D6F3E0;color:#0E8F45;}
  .pill.dp{background:#FCEECF;color:#C67D0A;}
  .pill.belum{background:#FBE0E3;color:#DA3B4E;}
  .pill.tempo{background:#FBE0E3;color:#DA3B4E;}
  .empty-state{background:#fff;border:1px solid #E7EAE7;border-radius:14px;padding:48px 28px;text-align:center;box-shadow:0 1px 3px rgba(30,50,40,.04);}
  .empty-state .es-ic{width:66px;height:66px;border-radius:16px;background:#EAF1EC;color:var(--tea-mid);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .empty-state .es-t{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--tea-dark);margin:0 0 6px;}
  .empty-state .es-s{font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:420px;margin:0 auto;}
  .who{font-size:11px;color:var(--ink-soft);}
  .note{font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .virt{color:var(--tea-mid);}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  /* ===== Login Supabase ===== */
  .login-overlay{position:fixed;inset:0;background:var(--tea-dark);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .login-card{background:var(--paper);border-radius:14px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-logo-img{display:block;width:66px;height:66px;object-fit:contain;margin:0 auto 12px;}
  .login-brand{font-family:'Fraunces',serif;font-weight:600;letter-spacing:2px;color:var(--gold-deep);font-size:13px;text-align:center;margin-bottom:12px;}
  .login-card h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin:0 0 4px;color:var(--ink);text-align:center;}
  .login-sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0 0 20px;}
  .login-card label{display:block;font-size:12px;color:var(--ink-soft);margin:12px 0 5px;}
  .login-card input{width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:7px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;}
  .login-card button{width:100%;margin-top:20px;padding:11px;background:var(--tea-dark);color:#F3EFE2;border:none;border-radius:7px;font-size:14px;font-weight:600;cursor:pointer;}
  .login-card button:disabled{opacity:.6;cursor:default;}
  .login-err{color:var(--danger);font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}
</style>
</head>

function today(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr), t=new Date(today()); if(isNaN(d)) return null; return Math.round((d-t)/86400000); }

}

async function safeGet(k){
  try{
    const { data, error } = await sb.from('kv_store').select('value').eq('key', k).maybeSingle();
    if(error) throw error;
    return data ? data.value : null;
  }catch(e){ console.error('Gagal memuat', k, e); return null; }
}
async function safeSet(k,v){
  const { error } = await sb.from('kv_store').upsert({ key:k, value:v, updated_at:new Date().toISOString() });
  if(error){ console.error('Gagal menyimpan', k, error); alert('Gagal menyimpan ke server: '+error.message); }
}

}
function migrateSales(sd){
  if(!sd) return {orders:[]};
  if(Array.isArray(sd.orders)) return sd;
  // old shape {items, ongkir}
  if(Array.isArray(sd.items)){
    const o=blankOrder(); o.items=sd.items.map(i=>({id:i.id||uid(),desc:i.desc,qty:i.qty,unit:i.unit||'KG',harga:i.harga,ppn:i.ppn||11})); o.ongkir=sd.ongkir||0;
    return {orders:[o]};
  }
  return {orders:[]};
}

  state.invSeq=(await safeGet('invSeq'))||1077;
  state.piSeq=(await safeGet('piSeq'))||1045;
  const storedSeller=await safeGet('seller');
  state.seller={...SELLER_DEFAULT, ...(storedSeller||{})};
  if(storedSeller && storedSeller.nama && !storedSeller.brand){ state.seller.brand=storedSeller.nama; }
  state.settings={};
  for(const mo of state.months){ await ensureMonth(mo); }
  render();
}
async function ensureMonth(mo){
  if(!state.cash[mo]) state.cash[mo]={};
  if(!state.sales[mo]) state.sales[mo]={};
  for(const b of state.buyers){
    if(!state.cash[mo][b.id]) state.cash[mo][b.id]=(await safeGet('cash:'+mo+':'+b.id))||[];
    if(!state.sales[mo][b.id]) state.sales[mo][b.id]=migrateSales(await safeGet('sales:'+mo+':'+b.id));
  }
  if(!state.settings[mo]) state.settings[mo]=(await safeGet('settings:'+mo))||{investors:[],pettyCash:0};
}

// ---- orders ----
function getOrders(mo,id){ return (state.sales[mo]?.[id]?.orders)||[]; }
function orderCalc(o){
  const items=o.items||[];
  const subtotalBarang=items.reduce((s,r)=>s+r.qty*r.harga,0);
  const ppn=items.reduce((s,r)=>s+(r.qty*r.harga*(r.ppn||0)/100),0);
  const ongkir=Number(o.ongkir||0);
  const tanpaPPN=subtotalBarang+ongkir;
  const totalTagihan=tanpaPPN+ppn;
  const dibayar=(o.payments||[]).reduce((s,p)=>s+Number(p.nominal||0),0);
  const sisa=totalTagihan-dibayar;
  const dpSeharusnya=totalTagihan*(Number(o.dpPct||0)/100);
  const jatuhTempo=addDays(o.tglKirim, o.tempoHari);
  let status = dibayar<=0 ? 'belum' : (sisa<=0.5 ? 'lunas' : 'dp');
  const daysLeft = daysUntil(jatuhTempo);
  const lewatTempo = status!=='lunas' && jatuhTempo && daysLeft!==null && daysLeft<0;
  return {subtotalBarang, ppn, ongkir, tanpaPPN, totalTagihan, dibayar, sisa, dpSeharusnya, jatuhTempo, status, lewatTempo, daysLeft};
}
function salesData(mo,id){
  const orders=getOrders(mo,id);
  let subtotal=0, ppn=0, total=0, dibayar=0, piutang=0;
  orders.forEach(o=>{ const c=orderCalc(o); subtotal+=c.tanpaPPN; ppn+=c.ppn; total+=c.totalTagihan; dibayar+=c.dibayar; piutang+=c.sisa; });
  return {subtotal, ppn, total, dibayar, piutang};
}
function totalPenjualanAll(mo){ return state.buyers.reduce((s,b)=>s+salesData(mo,b.id).total,0); }
function piutangAll(mo){ return state.buyers.reduce((s,b)=>s+salesData(mo,b.id).piutang,0); }

}

function buyerKeluar(mo,id){ return (state.cash[mo]?.[id]||[]).filter(r=>r.type==='keluar').reduce((s,r)=>s+r.amount,0); }

function hppBuyer(mo,id){ return salesData(mo,id).subtotal - totalBiayaBuyer(mo,id); }

async function loadOrders(){
  orderLoading=true;
  const { data:bs } = await sb.from('buyers').select('id,nama').order('nama');
  buyersCache = bs||[];
  const { data:os, error } = await sb.from('orders')
    .select('id,no_order,status,nilai_jual,nilai_sample,total_bayar_buyer,tanggal_order,buyer_id,catatan,items,po_masuk_no')
    .order('created_at',{ascending:false});
  if(error) console.error('load orders', error);
  const bmap={}; buyersCache.forEach(b=>bmap[b.id]=b.nama);
  ordersCache=(os||[]).map(o=>({...o, buyer_name:bmap[o.buyer_id]||'—'}));
  orderLoading=false;
  render();

async function loadOrderSummary(id){

function bindOrderModule(){
  if(orderView==='list'){
    const nb=document.getElementById('oNew'); if(nb) nb.onclick=()=>{ orderView='new'; render(); };
    document.querySelectorAll('.o-row').forEach(r=>r.onclick=()=>{ openOrderId=r.dataset.open; orderView='card'; sampleFormOpen=false; poFormOpen=false; buyerPayFormOpen=false; render(); });
  } else if(orderView==='new'){
    const bsel=document.getElementById('oBuyer');
    if(bsel) bsel.onchange=()=>{ const w=document.getElementById('oBuyerNewWrap'); if(w) w.style.display = bsel.value==='__new'?'block':'none'; };
    const fs=document.getElementById('oFromSample');
    if(fs) fs.onchange=()=>{
      const o=(ordersCache||[]).find(x=>x.id===fs.value);
      const buyerEl=document.getElementById('oBuyer'), noEl=document.getElementById('oNo'),
            nsEl=document.getElementById('oNilaiSample'), stEl=document.getElementById('oStatus0'),
            nwEl=document.getElementById('oBuyerNewWrap'), cont=document.getElementById('itemRows');
      if(o){
        if(buyerEl){ buyerEl.value=o.buyer_id; buyerEl.disabled=true; }
        if(nwEl) nwEl.style.display='none';
        if(noEl){ noEl.value=o.no_order; noEl.readOnly=true; }
        if(nsEl){ nsEl.value=Number(o.nilai_sample)||0; nsEl.readOnly=true; }
        if(stEl){ stEl.value='po'; stEl.disabled=true; }
        if(cont){ cont.innerHTML=((o.items&&o.items.length)?o.items:[{}]).map(it=>itemRowHTML(it)).join(''); bindItemEditor(); recalcItemTotal(); }
      } else {
        if(buyerEl){ buyerEl.disabled=false; buyerEl.value=''; }
        if(noEl){ noEl.readOnly=false; }
        if(nsEl){ nsEl.readOnly=false; nsEl.value=''; }
        if(stEl){ stEl.disabled=false; stEl.value='sample'; }
      }
    };
    const sv=document.getElementById('oSave'); if(sv) sv.onclick=saveNewOrder;
    const cx=document.getElementById('oCancel'); if(cx) cx.onclick=()=>{ orderView='list'; render(); };
  } else if(orderView==='edit'){
    const bsel=document.getElementById('oBuyer');
    const sv=document.getElementById('oSave'); if(sv) sv.onclick=saveEditOrder;
    const cx=document.getElementById('oCancel'); if(cx) cx.onclick=()=>{ orderView='card'; render(); };
  } else if(orderView==='card'){
    const bk=document.getElementById('oBack'); if(bk) bk.onclick=()=>{ orderView='list'; openOrderId=null; sampleFormOpen=false; poFormOpen=false; buyerPayFormOpen=false; render(); };
    const ed=document.getElementById('oEdit'); if(ed) ed.onclick=()=>{ orderView='edit'; render(); };
    const dl=document.getElementById('oDel'); if(dl) dl.onclick=deleteOrder;
    const ss=document.getElementById('oStatus'); if(ss) ss.onchange=async()=>{
      const ns=ss.value;
      const { error }=await sb.from('orders').update({status:ns}).eq('id',openOrderId);
      if(error){ alert('Gagal ubah status: '+error.message); return; }
      const o=ordersCache.find(x=>x.id===openOrderId); if(o) o.status=ns;
      delete orderSummary[openOrderId];
      render();
    };
    const da=document.getElementById('docAdd'); if(da) da.onclick=()=>{ sampleFormOpen=true; editDocId=null; render(); };
    const dc=document.getElementById('docCancel'); if(dc) dc.onclick=()=>{ sampleFormOpen=false; editDocId=null; render(); };
    const ds=document.getElementById('docSave'); if(ds) ds.onclick=saveDoc;
    const dj=document.getElementById('docJenis'); if(dj) dj.onchange=()=>{ const no=document.getElementById('docNo'); if(no && !editDocId) no.value=docNoSuggest(dj.value, orderDocs[openOrderId]||[]); };
    document.querySelectorAll('[data-editdoc]').forEach(b=>b.onclick=()=>{ editDocId=b.dataset.editdoc; sampleFormOpen=true; render(); });
    document.querySelectorAll('[data-deldoc]').forEach(b=>b.onclick=()=>deleteDoc(b.dataset.deldoc));
    const pac=document.getElementById('poAddCard'); if(pac) pac.onclick=()=>{ poFormOpen=true; render(); };
    bindPOCommon(true);
    const bpa=document.getElementById('bpAdd'); if(bpa) bpa.onclick=()=>{ buyerPayFormOpen=true; render(); };
    const bpc=document.getElementById('bpCancel'); if(bpc) bpc.onclick=()=>{ buyerPayFormOpen=false; render(); };
    const bps=document.getElementById('bpSave'); if(bps) bps.onclick=saveBuyerPayment;
    document.querySelectorAll('[data-delpay]').forEach(b=>b.onclick=()=>deleteBuyerPayment(b.dataset.delpay));
    bindBuyerPayForm();
  }
  bindItemEditor();
}
async function deleteOrder(){
  const o=ordersCache.find(x=>x.id===openOrderId);
  if(!o) return;
  if(!confirm('Hapus order '+o.no_order+' ('+o.buyer_name+')?\n\nSEMUA yang menempel ikut terhapus:\n• PO keluar\n• tagihan supplier + pembayarannya\n• pengiriman\n• transaksi buyer (DP/pelunasan)\n\nTindakan ini tidak bisa dibatalkan.')) return;
  const oid=openOrderId;
  const { error }=await sb.rpc('delete_order_cascade', { p_order: oid });
  if(error){ alert('Gagal hapus: '+error.message); return; }
  orderSummary={}; poCache=null; billsCache=null; shipCache=null; orderFinance=null;
  delete orderPayments[oid]; delete orderDocs[oid];
  ordersCache=null; orderView='list'; openOrderId=null; render();
}

async function saveEditOrder(){
  const err=document.getElementById('oErr'); err.textContent='';
  const buyer_id=document.getElementById('oBuyer').value;
  const no=document.getElementById('oNo').value.trim();
  const items=collectItems();
  const nilai=items.length ? computeItemTotals(items).total : (Number(document.getElementById('oNilai').value)||0);
  const nilaiSample=Number((document.getElementById('oNilaiSample')||{}).value)||0;
  const tgl=document.getElementById('oTgl').value||today();
  const cat=document.getElementById('oCatatan').value.trim();
  const status=(document.getElementById('oStatus0')||{}).value||'sample';
  const poMasuk=(document.getElementById('oPoMasuk')?document.getElementById('oPoMasuk').value.trim():'')||null;
  if(!no){ err.textContent='No order wajib diisi.'; return; }
  if(!buyer_id){ err.textContent='Pilih buyer.'; return; }
  const btn=document.getElementById('oSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const { error }=await sb.from('orders').update({ no_order:no, buyer_id, nilai_jual:nilai, nilai_sample:nilaiSample, tanggal_order:tgl, catatan:cat, status, items, po_masuk_no:poMasuk }).eq('id',openOrderId);
  if(error){ err.textContent='Gagal simpan: '+error.message; btn.disabled=false; btn.textContent='Simpan perubahan'; return; }
  delete orderSummary[openOrderId];
  ordersCache=null; orderView='card'; orderFinance=null; render();
}

async function resolveBuyerId(name){
  const found=buyersCache.find(b=>(b.nama||'').toLowerCase()===name.toLowerCase());
  if(found) return { id:found.id };
  const { data:nb, error }=await sb.from('buyers').insert({nama:name}).select('id,nama').single();
  if(error) return { error:error.message };
  buyersCache.push(nb);
  return { id:nb.id };
}
async function saveNewOrder(){
  const err=document.getElementById('oErr'); err.textContent='';
  const bsel=document.getElementById('oBuyer').value;
  const bnewEl=document.getElementById('oBuyerNew');
  const bnew=bnewEl?bnewEl.value.trim():'';
  const no=document.getElementById('oNo').value.trim();
  const items=collectItems();
  const nilai=items.length ? computeItemTotals(items).total : (Number(document.getElementById('oNilai').value)||0);
  const nilaiSample=Number((document.getElementById('oNilaiSample')||{}).value)||0;
  const tgl=document.getElementById('oTgl').value||today();
  const cat=document.getElementById('oCatatan').value.trim();
  const status=(document.getElementById('oStatus0')||{}).value||'sample';
  const poMasuk=(document.getElementById('oPoMasuk')?document.getElementById('oPoMasuk').value.trim():'')||null;
  if(!no){ err.textContent='No order wajib diisi.'; return; }
  const btn=document.getElementById('oSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const reset=()=>{ btn.disabled=false; btn.textContent='Simpan order'; };
  // Lanjutan dari sample → ubah order sample yang sama jadi PO (histori & nilai sample tetap)
  const fromSampleId=(document.getElementById('oFromSample')||{}).value||'';
  if(fromSampleId){
    const { error }=await sb.from('orders').update({ status:'po', nilai_jual:nilai, po_masuk_no:poMasuk, items, catatan:cat }).eq('id',fromSampleId);
    if(error){ err.textContent='Gagal simpan: '+error.message; reset(); return; }
    delete orderSummary[fromSampleId]; ordersCache=null; orderView='list'; orderFinance=null; sampleDocIds=null; render();
    return;
  }
  let buyer_id=null;
  if(bsel==='__new'){
    if(!bnew){ err.textContent='Isi nama buyer baru.'; reset(); return; }
    const r=await resolveBuyerId(bnew); if(r.error){ err.textContent='Gagal simpan buyer: '+r.error; reset(); return; } buyer_id=r.id;
  } else if(bsel.indexOf('name::')===0){
    const nm=decodeURIComponent(bsel.slice(6));
    const r=await resolveBuyerId(nm); if(r.error){ err.textContent='Gagal simpan buyer: '+r.error; reset(); return; } buyer_id=r.id;
  } else if(bsel){ buyer_id=bsel; }
  else { err.textContent='Pilih buyer dulu.'; reset(); return; }
  const { error }=await sb.from('orders').insert({
    no_order:no, buyer_id, nilai_jual:nilai, nilai_sample:nilaiSample, tanggal_order:tgl, catatan:cat,
    items, status, po_masuk_no:poMasuk, pic_sales:currentUserId
  });

const DOC_JENIS=[['pi_sample','PI Sample'],['pi_dp','PI (DP)'],['invoice','Invoice']];
function docLabel(j){ const f=DOC_JENIS.find(x=>x[0]===j); return f?f[1]:(j==='invoice_sample'?'Invoice Sample':j); }
function docNoSuggest(jenis, docs){
  const now=new Date(); const yy=String(now.getFullYear()).slice(-2); const m=now.getMonth()+1;
  const seq=String((docs||[]).filter(d=>d.jenis===jenis).length+1).padStart(3,'0');
  if(jenis==='pi_sample') return `PI-S/${yy}${m}-${seq}`;
  if(jenis==='pi_dp') return `PI/${yy}${m}-${seq}`;
  if(jenis==='invoice') return `INV/${yy}${m}-${seq}`;
  return '';
}
function defaultDocJenis(o, docs){

async function savePO(){
  const err=document.getElementById('poErr'); err.textContent='';
  const orderSel=document.getElementById('poOrder');
  const order_id = orderSel ? orderSel.value : openOrderId;
  const ssel=document.getElementById('poSupplier').value;
  const snewEl=document.getElementById('poSupplierNew');
  const snew=snewEl?snewEl.value.trim():'';
  const no=document.getElementById('poNo').value.trim();
  const tgl=document.getElementById('poTgl').value||today();
  const items=collectItems();
  const total=items.length ? computeItemTotals(items).total : (Number(document.getElementById('poTotal').value)||0);
  const bayarStatus=(document.getElementById('poStatus')||{}).value||'belum';
  const tempo=document.getElementById('poTempo')?(document.getElementById('poTempo').value||null):null;
  const deadline=document.getElementById('poDeadline')?(document.getElementById('poDeadline').value||null):null;
  if(!order_id){ err.textContent='Pilih order dulu.'; return; }
  if(!no){ err.textContent='No PO wajib diisi.'; return; }
  const btn=document.getElementById('poSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const reset=()=>{ btn.disabled=false; btn.textContent='Simpan PO'; };
  let supplier_id=null;
  if(ssel==='__new'){
    if(!snew){ err.textContent='Isi nama supplier baru.'; reset(); return; }
    const r=await resolveSupplierId(snew); if(r.error){ err.textContent='Gagal simpan supplier: '+r.error; reset(); return; } supplier_id=r.id;
  } else if(ssel){ supplier_id=ssel; }
  else { err.textContent='Pilih supplier.'; reset(); return; }
  const { error }=await sb.from('purchase_orders').insert({ no_po:no, order_id, supplier_id, tanggal:tgl, total, items, jatuh_tempo:tempo, deadline_kirim:deadline, bayar_status:bayarStatus });
  if(error){ err.textContent='Gagal simpan PO: '+error.message; reset(); return; }
  poCache=null;
  if(orderSel) poView='list'; else poFormOpen=false;
  render();
}
async function deletePO(id){
  if(!confirm('Hapus PO keluar ini?')) return;
  const { error }=await sb.from('purchase_orders').delete().eq('id',id);
  if(error){ alert('Gagal hapus: '+error.message+'\n(PO yang sudah punya tagihan tidak bisa dihapus.)'); return; }
  poCache=null; render();
}

async function loadBills(){
  billLoading=true;
  if(suppliersCache===null){ const { data }=await sb.from('suppliers').select('id,nama').order('nama'); suppliersCache=data||[]; }
  if(ordersCache===null){
    const { data:bs }=await sb.from('buyers').select('id,nama').order('nama'); buyersCache=bs||[];
    const { data:os }=await sb.from('orders').select('id,no_order,status,nilai_jual,nilai_sample,total_bayar_buyer,tanggal_order,buyer_id,catatan,items,po_masuk_no').order('created_at',{ascending:false});

    ordersCache=(os||[]).map(o=>({...o, buyer_name:bmap[o.buyer_id]||'—'}));
  }
  const { data }=await sb.from('supplier_bills').select('id,no_tagihan,po_id,order_id,supplier_id,nilai,tanggal_terima,jatuh_tempo,jenis,status,items,suppliers(nama),orders(no_order)').order('created_at',{ascending:false});
  billsCache=(data||[]).map(b=>({...b, supplier_name:b.suppliers?b.suppliers.nama:'—', order_no:b.orders?b.orders.no_order:'—'}));
  const { data:pays }=await sb.from('bill_payments').select('bill_id,jumlah');
  const paid={}; (pays||[]).forEach(p=>{ paid[p.bill_id]=(paid[p.bill_id]||0)+(Number(p.jumlah)||0); });

async function saveBill(){

async function savePayment(){
  const err=document.getElementById('payErr'); if(err) err.textContent='';
  const b=billsCache.find(x=>x.id===payingBillId); if(!b) return;
  const jumlah=Number(document.getElementById('payJumlah').value)||0;
  const tgl=document.getElementById('payTgl').value||today();
  if(jumlah<=0){ if(err) err.textContent='Jumlah harus lebih dari 0.'; return; }
  const btn=document.getElementById('paySave'); btn.disabled=true; btn.textContent='Memproses…';
  const { data:tx, error:te }=await sb.from('transactions').insert({ tanggal:tgl, arah:'keluar', jenis:'bayar_hutang', jumlah, order_id:b.order_id, kategori:'Bayar supplier', catatan:'Tagihan '+(b.no_tagihan||'') }).select('id').single();
  if(te){ if(err) err.textContent='Gagal catat kas: '+te.message; btn.disabled=false; btn.textContent='Bayar'; return; }
  const { error:pe }=await sb.from('bill_payments').insert({ bill_id:b.id, tanggal:tgl, jumlah, transaction_id:tx.id });
  if(pe){ if(err) err.textContent='Gagal simpan pembayaran: '+pe.message; btn.disabled=false; btn.textContent='Bayar'; return; }
  const paidNew=(Number(b.paid)||0)+jumlah;

  await sb.from('supplier_bills').update({status}).eq('id',b.id);
  orderSummary={}; billsCache=null; orderFinance=null; payingBillId=null; render();
}

async function resolveBuyerId(name){
  const found=(buyersCache||[]).find(b=>(b.nama||'').toLowerCase()===name.toLowerCase());
  if(found) return { id:found.id };
  const { data:nb, error }=await sb.from('buyers').insert({nama:name}).select('id,nama').single();
  if(error) return { error:error.message };
  (buyersCache=buyersCache||[]).push(nb);
  return { id:nb.id };
}
async function loadShipments(){
  shipLoading=true;
  if(suppliersCache===null){ const { data }=await sb.from('suppliers').select('id,nama').order('nama'); suppliersCache=data||[]; }
  if(buyersCache===null){ const { data:bs }=await sb.from('buyers').select('id,nama,alamat,kontak').order('nama'); buyersCache=bs||[]; }
  if(ordersCache===null){
    const { data:os }=await sb.from('orders').select('id,no_order,status,buyer_id,items').order('created_at',{ascending:false});
    const bmap={}; (buyersCache||[]).forEach(b=>bmap[b.id]=b.nama);

  const { data:ss }=await sb.from('shipments')
    .select('id,no_kirim,order_id,buyer_id,jenis,ekspedisi,no_resi,tanggal_kirim,tanggal_terima,status,catatan,buyers(nama,alamat,kontak),orders(no_order,po_masuk_no),shipment_items(id,nama_item,qty,jumlah,netto,keterangan,supplier_id)')
    .order('created_at',{ascending:false});
  shipCache=(ss||[]).map(s=>({...s, buyer_name:s.buyers?s.buyers.nama:'—', buyer_alamat:s.buyers?s.buyers.alamat:'', buyer_kontak:s.buyers?s.buyers.kontak:'', order_no:s.orders?s.orders.no_order:null, order_po_masuk:s.orders?s.orders.po_masuk_no:null}));
  shipLoading=false;

}

async function saveShipment(){
  const err=document.getElementById('shErr'); if(err) err.textContent='';
  const orderEl=document.getElementById('shOrder');
  let order_id=orderEl?(orderEl.value||null):null;
  const bsel=document.getElementById('shBuyer').value;
  const bnewEl=document.getElementById('shBuyerNew');
  const bnew=bnewEl?bnewEl.value.trim():'';
  const no=document.getElementById('shNo').value.trim();
  const jenis=document.getElementById('shJenis').value||'barang';
  const eksp=document.getElementById('shEksp').value.trim();
  const resi=document.getElementById('shResi').value.trim();
  const tgl=document.getElementById('shTgl').value||today();
  const status=document.getElementById('shStatus').value||'dikirim';
  const terima=status==='diterima'?(document.getElementById('shTerima').value||tgl):null;
  const catatan=document.getElementById('shCatatan').value.trim();
  const shipKontak=((document.getElementById('shKontak')||{}).value||'').trim();
  const shipAlamat=((document.getElementById('shAlamat')||{}).value||'').trim();
  const items=collectShipItems();
  if(!no){ if(err) err.textContent='No surat jalan / kirim wajib diisi.'; return; }
  const btn=document.getElementById('shSave'); const lbl=btn.textContent; btn.disabled=true; btn.textContent='Menyimpan…';
  const reset=()=>{ btn.disabled=false; btn.textContent=lbl; };
  let buyer_id=null;
  if(bsel==='__new'){
    if(!bnew){ if(err) err.textContent='Isi nama buyer baru.'; reset(); return; }
    const r=await resolveBuyerId(bnew); if(r.error){ if(err) err.textContent='Gagal simpan buyer: '+r.error; reset(); return; } buyer_id=r.id;
  } else if(bsel){ buyer_id=bsel; }
  if(order_id && !buyer_id){ const o=(ordersCache||[]).find(x=>x.id===order_id); if(o) buyer_id=o.buyer_id||null; }
  if(!buyer_id && !order_id){ if(err) err.textContent='Pilih buyer atau order dulu.'; reset(); return; }
  // simpan alamat/kontak SHIP TO ke data buyer supaya tak perlu ketik ulang berikutnya
  if(buyer_id && (shipAlamat||shipKontak)){
    await sb.from('buyers').update({ alamat:shipAlamat||null, kontak:shipKontak||null }).eq('id',buyer_id);
    const bc=(buyersCache||[]).find(x=>x.id===buyer_id); if(bc){ bc.alamat=shipAlamat||null; bc.kontak=shipKontak||null; }
  }
  const header={ no_kirim:no, order_id, buyer_id, jenis, ekspedisi:eksp||null, no_resi:resi||null, tanggal_kirim:tgl, tanggal_terima:terima, status, catatan:catatan||null };
  let shipmentId=editShipId;
  if(editShipId){
    const { error:eu }=await sb.from('shipments').update(header).eq('id',editShipId);
    if(eu){ if(err) err.textContent='Gagal simpan: '+eu.message; reset(); return; }
    await sb.from('shipment_items').delete().eq('shipment_id',editShipId);
  } else {
    const { data, error:ei }=await sb.from('shipments').insert(header).select('id').single();
    if(ei){ if(err) err.textContent='Gagal simpan: '+ei.message; reset(); return; }
    shipmentId=data.id;
  }
  if(items.length){
    const payload=items.map(i=>({shipment_id:shipmentId, nama_item:i.nama_item, qty:i.qty, jumlah:i.jumlah||null, netto:i.netto||null, keterangan:i.keterangan||null, supplier_id:i.supplier_id}));
    const { error:eit }=await sb.from('shipment_items').insert(payload);
    if(eit){ if(err) err.textContent='Header tersimpan, tapi rincian item gagal: '+eit.message; }
  }
  shipCache=null; shipView='list'; editShipId=null; render();
}

  if(!confirm('Hapus pengiriman ini? Rincian isinya ikut terhapus.')) return;
  const { error }=await sb.from('shipments').delete().eq('id',id);
  if(error){ alert('Gagal hapus: '+error.message); return; }
  shipCache=null; render();

  bindShipItemEditor();

function fmtShort(n){ n=Number(n)||0; const s=n<0?'-':''; const a=Math.abs(n);
  if(a>=1e9) return s+(a/1e9).toFixed(a>=1e10?0:1).replace('.0','')+'M';
  if(a>=1e6) return s+Math.round(a/1e6)+'jt';
  if(a>=1e3) return s+Math.round(a/1e3)+'rb';
  return s+Math.round(a); }
function rpKpi(n){ n=Number(n)||0; const s=n<0?'-':''; const a=Math.abs(n);
  if(a>=1e9) return s+'Rp'+(a/1e9).toFixed(1).replace('.',',').replace(',0','')+' M';
  if(a>=1e6) return s+'Rp'+(a/1e6).toFixed(1).replace('.',',').replace(',0','')+' jt';
  if(a>=1e3) return s+'Rp'+Math.round(a/1e3)+' rb';
  return s+'Rp'+Math.round(a); }
function prevMonthOf(mo){ const i=state.months.indexOf(mo); return i>0?state.months[i-1]:null; }
function kpiTrend(cur,prev,goodUp){
  if(prev==null) return `<div class="kpi-trend flat">${ic('minus',15)}—<span class="lbl">bulan pertama</span></div>`;
  const diff=cur-prev, flat=Math.abs(diff)<0.5;
  const pct = prev!==0 ? Math.round(Math.abs(diff)/Math.abs(prev)*1000)/10 : (cur!==0?100:0);
  const up=diff>0;
  const cls = flat?'flat':((goodUp?up:!up)?'up':'down');
  const icon = flat?'minus':(up?'arrow-up-right':'arrow-down-right');
  const sign = flat?'':(up?'+':'−');
  return `<div class="kpi-trend ${cls}">${ic(icon,15)}${sign}${pct}%<span class="lbl">vs bulan lalu</span></div>`;
}
function areaChartSVG(){
  const months=state.months.slice(-9);
  if(!months.length) return `<div class="empty">Belum ada data bulan</div>`;
  const sales=months.map(m=>totalPenjualanAll(m)), exp=months.map(m=>totalBiayaAll(m));
  const W=720,H=250,Pl=54,Pr=14,Pt=14,Pb=30, iw=W-Pl-Pr, ih=H-Pt-Pb, n=months.length;
  const max=Math.max(1,...sales,...exp);
  const X=i=> n<=1?Pl+iw/2:Pl+iw*i/(n-1);
  const Y=v=> Pt+ih*(1-v/max);
  let grid='',ylab='';
  for(let g=0;g<=4;g++){ const val=max*g/4,y=Y(val);
    grid+=`<line x1="${Pl}" y1="${y.toFixed(1)}" x2="${W-Pr}" y2="${y.toFixed(1)}" stroke="#EDEFEC"/>`;
    ylab+=`<text x="${Pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="cx">${fmtShort(val)}</text>`; }
  let xlab=''; months.forEach((m,i)=>{ xlab+=`<text x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle" class="cx">${esc(m.split(' ')[0].slice(0,3))}</text>`; });
  const pts=arr=>arr.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const base=(Pt+ih).toFixed(1);
  const area=n>1?`<polygon points="${X(0).toFixed(1)},${base} ${pts(sales)} ${X(n-1).toFixed(1)},${base}" fill="#DDF3E5"/>`:'';
  const sLine=n>1?`<polyline points="${pts(sales)}" fill="none" stroke="#12A150" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:'';
  const eLine=n>1?`<polyline points="${pts(exp)}" fill="none" stroke="#E08A00" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>`:'';
  const dots=sales.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i===n-1?4:2.5}" fill="#12A150"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter',sans-serif"><style>.cx{font-size:10px;fill:#94A29A}</style>${grid}${area}${eLine}${sLine}${dots}${ylab}${xlab}</svg>`;
}
function barChartSVG(){
  const mo=state.currentMonth;
  const data=state.buyers.map(b=>({name:b.name,val:salesData(mo,b.id).total})).sort((a,b)=>b.val-a.val).slice(0,6);
  if(!data.length) return `<div class="empty">Belum ada buyer</div>`;
  const W=430,H=250,Pl=46,Pr=8,Pt=14,Pb=48, iw=W-Pl-Pr, ih=H-Pt-Pb, n=data.length;
  const max=Math.max(1,...data.map(d=>d.val));
  const gap=iw/n, bw=Math.min(46,gap*0.6);
  const colors=['#12A150','#2F8FDA','#E08A00','#7C5CD6','#E8455C','#0DA090'];
  let grid='',ylab='';
  for(let g=0;g<=4;g++){ const val=max*g/4,y=Pt+ih*(1-g/4);
    grid+=`<line x1="${Pl}" y1="${y.toFixed(1)}" x2="${W-Pr}" y2="${y.toFixed(1)}" stroke="#EDEFEC"/>`;
    ylab+=`<text x="${Pl-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="cx">${fmtShort(val)}</text>`; }
  let bars='';
  data.forEach((d,i)=>{ const x=Pl+gap*i+(gap-bw)/2, h=Math.max(0,ih*d.val/max), y=Pt+ih-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${colors[i%colors.length]}"/>`;
    const nm=d.name.length>9?d.name.slice(0,8)+'…':d.name;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-16}" text-anchor="middle" class="cx">${esc(nm)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet" style="font-family:'Inter',sans-serif"><style>.cx{font-size:10px;fill:#94A29A}</style>${grid}${bars}${ylab}</svg>`;
}

async function loadOrderFinance(){
  const { data:tx }=await sb.from('transactions').select('arah,jenis,jumlah');
  let masuk=0, bayarSupplier=0, biaya=0, modal=0;
  (tx||[]).forEach(t=>{ const j=Number(t.jumlah)||0;
    if(t.arah==='masuk' && (t.jenis==='dp'||t.jenis==='pelunasan')) masuk+=j;
    else if(t.arah==='keluar' && t.jenis==='bayar_hutang') bayarSupplier+=j;
    else if(t.arah==='keluar' && t.jenis==='biaya_usaha') biaya+=j;
    else if(t.jenis==='modal') modal+=j;
  });
  const { data:os }=await sb.from('orders').select('nilai_jual,total_bayar_buyer,status');
  let nilaiOrder=0, piutang=0, jumlahOrder=0;
  (os||[]).forEach(o=>{ if(o.status==='batal') return; jumlahOrder++;
    const nj=Number(o.nilai_jual)||0, by=Number(o.total_bayar_buyer)||0;
    nilaiOrder+=nj; piutang+=Math.max(0,nj-by);
  });
  let hpp=0, laba=0;
  const { data:vs }=await sb.from('v_order_summary').select('hpp,laba');
  (vs||[]).forEach(v=>{ hpp+=Number(v.hpp)||0; laba+=Number(v.laba)||0; });
  orderFinance={masuk,bayarSupplier,biaya,modal,nilaiOrder,piutang,jumlahOrder,hpp,laba};
  render();
}

function tempoText(c){
  if(c.status==='lunas') return `<div class="tempo-note ok">Order sudah lunas.</div>`;
  if(!c.jatuhTempo) return `<div class="tempo-note ok">Jatuh tempo belum ditentukan (isi tanggal kirim).</div>`;
  const d=c.daysLeft;
  if(d===null) return '';
  if(d>1) return `<div class="tempo-note soon">Sisa tempo <b>${d} hari lagi</b> (jatuh tempo ${c.jatuhTempo}).</div>`;
  if(d===1) return `<div class="tempo-note soon">Jatuh tempo <b>besok</b> (${c.jatuhTempo}).</div>`;
  if(d===0) return `<div class="tempo-note over">Jatuh tempo <b>hari ini</b> (${c.jatuhTempo}).</div>`;
  return `<div class="tempo-note over">Sudah <b>lewat tempo ${Math.abs(d)} hari</b> (jatuh tempo ${c.jatuhTempo}).</div>`;
}

  const err=document.getElementById('sgErr'); if(err){ err.textContent=''; err.style.color='var(--danger)'; }
  const oid=pjOrderId||openOrderId;
  const jumlah=Number(document.getElementById('sgCost').value)||0;
  const note=document.getElementById('sgNote').value.trim();
  if(jumlah<=0){ if(err) err.textContent='Isi biaya sample (lebih dari 0).'; return; }
  const btn=document.getElementById('sgSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const { error }=await sb.from('transactions').insert({ tanggal:today(), arah:'keluar', jenis:'biaya_usaha', jumlah, order_id:oid, kategori:'Sample gratis / marketing', catatan:note||null });
  if(error){ if(err) err.textContent='Gagal: '+error.message; btn.disabled=false; btn.textContent='Catat sebagai Biaya usaha (marketing)'; return; }
  delete orderSummary[oid]; orderFinance=null;
  document.getElementById('sgCost').value=''; document.getElementById('sgNote').value='';
  btn.disabled=false; btn.textContent='Catat sebagai Biaya usaha (marketing)';
  if(err){ err.style.color='#1D6B4F'; err.textContent='Tersimpan sebagai Biaya usaha ✓'; }
}

function tempoInline(c){
  if(c.status==='lunas') return '<span class="who">lunas</span>';
  if(!c.jatuhTempo) return '<span class="who">belum ada tgl</span>';
  const d=c.daysLeft;
  if(d===null) return '';
  if(d>1) return `<span class="tempo-note soon">${d} hari lagi</span>`;
  if(d===1) return `<span class="tempo-note soon">besok</span>`;
  if(d===0) return `<span class="tempo-note over">hari ini</span>`;
  return `<span class="tempo-note over">lewat ${Math.abs(d)} hari</span>`;
}
function viewPiutang(){
  const mo=state.currentMonth;
  const rows=[];
  state.buyers.forEach(b=>{
    getOrders(mo,b.id).forEach(o=>{
      const c=orderCalc(o);
      if(c.sisa>0.5){
        const statusPill = c.status==='dp'?'<span class="pill dp">DP</span>':'<span class="pill belum">Belum bayar</span>';
        rows.push(`<tr>
          <td class="txt">${b.name}</td>
          <td class="txt">Inv ${o.noInvoice||'(tanpa no)'}<div class="who">PI ${o.noPI||'-'} · ${statusPill}</div></td>
          <td class="txt">${o.tglKirim||'-'}</td>
          <td class="txt">${c.jatuhTempo||'-'}<div>${tempoInline(c)}</div></td>
          <td class="num">${rp(c.totalTagihan)}</td>
          <td class="num">${rp(c.dibayar)}<div class="who">DP ${o.dpPct||0}%</div></td>
          <td class="num">${rp(c.sisa)}</td>
        </tr>`);
      }
    });
  });
  return `
  <h2 class="sec">Piutang — ${mo}</h2>
  <p class="note">Order yang belum lunas (sisa &gt; 0). Piutang = Total tagihan − total pembayaran diterima. Detail sama dengan blok "Sisa piutang" di tiap order.</p>
  <div class="card">
    <table>
      <tr><th>Buyer</th><th>Invoice / status</th><th>Tgl kirim</th><th>Jatuh tempo</th><th class="num">Total tagihan</th><th class="num">Dibayar</th><th class="num">Sisa piutang</th></tr>
      ${rows.join('')||'<tr><td colspan="7" class="empty">Tidak ada piutang. Semua order lunas 🎉</td></tr>'}
      <tr class="total"><td colspan="6">Total piutang</td><td class="num">${rp(piutangAll(mo))}</td></tr>
    </table>
  </div>`;
}

// ---- HPP ----
function viewProfit(){
  const mo=state.currentMonth;
  const s=state.settings[mo]||{investors:[],pettyCash:0};
  const rows=state.buyers.map(b=>`
    <tr><td class="txt">${b.name}</td><td class="num">${rp(salesData(mo,b.id).subtotal)}</td><td class="num">${rp(totalBiayaBuyer(mo,b.id))}</td><td class="num ${hppBuyer(mo,b.id)>=0?'':'neg'}">${rp(hppBuyer(mo,b.id))}</td></tr>`).join('');
  const invRows=(s.investors||[]).map(i=>`
    <tr><td class="txt">${i.name||'Investor'}</td><td class="txt">${buyerName(i.sourceBuyerId)}</td><td class="num">${rp(i.amount)}</td>
    <td class="txt"><span class="act edit" data-edit-inv="${i.id}">edit</span><span class="act del" data-del-inv="${i.id}">hapus</span></td></tr>`).join('');
  const editInv=(editing.inv)?(s.investors||[]).find(i=>i.id===editing.inv):null;
  const np=nettProfit(mo);
  return `
  <h2 class="sec">HPP — ${mo}</h2>
  <div class="card">
    <table>
      <tr><th>Buyer</th><th class="num">Penjualan (tanpa PPN)</th><th class="num">Biaya usaha</th><th class="num">HPP</th></tr>
      ${rows||'<tr><td colspan="4" class="empty">Belum ada buyer</td></tr>'}
      <tr class="total"><td>Total</td><td class="num">${rp(state.buyers.reduce((x,b)=>x+salesData(mo,b.id).subtotal,0))}</td><td class="num">${rp(totalBiayaAll(mo))}</td><td class="num ${hppAll(mo)>=0?'':'neg'}">${rp(hppAll(mo))}</td></tr>
    </table>
  </div>
  <div class="card">
    <h3 class="sub">Investor</h3>
    <table>
      <tr><th>Nama</th><th>Sumber (profit buyer)</th><th class="num">Nilai investasi</th><th></th></tr>
      ${invRows||'<tr><td colspan="4" class="empty">Belum ada investor</td></tr>'}
      <tr class="total"><td colspan="2">Total investor</td><td class="num">${rp(investorsTotal(mo))}</td><td></td></tr>
    </table>
    <div class="form-row">
      <input id="invName" placeholder="Nama investor" value="${editInv?esc(editInv.name):''}">
      <select id="invSource"><option value="">Pilih sumber buyer</option>
        ${state.buyers.map(b=>`<option value="${b.id}" ${editInv&&editInv.sourceBuyerId===b.id?'selected':''}>${b.name}</option>`).join('')}</select>
      <input id="invAmount" type="number" placeholder="Nilai investasi (Rp)" value="${editInv?esc(editInv.amount):''}">
      <button data-${editInv?'update':'add'}-inv${editInv?`="${editInv.id}"`:''}>${editInv?'Simpan':'+ Tambah'}</button>
      ${editInv?`<button class="cancel" data-cancel-inv="1">Batal</button>`:''}
    </div>
  </div>
  <div class="card">
    <h3 class="sub">Petty cash</h3>
    <div class="form-row">
      <input id="pettyInput" type="number" placeholder="Nominal petty cash (Rp)" value="${s.pettyCash||''}">
      <button data-add="petty">Simpan</button>
    </div>
    <table style="margin-top:10px;">
      <tr><td class="txt">HPP semua buyer</td><td class="num">${rp(hppAll(mo))}</td></tr>
      <tr><td class="txt">Investor</td><td class="num">${rp(investorsTotal(mo))}</td></tr>
      <tr><td class="txt">Petty cash</td><td class="num">${rp(pettyCash(mo))}</td></tr>
      <tr class="total"><td>Nett profit</td><td class="num ${np>=0?'':'neg'}">${rp(np)}</td></tr>
    </table>
  </div>`;
}

}

function defaultNotes(o, isPI){
  const c=orderCalc(o);
  const dp=o.dpPct||0, rem=100-dp;
  const dpNow=Math.round(c.totalTagihan*dp/100);
  const remaining=c.totalTagihan-dpNow;
  const po=o.noPO?(' as agreed per PO No. '+o.noPO):'';
  if(isPI){
    return [
      `This Proforma Invoice covers the ${dp}% Down Payment${po}.`,
      `The remaining ${rem}% (Final Payment) of Rp ${remaining.toLocaleString('id-ID')} will be billed via a separate Invoice after the goods are shipped.`,
      `Please include the document number (${o.noPI||'-'}) as the payment reference.`
    ];
  }
  return [
    `This Invoice bills the ${rem}% Final Payment (settlement)${po}.`,
    `The ${dp}% Down Payment of Rp ${dpNow.toLocaleString('id-ID')} has been paid previously (PI ${o.noPI||'-'}).`,
    `Please include the invoice number (${o.noInvoice||'-'}) as the payment reference.`
  ];
}
function renderOverlay(){
  const mount=document.getElementById('overlayMount');
  if(!editing.doc){ mount.innerHTML=''; return; }
  const {kind,buyerId,orderId}=editing.doc;
  const mo=state.currentMonth;
  const buyer=state.buyers.find(b=>b.id===buyerId);
  const o=findOrder(mo,buyerId,orderId);
  if(!buyer||!o){ mount.innerHTML=''; return; }
  const c=orderCalc(o);
  const s=state.seller||{};
  const isPI = kind==='PI';
  const dpNow = Math.round(c.totalTagihan*(o.dpPct||0)/100);
  const remaining = c.totalTagihan - dpNow;
  const docNo = isPI ? (o.noPI||'-') : (o.noInvoice||'-');
  const docDate = isPI ? o.tglOrder : (o.invoiceDate||o.tglKirim||o.tglOrder);

  const itemRows=(o.items||[]).map((r,i)=>`
    <tr><td class="c">${i+1}</td><td class="t">${esc(r.desc)}</td><td class="c">${r.qty} ${r.unit||''}</td>
    <td class="r">${(Number(r.harga)||0).toLocaleString('id-ID')}</td><td class="r">${(r.qty*r.harga).toLocaleString('id-ID')}</td></tr>`).join('');
  const blankRows = Array.from({length:Math.max(0,3-(o.items||[]).length)}).map(()=>`<tr><td class="c">&nbsp;</td><td></td><td></td><td></td><td></td></tr>`).join('');

  const notesArr = defaultNotes(o,isPI);
  const extraNotes = (s.notes||'').trim();
  const notesHtml = `<ol>${notesArr.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>`
    + (extraNotes ? `<div class="free">${esc(extraNotes)}</div>` : '');

  const buyerAddr = (buyer.alamat||'').trim();

  const profForm = editing.docEdit ? `
    <div class="profedit no-print">
      <div class="shead" style="margin-bottom:8px;">Info penjual (dipakai di semua dokumen)</div>
      <div class="fieldgrid">
        <div><label>Brand</label><input id="sBrand" value="${esc(s.brand)}"></div>
        <div><label>Nama badan hukum</label><input id="sLegal" value="${esc(s.legal)}"></div>
