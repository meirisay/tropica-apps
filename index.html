<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tropica Farm Business Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --tea-dark:#1F3D33;--tea-mid:#3E6259;--gold:#E0A83A;--gold-deep:#8A611F;
    --paper:#FBF7EC;--paper-line:#DCD2BC;--ink:#232821;--ink-soft:#5C645C;--danger:#A32D2D;--green:#2F7A4F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:#EDF3EE;color:var(--ink);}
  /* ===== Shell: sidebar gelap (kiri) + main pane ===== */
  .app{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{flex:none;width:242px;background:#152A23;color:#B4C6BC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:11px;padding:19px 18px 16px;}
  .brand .logo{width:42px;height:42px;border-radius:11px;flex:none;object-fit:contain;background:#F3EFE2;padding:4px;}
  .brand .bt{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:#F3EFE2;line-height:1.15;}
  .brand .bs{font-size:10px;color:#7E9488;letter-spacing:.05em;text-transform:uppercase;}
  .navwrap{flex:1;padding:8px 12px 16px;}
  .ic{flex:none;display:inline-block;vertical-align:middle;}
  .nav-item{margin-bottom:2px;}
  .nav-parent{display:flex;align-items:center;gap:11px;padding:10px 11px;font-size:13.5px;font-weight:500;color:#B4C6BC;cursor:pointer;border-radius:9px;}
  .nav-parent > span{flex:1;}
  .nav-parent .ic{opacity:.9;}
  .nav-parent > .ic:last-child{opacity:.55;transition:transform .2s ease;}
  .nav-parent:hover{background:#213A30;color:#EAF2ED;}
  .nav-parent.cur{background:var(--gold);color:#241906;font-weight:600;}
  .nav-parent.cur .ic{opacity:1;}
  .nav-parent.has-active{color:#EAF2ED;}
  .nav-item.open > .nav-parent{color:#EAF2ED;}
  .nav-item.open > .nav-parent > .ic:last-child{transform:rotate(90deg);}
  .subwrap{overflow:hidden;max-height:0;transition:max-height .24s ease;}
  .nav-item.open .subwrap{max-height:460px;}
  .sub{display:flex;align-items:center;padding:8px 11px 8px 44px;font-size:12.5px;color:#9DB3A9;cursor:pointer;border-radius:8px;margin:1px 0;position:relative;}
  .sub::before{content:'';position:absolute;left:26px;top:50%;width:5px;height:5px;border-radius:50%;background:#40584C;transform:translateY(-50%);}
  .sub > span{flex:1;}
  .sub .ic{opacity:.5;}
  .sub:hover{background:#213A30;color:#EAF2ED;}
  .sub.active{background:var(--gold);color:#241906;font-weight:600;}
  .sub.active::before{background:#241906;}
  .sub.locked{color:#617A6F;cursor:not-allowed;}
  .sub.locked::before{background:#33473D;}
  .sub.locked:hover{background:transparent;color:#617A6F;}
  .nav-parent.locked{cursor:not-allowed;color:#7C9187;}
  .nav-parent.locked:hover{background:transparent;color:#7C9187;}
  .nav-parent.locked .ic{opacity:.6;}
  .nav-parent.dim{color:#8AA096;}
  /* ===== Main pane ===== */
  .mainpane{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:#fff;border-bottom:1px solid #E4E7E4;height:60px;display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:30;}
  .ptitle{font-size:16px;font-weight:600;color:var(--tea-dark);white-space:nowrap;}
  .search{flex:1;max-width:400px;position:relative;margin-left:20px;}
  .search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#94A29A;}
  .search input{width:100%;border:1px solid #E4E7E4;background:#F4F6F4;border-radius:9px;padding:9px 12px 9px 34px;font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);}
  .search input:focus{outline:none;border-color:var(--tea-mid);background:#fff;}
  .topacts{display:flex;align-items:center;gap:12px;margin-left:auto;}
  .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid #E4E7E4;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5C6B63;font-size:18px;}
  .iconbtn:hover{background:#F4F6F4;color:var(--tea-dark);}
  .userchip{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid #E4E7E4;}
  .userchip .av{width:36px;height:36px;border-radius:9px;background:var(--tea-dark);color:#F3EFE2;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:none;}
  .userchip .un{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;}
  .userchip .ur{font-size:11px;color:var(--ink-soft);}
  #logoutBtn{background:#fff;color:var(--ink-soft);border:1px solid #E4E7E4;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  #logoutBtn:hover{background:#F4F6F4;color:var(--danger);}
  /* toolbar (bulan & buyer) */
  .toolbar{background:#fff;border-bottom:1px solid #E4E7E4;padding:11px 22px;}
  .monthbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .monthbar select,.monthbar input{background:#F4F6F4;color:var(--ink);border:1px solid #E4E7E4;border-radius:8px;padding:8px 11px;font-size:13px;font-family:'Inter',sans-serif;}
  .monthbar button{background:var(--tea-dark);color:#F3EFE2;border:none;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;}
  .monthbar button:hover{background:#2B4F44;}
  .content{flex:1;min-width:0;padding:22px 24px 60px;}
  /* ===== KPI cards ===== */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:16px;}
  .kpi{background:#fff;border:1px solid #E7EAE7;border-radius:12px;padding:12px 14px;box-shadow:0 1px 2px rgba(30,50,40,.04);transition:box-shadow .15s,transform .15s,border-color .15s;}
  .kpi:hover{box-shadow:0 6px 16px rgba(30,50,40,.09);transform:translateY(-2px);border-color:#D6DED8;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
  .kpi-l{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);line-height:1.25;}
  .kpi-ic{width:30px;height:30px;border-radius:9px;background:#E1F3E8;color:#12A150;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
  .kpi-ic.g{background:#DBF3E3;color:#12A150;}
  .kpi-ic.gold{background:#FDEFD3;color:#E08A00;}
  .kpi-ic.red{background:#FDE4E7;color:#E8455C;}
  .kpi-ic.teal{background:#D6F1EE;color:#0DA090;}
  .kpi-ic.violet{background:#EAE6FB;color:#7C5CD6;}
  .kpi-ic.blue{background:#DDEEFB;color:#2F8FDA;}
  .kpi-v{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--tea-dark);letter-spacing:-.02em;white-space:nowrap;}
  .kpi-trend{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-top:9px;}
  .kpi-trend i{font-size:15px;}
  .kpi-trend .lbl{font-weight:400;color:var(--ink-soft);}
  .kpi-trend.up{color:#12A150;}
  .kpi-trend.down{color:#E8455C;}
  .kpi-trend.flat{color:var(--ink-soft);}
  /* ===== Panel/chart cards ===== */
  .panel-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:16px;}
  .panel{background:#fff;border:1px solid #E7EAE7;border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(30,50,40,.04);}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .panel-head .pt{font-size:15px;font-weight:600;color:var(--tea-dark);margin:0;}
  .panel-head .ps{font-size:12px;color:var(--ink-soft);margin:2px 0 0;}
  .panel-head .kebab{color:#A9B4AD;font-size:18px;cursor:pointer;}
  .chart-svg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
  .sec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;}
  .sec-row h2{margin:0;}
  .sec-row .meta{font-size:12px;color:var(--ink-soft);}
  .seg{display:inline-flex;background:#F4F6F4;border:1px solid #E4E7E4;border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;color:var(--ink-soft);font-size:12px;font-weight:500;padding:6px 13px;border-radius:6px;cursor:pointer;font-family:'Inter',sans-serif;}
  .seg button.on{background:#fff;color:var(--tea-dark);font-weight:600;box-shadow:0 1px 2px rgba(30,50,40,.08);}
  .num.due{color:var(--danger);}
  .num.neg{color:var(--danger);}
  @media(max-width:1080px){ .kpi-grid{grid-template-columns:1fr 1fr;} .panel-grid{grid-template-columns:1fr;} }
  @media(max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:auto;height:auto;position:static;flex-direction:column;overflow:visible;}
    .navwrap{padding:8px 12px 12px;}
    .topbar{height:auto;flex-wrap:wrap;padding:10px 16px;gap:10px;}
    .search{order:5;flex:1 1 100%;max-width:none;margin:6px 0 0;}
    .content{padding:16px 14px 50px;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .card{overflow-x:auto;}
  }
  @media(max-width:860px){ .topacts{flex-wrap:wrap;} .userchip .un{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} }
  @media(max-width:560px){ .userchip .uinfo{display:none;} }
  @media(max-width:520px){ .kpi-grid{grid-template-columns:1fr;} }
  /* ===== Modul Order (Langkah 5) — tema teh dirapikan ===== */
  .o-wrap{max-width:940px;}
  .o-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .o-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--tea-dark);margin:0;}
  .o-btn{background:var(--tea-dark);color:#F3EFE2;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .o-btn:hover{background:#2B4F44;}
  .o-btn.ghost{background:transparent;color:var(--tea-dark);border:1px solid var(--paper-line);}
  .o-btn.ghost:hover{background:#F1ECDD;}
  .o-card{background:#fff;border:1px solid #EAE3D2;border-radius:12px;padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(60,50,30,.05);}
  .o-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .o-table th{text-align:left;font-weight:600;color:var(--ink-soft);padding:11px 14px;border-bottom:1px solid var(--paper-line);font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:#FBF8EF;}
  .o-table td{padding:13px 14px;border-bottom:1px solid #F0EADB;}
  .o-table tbody tr:last-child td{border-bottom:none;}
  .o-row{cursor:pointer;}
  .o-row:hover{background:#FBF8EF;}
  .o-badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 11px;border-radius:20px;}
  .o-empty{text-align:center;color:var(--ink-soft);padding:34px 12px;}
  .o-field{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 5px;}
  .o-input{width:100%;padding:10px 12px;border:1px solid var(--paper-line);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;box-sizing:border-box;}
  .o-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:4px;}
  .o-stat{background:#FBF8EF;border-radius:10px;padding:14px 16px;}
  .o-stat .l{font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .o-stat .v{font-size:20px;font-weight:600;color:var(--tea-dark);}
  .o-pipe{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px;}
  .o-step{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;}
  .o-kv{width:100%;border-collapse:collapse;font-size:14px;}
  .o-kv td{padding:9px 2px;border-bottom:1px solid #F0EADB;vertical-align:top;}
  .o-kv tr:last-child td{border-bottom:none;}
  .o-kv td:first-child{color:var(--ink-soft);width:42%;}
  .o-kv td:last-child{text-align:right;font-weight:600;color:var(--tea-dark);}
  h2.sec{font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin:0 0 14px;color:var(--tea-dark);}
  h3.sub{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--tea-dark);display:flex;align-items:center;justify-content:space-between;gap:8px;}
  h4.buyerhead{font-family:'Fraunces',serif;font-size:16px;color:var(--tea-dark);margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card{background:#fff;border:1px solid #EAE3D2;border-radius:12px;padding:14px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(60,50,30,.05);}
  .order{border:1px solid var(--paper-line);border-radius:10px;padding:0;margin-bottom:16px;background:#fff;overflow:hidden;}
  .ordertop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:#F1ECDD;border-bottom:1px solid var(--paper-line);}
  .ordertop .invno{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;color:var(--tea-dark);}
  .docgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--paper-line);}
  @media(max-width:560px){.docgrid{grid-template-columns:1fr;}}
  .docbox{padding:12px 16px;}
  .docbox.dp{background:#FBF4E4;border-right:1px solid var(--paper-line);}
  .docbox.pel{background:#EEF4F0;}
  .docbox .chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:20px;margin-bottom:8px;}
  .docbox.dp .chip{background:#EAD9AE;color:var(--gold-deep);}
  .docbox.pel .chip{background:#CFE3D6;color:var(--green);}
  .docbox .row{font-size:12px;color:var(--ink-soft);margin:3px 0;}
  .docbox .row b{color:var(--ink);font-weight:500;font-family:'IBM Plex Mono',monospace;}
  .osection{padding:12px 16px;border-bottom:1px solid var(--paper-line);}
  .osection:last-child{border-bottom:none;}
  .osection.item{background:#FFFDF8;}
  .osection.pay{background:#FCFAF3;}
  .osection.piutang{background:#F7F3E8;}
  .osection .shead{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;display:flex;align-items:center;gap:8px;}
  .osection .shead::before{content:'';width:8px;height:8px;border-radius:2px;display:inline-block;}
  .osection.item .shead::before{background:var(--gold);}
  .osection.pay .shead::before{background:var(--tea-mid);}
  .osection.piutang .shead::before{background:var(--danger);}
  .piutang-big{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
  .piutang-big.zero{color:var(--green);}
  .piutang-big.due{color:var(--danger);}
  .tempo-note{font-size:12px;margin-top:4px;}
  .tempo-note.soon{color:var(--gold-deep);}
  .tempo-note.over{color:var(--danger);}
  .tempo-note.ok{color:var(--ink-soft);}
  /* document overlay */
  .overlay{position:fixed;inset:0;background:rgba(31,61,51,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;}
  .doc-wrap{background:#fff;max-width:760px;width:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .doc-bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-bottom:1px solid var(--paper-line);background:#F3EEE0;border-radius:10px 10px 0 0;}
  .doc-bar button{border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
  .doc-bar .print{background:var(--tea-dark);color:#F3EFE2;}
  .doc-bar .edit{background:var(--gold);color:#3A2A0F;}
  .doc-bar .close{background:#E5DCC8;color:var(--ink-soft);}
  #printArea{padding:34px 38px;color:#1c1c1c;font-family:'Inter',sans-serif;}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--tea-dark);padding-bottom:14px;margin-bottom:18px;}
  .doc-seller .nm{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--tea-dark);}
  .doc-seller .meta{font-size:11px;color:#555;line-height:1.5;margin-top:3px;white-space:pre-line;}
  .doc-title{text-align:right;}
  .doc-title .t{font-family:'Fraunces',serif;font-size:24px;font-weight:600;letter-spacing:.04em;color:var(--tea-dark);}
  .doc-title .sub{font-size:11px;color:#666;}
  .doc-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:16px;font-size:12px;}
  .doc-meta .block b{display:block;color:#888;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
  .doc-meta .block .v{white-space:pre-line;line-height:1.5;}
  table.doc-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;}
  table.doc-tbl th{background:#F1ECDD;color:#333;text-align:left;padding:8px;border:1px solid var(--paper-line);font-size:11px;}
  table.doc-tbl td{padding:8px;border:1px solid var(--paper-line);font-family:'IBM Plex Mono',monospace;}
  table.doc-tbl td.t{font-family:'Inter',sans-serif;}
  .doc-tot{width:280px;margin-left:auto;font-size:12px;}
  .doc-tot tr td{padding:5px 8px;font-family:'IBM Plex Mono',monospace;}
  .doc-tot tr.grand td{border-top:2px solid var(--tea-dark);font-weight:700;font-size:14px;}
  .doc-tot tr.due td{background:#FBF4E4;font-weight:700;color:var(--gold-deep);}
  .doc-note{margin-top:20px;font-size:11px;color:#555;border-top:1px dashed var(--paper-line);padding-top:12px;line-height:1.6;}
  .doc-sign{display:flex;justify-content:flex-end;margin-top:30px;font-size:12px;text-align:center;}
  .doc-sign .box{width:200px;}
  .doc-sign .line{margin-top:54px;border-top:1px solid #333;padding-top:4px;}
  .profedit{padding:16px 38px;border-top:1px solid var(--paper-line);background:#FCFAF3;}
  /* reference-style invoice document */
  #printArea{padding:0;}
  .inv{font-family:'Inter',Arial,sans-serif;color:#222;padding:36px 40px;font-size:12px;}
  .inv-head{display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .inv-brand{display:flex;align-items:center;gap:14px;}
  .inv-brand .txt .b{font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:.02em;color:#1f1f1f;line-height:1;}
  .inv-brand .txt .l{font-size:11px;font-weight:600;color:#C9A227;letter-spacing:.03em;margin-top:2px;}
  .inv-brand .txt .a{font-size:10.5px;color:#666;margin-top:3px;}
  .inv-web{font-size:11px;color:#333;text-decoration:underline;align-self:flex-end;}
  .inv-rule{height:4px;background:#E8B923;border-radius:2px;margin:10px 0 0;}
  .inv-title{text-align:center;font-family:'Fraunces',serif;font-size:30px;font-weight:600;letter-spacing:.06em;margin:24px 0 16px;color:#1f1f1f;}
  .inv-banner{background:#FBF1CE;color:#B8860B;text-align:center;font-weight:700;font-size:12px;letter-spacing:.05em;padding:7px;border-radius:2px;margin-bottom:16px;}
  .inv-info{display:flex;justify-content:space-between;gap:30px;margin-bottom:22px;}
  .inv-info .left{font-size:12px;}
  .inv-info .left .r{display:flex;margin:3px 0;}
  .inv-info .left .r .k{width:110px;font-weight:700;color:#333;}
  .inv-info .right{font-size:12px;max-width:280px;}
  .inv-info .right .k{font-weight:700;color:#333;margin-bottom:3px;}
  .inv-info .right .nm{font-weight:700;}
  .inv-info .right .ad{color:#444;line-height:1.5;white-space:pre-line;}
  /* border-collapse SEPARATE + border per-sel (right+bottom, kiri di kolom-1, atas di baris-1):
     collapse bikin garis vertikal HILANG saat cetak PDF di Chrome; separate mencetak andal. */
  table.inv-tbl{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:0;font-size:12px;}
  table.inv-tbl th{background:#EDEDED;border-right:1px solid #666;border-bottom:1px solid #666;padding:9px 8px;text-align:center;font-weight:700;color:#333;}

    @page{size:A4;margin:0;}

    #printArea, #printArea *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}

    body>.app, body>.login-overlay{display:none !important;}

// Parse 'YYYY-MM-DD' sebagai tanggal LOKAL (bukan UTC) → tidak ada geser 1 hari karena zona waktu.
function _pad2(n){ return String(n).padStart(2,'0'); }
function parseYMD(s){ if(!s) return null; const p=String(s).slice(0,10).split('-'); if(p.length<3) return null; const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); return isNaN(d)?null:d; }
function ymd(d){ return `${d.getFullYear()}-${_pad2(d.getMonth()+1)}-${_pad2(d.getDate())}`; }
function fmtLong(dateStr){ const d=parseYMD(dateStr); if(!d) return dateStr||'-'; return `${d.getDate()} ${EN_MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

function rp(n){ n=Number(n)||0; return 'Rp'+Math.round(n).toLocaleString('id-ID'); }
// sel uang untuk dokumen cetak: "Rp" rata kiri, angka rata kanan (digit sejajar)
function mcell(n){ return `<span class="m"><span>Rp</span><span class="n">${Math.round(Number(n)||0).toLocaleString('id-ID')}</span></span>`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function catLabel(id){ return (CATS.find(c=>c.id===id)||{}).label || '-'; }

function buyerName(id){ return (state.buyers.find(b=>b.id===id)||{}).name || '-'; }
function esc(s){ return (s==null?'':String(s)); }
function addDays(dateStr,days){ const d=parseYMD(dateStr); if(!d) return ''; d.setDate(d.getDate()+(Number(days)||0)); return ymd(d); }
function today(){ return ymd(new Date()); }
function daysUntil(dateStr){ const d=parseYMD(dateStr); if(!d) return null; const t=parseYMD(today()); return Math.round((d-t)/86400000); }
function genInvoice(dateStr){
  const seq = state.invSeq || 1077;
  const d = dateStr ? new Date(dateStr) : new Date();
  const yy = String(d.getFullYear()).slice(-2);
  const m = d.getMonth()+1;
  return `INV/${yy}${m}-${seq}/gtf`;
}
function genPI(dateStr){

}

async function safeGet(k){
  try{
    const { data, error } = await sb.from('kv_store').select('value').eq('key', k).maybeSingle();
    if(error) throw error;
    return data ? data.value : null;
  }catch(e){ console.error('Gagal memuat', k, e); return null; }
}
async function safeSet(k,v){
  const { error } = await sb.from('kv_store').upsert({ key:k, value:v, updated_at:new Date().toISOString() });
  if(error){ console.error('Gagal menyimpan', k, error); alert('Gagal menyimpan ke server: '+error.message); }
}

function blankOrder(){
  return {id:uid(), tglOrder:today(), tglKirim:'', noInvoice:'', noPI:'', noPO:'', dpPct:50, tempoHari:7, tempoDpHari:3, invoiceDate:'',
    ongkir:0, items:[], fpDp:{no:'',tgl:''}, fpPel:{no:'',tgl:''}, payments:[]};
}
function migrateSales(sd){
  if(!sd) return {orders:[]};
  if(Array.isArray(sd.orders)) return sd;
  // old shape {items, ongkir}
  if(Array.isArray(sd.items)){
    const o=blankOrder(); o.items=sd.items.map(i=>({id:i.id||uid(),desc:i.desc,qty:i.qty,unit:i.unit||'KG',harga:i.harga,ppn:i.ppn||11})); o.ongkir=sd.ongkir||0;
    return {orders:[o]};
  }
  return {orders:[]};
}

async function ensureMonth(mo){
  if(!state.cash[mo]) state.cash[mo]={};
  if(!state.sales[mo]) state.sales[mo]={};
  // muat data cash & sales tiap buyer secara PARALEL (jauh lebih cepat)
  await Promise.all((state.buyers||[]).map(async b=>{
    const need=[state.cash[mo][b.id]?null:safeGet('cash:'+mo+':'+b.id), state.sales[mo][b.id]?null:safeGet('sales:'+mo+':'+b.id)];
    const [c,s]=await Promise.all(need);
    if(!state.cash[mo][b.id]) state.cash[mo][b.id]=c||[];
    if(!state.sales[mo][b.id]) state.sales[mo][b.id]=migrateSales(s);
  }));
  if(!state.settings[mo]) state.settings[mo]=(await safeGet('settings:'+mo))||{investors:[],pettyCash:0};
}
async function ensureBuyerData(mo,id){
  if(!state.cash[mo]) state.cash[mo]={};
  if(!state.sales[mo]) state.sales[mo]={};
  if(!state.cash[mo][id]) state.cash[mo][id]=(await safeGet('cash:'+mo+':'+id))||[];
  if(!state.sales[mo][id]) state.sales[mo][id]=migrateSales(await safeGet('sales:'+mo+':'+id));
}

// ---- orders ----
function getOrders(mo,id){ return (state.sales[mo]?.[id]?.orders)||[]; }
function orderCalc(o){
  const items=o.items||[];
  const subtotalBarang=items.reduce((s,r)=>s+r.qty*r.harga,0);
  const ppn=items.reduce((s,r)=>s+(r.qty*r.harga*(r.ppn||0)/100),0);
  const ongkir=Number(o.ongkir||0);
  const tanpaPPN=subtotalBarang+ongkir;
  const totalTagihan=tanpaPPN+ppn;
  const dibayar=(o.payments||[]).reduce((s,p)=>s+Number(p.nominal||0),0);
  const sisa=totalTagihan-dibayar;
  const dpSeharusnya=totalTagihan*(Number(o.dpPct||0)/100);
  const jatuhTempo=addDays(o.tglKirim, o.tempoHari);
  let status = dibayar<=0 ? 'belum' : (sisa<=0.5 ? 'lunas' : 'dp');
  const daysLeft = daysUntil(jatuhTempo);
  const lewatTempo = status!=='lunas' && jatuhTempo && daysLeft!==null && daysLeft<0;
  return {subtotalBarang, ppn, ongkir, tanpaPPN, totalTagihan, dibayar, sisa, dpSeharusnya, jatuhTempo, status, lewatTempo, daysLeft};
}
function salesData(mo,id){
  const orders=getOrders(mo,id);
  let subtotal=0, ppn=0, total=0, dibayar=0, piutang=0;
  orders.forEach(o=>{ const c=orderCalc(o); subtotal+=c.tanpaPPN; ppn+=c.ppn; total+=c.totalTagihan; dibayar+=c.dibayar; piutang+=c.sisa; });
  return {subtotal, ppn, total, dibayar, piutang};
}
function totalPenjualanAll(mo){ return state.buyers.reduce((s,b)=>s+salesData(mo,b.id).total,0); }
function piutangAll(mo){ return state.buyers.reduce((s,b)=>s+salesData(mo,b.id).piutang,0); }

function orderPayRows(mo,id){
  const rows=[];
  getOrders(mo,id).forEach(o=>{
    (o.payments||[]).forEach(p=>{
      rows.push({id:p.id, date:p.tgl, desc:`${p.jenis} — Inv ${o.noInvoice||'(tanpa no)'}${p.noKwitansi?` · kwitansi ${p.noKwitansi}`:''}`,
        type:'masuk', amount:Number(p.nominal||0), source:'order'});
    });
  });
  return rows;
}
function cashDisplayRows(mo,id){
  const manual=(state.cash[mo]?.[id]||[]).map(r=>({...r, source:'manual'}));
  const all=[...manual, ...orderPayRows(mo,id)];
  all.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return all;
}
function buyerMasuk(mo,id){ return cashDisplayRows(mo,id).filter(r=>r.type==='masuk').reduce((s,r)=>s+r.amount,0); }
function buyerKeluar(mo,id){ return (state.cash[mo]?.[id]||[]).filter(r=>r.type==='keluar').reduce((s,r)=>s+r.amount,0); }
function buyerSaldo(mo,id){ return buyerMasuk(mo,id)-buyerKeluar(mo,id); }
function biayaByCat(mo,id,cat){ return (state.cash[mo]?.[id]||[]).filter(r=>r.type==='keluar'&&r.category===cat).reduce((s,r)=>s+r.amount,0); }
function totalBiayaBuyer(mo,id){ return buyerKeluar(mo,id); }
function totalBiayaAll(mo){ return state.buyers.reduce((s,b)=>s+totalBiayaBuyer(mo,b.id),0); }
function totalCapital(){ return state.capital.reduce((s,r)=>s+r.amount,0); }
function hppBuyer(mo,id){ return salesData(mo,id).subtotal - totalBiayaBuyer(mo,id); }
function hppAll(mo){ return state.buyers.reduce((s,b)=>s+hppBuyer(mo,b.id),0); }
function investorsTotal(mo){ return (state.settings[mo]?.investors||[]).reduce((s,i)=>s+Number(i.amount||0),0); }
function pettyCash(mo){ return Number(state.settings[mo]?.pettyCash||0); }
function nettProfit(mo){ return hppAll(mo)-investorsTotal(mo)-pettyCash(mo); }
function saldoBank(mo){ return state.buyers.reduce((s,b)=>s+buyerSaldo(mo,b.id),0); }

function renderTabs(){
  const t=document.getElementById('tabs');
  const activeParent=tabParent(activeTab);
  if(expandedNav===null) expandedNav=activeParent;
  let html='';
  for(const top of NAV){
    if(top.tab){
      const allowed=(top.roles||[]).includes(currentRole);
      const on=activeTab===top.tab;
      html+=`<div class="nav-item"><div class="nav-parent ${on?'cur':''} ${allowed?'':'locked'}" ${allowed?`data-tab="${top.tab}"`:'title="Terkunci untuk peran Anda"'}>${ic(top.icon,19)}<span>${top.label}</span>${allowed?'':ic('lock',15)}</div></div>`;
    } else {
      const kids=top.children||[];
      const anyAllowed=kids.some(c=>(c.roles||[]).includes(currentRole));
      const open=expandedNav===top.id;
      const hasActive=kids.some(k=>k.id===activeTab);
      html+=`<div class="nav-item ${open?'open':''}">
        <div class="nav-parent ${hasActive&&!open?'has-active':''} ${anyAllowed?'':'dim'}" data-group="${top.id}">${ic(top.icon,19)}<span>${top.label}</span>${ic('chevron',16)}</div>
        <div class="subwrap">${kids.map(k=>{
          const al=(k.roles||[]).includes(currentRole);
          return `<div class="sub ${k.id===activeTab?'active':''} ${al?'':'locked'}" ${al?`data-tab="${k.id}"`:'title="Terkunci untuk peran Anda"'}><span>${k.label}</span>${al?'':ic('lock',14)}</div>`;
        }).join('')}</div>
      </div>`;
    }
  }
  t.innerHTML=html;
  t.querySelectorAll('.nav-parent[data-group]').forEach(el=>el.onclick=()=>{ expandedNav=(expandedNav===el.dataset.group)?null:el.dataset.group; renderTabs(); });
  t.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>navTo(el.dataset.tab));
}

      PPN 11%: <b id="itemPPN" style="color:var(--ink)">${rp(t.ppn)}</b><br>
      <span style="font-size:14px;color:var(--ink)">Total: <b id="itemTotal">${rp(t.total)}</b></span>
    </div>`;
}
function collectItems(){
  const out=[];
  document.querySelectorAll('#itemRows .item-row').forEach(r=>{
    const nama=r.querySelector('.it-nama').value.trim();
    const qty=Number(r.querySelector('.it-qty').value)||0;
    const satuan=r.querySelector('.it-satuan').value;
    const harga=Number(r.querySelector('.it-harga').value)||0;
    const packEl=r.querySelector('.it-packaging');
    const pack=packEl?packEl.value.trim():'';
    if(nama||qty||harga||pack){ const rec={nama, qty, satuan, harga}; if(packEl) rec.packaging=pack; out.push(rec); }
  });
  return out;
}
function orderOngkirVal(){ const el=document.getElementById('oOngkir'); return el?(Number(el.value)||0):0; }
// Untuk form ORDER: gabungkan item + baris Ongkir (non-PPN) saat menyimpan.
function itemsWithOngkir(){ const items=collectItems(); const ong=orderOngkirVal(); if(ong>0) items.push({nama:'Ongkir', satuan:'ongkir', qty:1, harga:ong}); return items; }
function poVatOn(){ const el=document.getElementById('poVat'); return el?(el.dataset.on==='1'):null; } // null = form tanpa toggle
function vatToggleHTML(on){ const o=(on===false)?'0':'1'; return `<div style="margin-top:6px"><button type="button" class="o-btn ghost" id="poVat" data-on="${o}">PPN 11%: ${o==='1'?'Aktif':'Nonaktif'}</button> <span style="font-size:11px;color:var(--ink-soft);margin-left:8px">Klik untuk ubah (mis. supplier/buyer tanpa PPN).</span></div>`; }
function recalcItemTotal(){ const t=computeItemTotals(collectItems()); const ong=orderOngkirVal(); const ppnVal=(poVatOn()===false)?0:t.ppn; const a=document.getElementById('itemDPP'),b=document.getElementById('itemPPN'),c=document.getElementById('itemTotal'); if(a)a.textContent=rp(t.dpp); if(b)b.textContent=rp(ppnVal); if(c)c.textContent=rp(t.dpp+ppnVal+ong); }
function bindItemRowEvents(){
  document.querySelectorAll('#itemRows .item-row').forEach(r=>{
    const d=r.querySelector('.it-del'); if(d) d.onclick=()=>{ r.remove(); recalcItemTotal(); };
    const q=r.querySelector('.it-qty'); if(q) q.oninput=recalcItemTotal;
    const h=r.querySelector('.it-harga'); if(h) h.oninput=recalcItemTotal;
  });
}
function bindItemEditor(){
  const cont=document.getElementById('itemRows'); if(!cont) return;
  const withPack=cont.dataset.pack==='1';
  const add=document.getElementById('itemAdd');
  if(add) add.onclick=()=>{ cont.insertAdjacentHTML('beforeend', itemRowHTML({}, withPack)); bindItemRowEvents(); };
  const ong=document.getElementById('oOngkir'); if(ong) ong.oninput=recalcItemTotal;
  const vat=document.getElementById('poVat'); if(vat) vat.onclick=()=>{ vat.dataset.on = vat.dataset.on==='1'?'0':'1'; vat.textContent='PPN 11%: '+(vat.dataset.on==='1'?'Aktif':'Nonaktif'); recalcItemTotal(); };
  bindItemRowEvents();
}
function itemsDisplayCard(title, items){
  items=items||[];
  if(!items.length) return '';
  const t=computeItemTotals(items);
  const rows=items.filter(it=>!isOngkir(it)).map(it=>`<tr><td>${esc(it.nama||'-')}</td><td style="text-align:right">${esc(String(it.qty||''))} ${esc(it.satuan||'')}</td><td style="text-align:right">${rp(it.harga)}</td><td style="text-align:right">${rp((Number(it.qty)||0)*(Number(it.harga)||0))}</td></tr>`).join('');
  const foot=`<tr><td colspan="3" style="text-align:right;color:var(--ink-soft)">Subtotal</td><td style="text-align:right">${rp(t.dpp)}</td></tr>
    <tr><td colspan="3" style="text-align:right;color:var(--ink-soft)">PPN 11%</td><td style="text-align:right">${rp(t.ppn)}</td></tr>
    ${t.ongkir?`<tr><td colspan="3" style="text-align:right;color:var(--ink-soft)">Ongkir</td><td style="text-align:right">${rp(t.ongkir)}</td></tr>`:''}
    <tr><td colspan="3" style="text-align:right;font-weight:600">Total</td><td style="text-align:right;font-weight:600">${rp(t.total)}</td></tr>`;
  return `<div class="o-card"><p style="margin:0 0 8px;font-weight:600;color:var(--ink)">${title}</p>
    <table class="o-table" style="font-size:13px"><thead><tr><th>Jenis teh</th><th style="text-align:right">Qty</th><th style="text-align:right">Harga/sat</th><th style="text-align:right">Subtotal</th></tr></thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;
}

async function loadOrders(){
  orderLoading=true;
  const { data:bs } = await sb.from('buyers').select('id,nama').order('nama');
  buyersCache = bs||[];
  let { data:os, error } = await sb.from('orders')
    .select('id,no_order,status,nilai_jual,nilai_sample,total_bayar_buyer,tanggal_order,tanggal_serah_terima,buyer_id,catatan,items,items_sample,po_masuk_no,pakai_ppn')
    .order('created_at',{ascending:false});
  if(error){ // fallback bila kolom tanggal_serah_terima / pakai_ppn belum ada (SQL belum dijalankan)
    const r=await sb.from('orders').select('id,no_order,status,nilai_jual,nilai_sample,total_bayar_buyer,tanggal_order,buyer_id,catatan,items,items_sample,po_masuk_no').order('created_at',{ascending:false});
    os=r.data; if(r.error) console.error('load orders', r.error);
  }
  const bmap={}; buyersCache.forEach(b=>bmap[b.id]=b.nama);
  ordersCache=(os||[]).map(o=>({...o, buyer_name:bmap[o.buyer_id]||'—'}));
  orderLoading=false;
  render();
}
async function loadOrderSummary(id){
  const { data } = await sb.from('v_order_summary').select('*').eq('id',id).maybeSingle();
  if(data){ orderSummary[id]=data; render(); }
}

async function deleteBuyer(id){
  const b=(buyersCache||[]).find(x=>x.id===id);
  if(!confirm(`Hapus buyer "${b?b.nama:''}"? Tidak bisa dibatalkan.`)) return;
  const { error }=await sb.from('buyers').delete().eq('id',id);
  if(error){ alert('Gagal hapus: '+error.message+'\n(Buyer mungkin masih dipakai order/pengiriman/piutang.)'); return; }
  buyersCache=null; ordersCache=null; render();
}

function viewOrderCard(){
  const o=ordersCache.find(x=>x.id===openOrderId);
  if(!o) return viewOrderList();
  const idx=statusIndex(o.status);
  const piut=(Number(o.nilai_jual)||0)-(Number(o.total_bayar_buyer)||0);
  const pipe=ORDER_STATUSES.map((st,i)=>{
    let bg='#F0EADB',fg='#9A8F76';
    if(i<idx){bg='#E4F0E8';fg='#1D6B4F';}
    else if(i===idx){bg='#FBF1D8';fg='#8A5B0E';}
    return `<span class="o-step" style="background:${bg};color:${fg}">${st[1]}</span>`;
  }).join('');
  const stOpts=ORDER_STATUSES.concat([['batal','Batal']]).map(s=>`<option value="${s[0]}" ${s[0]===o.status?'selected':''}>${s[1]}</option>`).join('');
  let costCards='', talNote='';
  if(canSeeCost()){
    const loaded=!!orderSummary[o.id];
    if(!loaded) loadOrderSummary(o.id);
    const sum=orderSummary[o.id]||{};
    const hpp=Number(sum.hpp)||0, kas=Number(sum.kas_keluar)||0, tal=Number(sum.talangan_modal)||0;
    const laba=Number(sum.laba!=null?sum.laba:((Number(o.nilai_jual)||0)-hpp))||0;
    const v=x=>loaded?rp(x):'…';
    costCards=`
      <tr><td>Kas keluar (HPP)</td><td>${v(kas)}</td></tr>
      <tr><td>Talangan modal</td><td style="${loaded&&tal>0?'color:#8A5B0E':''}">${v(tal)}</td></tr>
      <tr><td>Laba order</td><td style="color:#1D6B4F">${v(laba)}</td></tr>`;
    if(loaded && tal>0) talNote=`<div class="o-card" style="background:#FBF1D8;border-color:#EBD9A6"><p style="margin:0;color:#8A5B0E;font-size:13px">⚠ Order ini ditalangi modal ${rp(tal)} — kembali saat pelunasan, bukan biaya.</p></div>`;
  }
  const bayar=Number(o.total_bayar_buyer)||0, nilai=Number(o.nilai_jual)||0;
  const statusBayar = bayar<=0 ? 'Belum ada pembayaran' : (nilai>0&&bayar>=nilai ? 'Lunas' : `DP masuk · sisa ${rp(nilai-bayar)}`);
  const isPO = o.status!=='sample' && o.status!=='batal';
  return `<div class="o-wrap">
    <div class="o-head">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="o-btn ghost" id="oBack">← Daftar</button>
        <button class="o-btn ghost" id="oEdit">Edit</button>
        <button class="o-btn ghost" id="oDel" style="color:var(--danger);border-color:#E3B9B3">Hapus</button>
      </div>
      <div><label style="font-size:12px;color:var(--ink-soft);margin-right:6px">Status</label>
      <select class="o-input" id="oStatus" style="width:auto;display:inline-block">${stOpts}</select></div>
    </div>
    <div class="o-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px">
        <h2 class="o-title" style="margin:0">${o.no_order} · ${o.buyer_name}</h2>${statusBadge(o.status)}
      </div>
      <p style="margin:0 0 14px;color:var(--ink-soft);font-size:12.5px">Tanggal order ${fmtLong(o.tanggal_order)}${o.tanggal_serah_terima?` · Serah terima: <b style="color:var(--tea-dark)">${fmtLong(o.tanggal_serah_terima)}</b>`:''}${(isPO&&o.po_masuk_no)?` · <b style="color:var(--tea-dark)">PO buyer: ${esc(o.po_masuk_no)}</b>`:''}${o.catatan?(' · '+esc(o.catatan)):''}</p>
      <div class="o-pipe">${pipe}</div>
      <table class="o-kv">
        ${(Number(o.nilai_sample)>0||o.status==='sample')?`<tr><td>Nilai sample</td><td>${rp(o.nilai_sample)}</td></tr>`:''}
        ${isPO?`<tr><td>Nilai jual (PO)</td><td>${rp(o.nilai_jual)}</td></tr>`:''}
        <tr><td>Status bayar</td><td style="color:${nilai>0&&bayar>=nilai?'#1D6B4F':(bayar>0?'#8A5B0E':'var(--ink-soft)')}">${statusBayar}</td></tr>
        ${costCards}
      </table>
      <p style="margin:10px 0 0;color:var(--ink-soft);font-size:12px">Pembayaran buyer (DP &amp; pelunasan) dicatat di menu <b>Penjualan</b> (bagian keuangan). Order ini untuk data operasional &amp; PO.</p>
    </div>
    ${itemsDisplayCard('Item order', o.items)}
    ${(o.items_sample&&o.items_sample.length)?itemsDisplayCard('Histori item (dari sample)', o.items_sample):''}
    ${sampleViewRO(o)}
    ${talNote}
    ${poSection(o)}
  </div>`;
}

function bindOrderModule(){
  if(orderView==='list'){
    const nb=document.getElementById('oNew'); if(nb) nb.onclick=()=>{ orderView='new'; render(); };
    const tg=document.getElementById('oToggleDone'); if(tg) tg.onclick=()=>{ hideDone=!hideDone; render(); };
    const mb=document.getElementById('oManageBuyer'); if(mb) mb.onclick=()=>{ orderView='buyers'; render(); };
    document.querySelectorAll('.o-row').forEach(r=>r.onclick=()=>{ openOrderId=r.dataset.open; orderView='card'; sampleFormOpen=false; poFormOpen=false; buyerPayFormOpen=false; render(); });
  } else if(orderView==='buyers'){
    const bk=document.getElementById('bmBack'); if(bk) bk.onclick=()=>{ orderView='list'; render(); };
    document.querySelectorAll('[data-delbuyer]').forEach(el=>el.onclick=()=>deleteBuyer(el.dataset.delbuyer));
  } else if(orderView==='new'){
    const bsel=document.getElementById('oBuyer');
    if(bsel) bsel.onchange=()=>{ const w=document.getElementById('oBuyerNewWrap'); if(w) w.style.display = bsel.value==='__new'?'block':'none'; };

    if(fs) fs.onchange=()=>{
      const o=(ordersCache||[]).find(x=>x.id===fs.value);
      const buyerEl=document.getElementById('oBuyer'), noEl=document.getElementById('oNo'),
            nsEl=document.getElementById('oNilaiSample'), stEl=document.getElementById('oStatus0'),
            nwEl=document.getElementById('oBuyerNewWrap'), cont=document.getElementById('itemRows');
      if(o){
        if(buyerEl){ buyerEl.value=o.buyer_id; buyerEl.disabled=true; }
        if(nwEl) nwEl.style.display='none';
        if(noEl){ noEl.value=o.no_order; noEl.readOnly=true; }
        if(nsEl){ nsEl.value=Number(o.nilai_sample)||0; nsEl.readOnly=true; }
        if(stEl){ stEl.value='po'; stEl.disabled=true; }
        if(cont){ cont.innerHTML=((o.items&&o.items.length)?o.items:[{}]).map(it=>itemRowHTML(it)).join(''); bindItemEditor(); recalcItemTotal(); }
      } else {
        if(buyerEl){ buyerEl.disabled=false; buyerEl.value=''; }
        if(noEl){ noEl.readOnly=false; }
        if(nsEl){ nsEl.readOnly=false; nsEl.value=''; }
        if(stEl){ stEl.disabled=false; stEl.value='sample'; }
      }
    };
    const sv=document.getElementById('oSave'); if(sv) sv.onclick=saveNewOrder;
    const cx=document.getElementById('oCancel'); if(cx) cx.onclick=()=>{ orderView='list'; render(); };
  } else if(orderView==='edit'){
    const bsel=document.getElementById('oBuyer');

async function resolveBuyerId(name){
  const found=buyersCache.find(b=>(b.nama||'').toLowerCase()===name.toLowerCase());
  if(found) return { id:found.id };
  const { data:nb, error }=await sb.from('buyers').insert({nama:name}).select('id,nama').single();
  if(error) return { error:error.message };
  buyersCache.push(nb);
  return { id:nb.id };
}
// Tulis order; kalau kolom tanggal_serah_terima belum ada di DB, ulangi tanpa kolom itu (aman).
async function orderWrite(payload, id){
  let res = id ? await sb.from('orders').update(payload).eq('id',id) : await sb.from('orders').insert(payload);
  if(res.error && /tanggal_serah_terima/i.test(res.error.message||'')){
    const rest={...payload}; delete rest.tanggal_serah_terima;
    res = id ? await sb.from('orders').update(rest).eq('id',id) : await sb.from('orders').insert(rest);
  }
  return res;
}
async function saveNewOrder(){
  const err=document.getElementById('oErr'); err.textContent='';
  const bsel=document.getElementById('oBuyer').value;
  const bnewEl=document.getElementById('oBuyerNew');
  const bnew=bnewEl?bnewEl.value.trim():'';
  const no=document.getElementById('oNo').value.trim();
  const items=itemsWithOngkir();
  const vatOn=poVatOn()!==false;
  const _t=computeItemTotals(items);
  const nilai=items.length ? (vatOn?_t.total:_t.dpp+_t.ongkir) : (Number(document.getElementById('oNilai').value)||0);
  const nilaiSample=Number((document.getElementById('oNilaiSample')||{}).value)||0;
  const tgl=document.getElementById('oTgl').value||today();
  const cat=document.getElementById('oCatatan').value.trim();
  const status=(document.getElementById('oStatus0')||{}).value||'sample';
  const poMasuk=(document.getElementById('oPoMasuk')?document.getElementById('oPoMasuk').value.trim():'')||null;
  if(!no){ err.textContent='No order wajib diisi.'; return; }
  const btn=document.getElementById('oSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const reset=()=>{ btn.disabled=false; btn.textContent='Simpan order'; };
  // Lanjutan dari sample → ubah order sample yang sama jadi PO (histori & nilai sample tetap)
  const fromSampleId=(document.getElementById('oFromSample')||{}).value||'';
  if(fromSampleId){
    // simpan item tahap sample sebagai histori sebelum item ditimpa item PO
    const sampleOrder=(ordersCache||[]).find(x=>x.id===fromSampleId);
    const items_sample=(sampleOrder&&Array.isArray(sampleOrder.items)&&sampleOrder.items.length)?sampleOrder.items:(sampleOrder?sampleOrder.items_sample:null)||[];
    const { error }=await sb.from('orders').update({ status:'po', nilai_jual:nilai, po_masuk_no:poMasuk, items, items_sample, catatan:cat, pakai_ppn:vatOn }).eq('id',fromSampleId);
    if(error){ err.textContent='Gagal simpan: '+error.message; reset(); return; }
    delete orderSummary[fromSampleId]; ordersCache=null; orderView='list'; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; sampleDocIds=null; render();
    return;
  }
  let buyer_id=null;
  if(bsel==='__new'){
    if(!bnew){ err.textContent='Isi nama buyer baru.'; reset(); return; }
    const r=await resolveBuyerId(bnew); if(r.error){ err.textContent='Gagal simpan buyer: '+r.error; reset(); return; } buyer_id=r.id;
  } else if(bsel.indexOf('name::')===0){
    const nm=decodeURIComponent(bsel.slice(6));
    const r=await resolveBuyerId(nm); if(r.error){ err.textContent='Gagal simpan buyer: '+r.error; reset(); return; } buyer_id=r.id;
  } else if(bsel){ buyer_id=bsel; }
  else { err.textContent='Pilih buyer dulu.'; reset(); return; }
  const serah=(document.getElementById('oSerah')||{}).value||null;
  const { error }=await orderWrite({
    no_order:no, buyer_id, nilai_jual:nilai, nilai_sample:nilaiSample, tanggal_order:tgl, tanggal_serah_terima:serah, catatan:cat,
    items, status, po_masuk_no:poMasuk, pic_sales:currentUserId, pakai_ppn:vatOn
  });
  if(error){ err.textContent='Gagal simpan order: '+error.message; reset(); return; }
  ordersCache=null; orderView='list'; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; render();
}

function docNoSuggest(jenis, docs){
  const now=new Date(); const yy=String(now.getFullYear()).slice(-2); const m=now.getMonth()+1;
  const seq=String((docs||[]).filter(d=>d.jenis===jenis).length+1).padStart(3,'0');
  if(jenis==='pi_sample') return `PI-S/${yy}${m}-${seq}`;
  if(jenis==='pi_dp') return `PI/${yy}${m}-${seq}`;
  if(jenis==='invoice') return `INV/${yy}${m}-${seq}`;
  return '';
}
function defaultDocJenis(o, docs){

    const _txIds=bagiHasilCache.map(x=>x.transaction_id).filter(Boolean);
    if(_txIds.length){ const { data:_txs }=await sb.from('transactions').select('id,tanggal').in('id',_txIds); const _tm={}; (_txs||[]).forEach(t=>_tm[t.id]=t.tanggal); bagiHasilCache.forEach(x=>{ if(x.transaction_id) x.bayar_tanggal=_tm[x.transaction_id]; }); }
  }catch(e){ investorsCache=investorsCache||[]; modalSetoranCache=modalSetoranCache||[]; bagiHasilCache=bagiHasilCache||[]; }
  // orders + laba per order (untuk form Catat bagi hasil)

      ordersCache=(os||[]).map(o=>({...o, buyer_name:bmap[o.buyer_id]||'—'}));
    }

// Laba NETTO per order untuk usulan bagi hasil — dihitung SAMA PERSIS dgn menu HPP:
//   laba = (nilai jual − PPN keluaran) − ( (raw material − PPN masukan) + OPS pemenuhan PO )
// PPN masukan = kredit (billInputVat), OPS PO = biaya_usaha berkategori HPP yang ditandai order.
async function loadOrderLabaNetto(){
  try{
    const [vsR, billsR, txR, ordR] = await Promise.all([
      sb.from('v_order_summary').select('id,nilai_jual,hpp'),
      sb.from('supplier_bills').select('order_id,jenis,pakai_ppn,nilai,items'),
      sb.from('transactions').select('order_id,arah,jenis,kategori,jumlah'),
      sb.from('orders').select('id,items')
    ]);
    const ongkirM={}; (ordR.data||[]).forEach(o=>{ ongkirM[o.id]=ongkirTotal(o.items); });
    const inVat={}; (billsR.data||[]).forEach(b=>{ if(b.order_id) inVat[b.order_id]=(inVat[b.order_id]||0)+billInputVat(b); });
    const ops={}; (txR.data||[]).forEach(t=>{ if(t.arah==='keluar'&&t.jenis==='biaya_usaha'&&t.order_id&&HPP_KATEGORI.includes(t.kategori)) ops[t.order_id]=(ops[t.order_id]||0)+(Number(t.jumlah)||0); });
    const m={}; (vsR.data||[]).forEach(o=>{ const njNetto=njNettoCalc(o.nilai_jual, ongkirM[o.id]); const rawNetto=(Number(o.hpp)||0)-(inVat[o.id]||0); m[o.id]=njNetto-(rawNetto+(ops[o.id]||0)); });
    orderLabaCache=m;
  }catch(e){ orderLabaCache=orderLabaCache||{}; }
}

  if(modalForm==='investor') return viewInvestorForm();
  if(modalForm==='bagi') return viewBagiForm();
  const canWr=canSeeCost();
  const delBtn=(attr,id)=>canWr?`<td style="text-align:right"><button class="o-btn ghost" data-${attr}="${id}" style="padding:4px 9px;color:var(--danger);border-color:#E3B9B3">Hapus</button></td>`:'';
  const actBtns=(editAttr,delAttr,id)=>canWr?`<td style="text-align:right;white-space:nowrap"><button class="o-btn ghost" data-${editAttr}="${id}" style="padding:4px 9px">Edit</button> <button class="o-btn ghost" data-${delAttr}="${id}" style="padding:4px 9px;color:var(--danger);border-color:#E3B9B3">Hapus</button></td>`:'';

  const inv=investorsCache, setoran=modalSetoranCache, bh=bagiHasilCache;
  const totalSetoran=setoran.reduce((s,x)=>s+(Number(x.jumlah)||0),0); // bersih (setor − tarik)
  const totalSetor=setoran.reduce((s,x)=>s+Math.max(0,Number(x.jumlah)||0),0);
  const totalTarik=setoran.reduce((s,x)=>s+Math.max(0,-(Number(x.jumlah)||0)),0);

        <thead><tr><th>Investor</th><th>Tanggal masuk</th><th>Order/PO</th><th>Dasar</th><th style="text-align:right">Jumlah</th><th>Status</th>${canWr?'<th>Tandai bayar</th>':''}<th>Keterangan</th>${delHead}</tr></thead>

async function saveSetoran(){

  const inv=(investorsCache||[]).find(x=>x.id===iid);

  const payload={ investor_id:iid, nama:inv?inv.nama:null, tanggal:tgl, jumlah:jumlahSigned, catatan:cat };
  const { error }= editSetoranId
    ? await sb.from('modal_setoran').update(payload).eq('id',editSetoranId)
    : await sb.from('modal_setoran').insert(payload);
  if(error){ if(err) err.textContent='Gagal simpan: '+error.message; btn.disabled=false; btn.textContent='Simpan setoran'; return; }
  investorsCache=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; ledgerCache=null; modalForm=null; editSetoranId=null; render();

function bagiRecalc(){
  const isel=document.getElementById('bgInvestor'); const osel=document.getElementById('bgOrder');

  const ono=(osel&&osel.selectedIndex>0)?osel.options[osel.selectedIndex].dataset.no:'';
  if(laba==null){ if(info) info.textContent=''; return; }
  if(!isNaN(persen)){
    const sug=Math.round(persen/100*laba);
    if(info) info.textContent=`Laba order ini: ${rp(laba)} · usulan ${persen}% = ${rp(sug)}`;
    if(jEl && (!jEl.value || jEl.dataset.auto==='1')){ jEl.value=sug; jEl.dataset.auto='1'; }
    if(dEl && !dEl.value && ono) dEl.value=`${persen}% laba ${ono}`;
  } else {
    if(info) info.textContent=`Laba order ini: ${rp(laba)}`;
  }
}

async function bayarBagi(id){
  const b=(bagiHasilCache||[]).find(x=>x.id===id); if(!b) return;
  if(b.transaction_id){ alert('Bagi hasil ini sudah ditandai dibayar.'); return; }
  const nm=b.investor_nama||invName(b.investor_id);
  const tgl=prompt(`Tanggal bayar bagi hasil ${nm} (${rp(b.jumlah)}):`, today());
  if(!tgl) return;
  const { data:tx, error:te }=await sb.from('transactions').insert({ tanggal:tgl, arah:'keluar', jenis:'lain', jumlah:Number(b.jumlah)||0, kategori:'Bagi hasil investor', catatan:'Bagi hasil '+nm+(b.order_no?(' — '+b.order_no):''), order_id:b.order_id||null }).select('id').single();
  if(te){ alert('Gagal catat kas keluar: '+te.message); return; }
  const { error:ue }=await sb.from('bagi_hasil').update({ transaction_id:tx.id }).eq('id',id);
  if(ue){
    if(/transaction_id/i.test(ue.message||'')){ await sb.from('transactions').delete().eq('id',tx.id);
      alert('Jalankan dulu SQL [19] (kolom bagi_hasil.transaction_id) di Supabase, lalu coba lagi. Belum ada yang berubah.'); return; }
    alert('Gagal: '+ue.message); return;
  }
  investorsCache=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; ledgerCache=null; render();

async function saveAset(){
  const err=document.getElementById('asErr'); if(err) err.textContent='';
  const nama=document.getElementById('asNama').value.trim();
  const tgl=document.getElementById('asTgl').value||null;
  const nilai=Number(document.getElementById('asNilai').value)||0;
  const cat=document.getElementById('asCatatan').value.trim();
  if(!nama){ if(err) err.textContent='Isi nama aset.'; return; }
  if(nilai<=0){ if(err) err.textContent='Nilai harus lebih dari 0.'; return; }
  const btn=document.getElementById('asSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  let error;
  if(editAsetId){
    const existing=(asetCache||[]).find(a=>a.id===editAsetId);
    if(existing && existing.transaction_id){ try{ await sb.from('transactions').update({ tanggal:tgl||today(), jumlah:nilai, catatan:'Aset: '+nama }).eq('id',existing.transaction_id); }catch(e){} }
    ({ error }=await sb.from('aset_tetap').update({ nama, tanggal:tgl, nilai, catatan:cat }).eq('id',editAsetId));
  } else {
    // Pembelian aset = uang keluar → catat ke Arus Kas (mengurangi saldo bank)
    let txId=null;
    try{ const { data:tx }=await sb.from('transactions').insert({ tanggal:tgl||today(), arah:'keluar', jenis:'lain', jumlah:nilai, kategori:'Aset', catatan:'Aset: '+nama }).select('id').single(); txId=tx?tx.id:null; }catch(e){}
    const payload={ nama, tanggal:tgl, nilai, catatan:cat, transaction_id:txId };
    let res=await sb.from('aset_tetap').insert(payload);
    if(res.error && /transaction_id/i.test(res.error.message||'')){ const rest={...payload}; delete rest.transaction_id; res=await sb.from('aset_tetap').insert(rest); }
    error=res.error;
  }
  if(error){ if(err) err.textContent='Gagal simpan: '+error.message; btn.disabled=false; btn.textContent='Simpan aset'; return; }
  asetCache=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; ledgerCache=null; asetForm=false; editAsetId=null; render();

// Masukkan aset lama (yang belum punya transaksi) ke Arus Kas sebagai uang keluar, sudah terbayar.
async function backfillAsetToKas(){
  const list=(asetCache||[]).filter(x=>!x.transaction_id);
  if(!list.length){ alert('Semua aset sudah masuk Arus Kas.'); return; }
  if(!confirm(`Masukkan ${list.length} aset ke Arus Kas sebagai uang keluar (kategori "Aset", sudah terbayar)? Saldo bank akan berkurang sesuai nilai aset.`)) return;
  const btn=document.getElementById('asBackfill'); if(btn){ btn.disabled=true; btn.textContent='Memproses…'; }
  let ok=0, fail=0;
  for(const a of list){
    const { data:tx, error:te }=await sb.from('transactions').insert({ tanggal:a.tanggal||today(), arah:'keluar', jenis:'lain', jumlah:Number(a.nilai)||0, kategori:'Aset', catatan:'Aset: '+a.nama }).select('id').single();
    if(te){ fail++; continue; }
    const { error:ue }=await sb.from('aset_tetap').update({ transaction_id:tx.id }).eq('id',a.id);
    if(ue){
      if(/transaction_id/i.test(ue.message||'')){ await sb.from('transactions').delete().eq('id',tx.id);
        alert('Jalankan dulu SQL [18] (kolom transaction_id) di Supabase, lalu klik lagi. Belum ada yang diubah.'); asetCache=null; ledgerCache=null; render(); return; }
      fail++;
    } else ok++;
  }
  asetCache=null; ledgerCache=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null;
  alert(`Selesai. ${ok} aset masuk ke Arus Kas${fail?`, ${fail} gagal`:''}.`);
  render();
}

// ===== Keuangan berbasis order/transactions: Arus Kas, Biaya Usaha, HPP, Penjualan =====
const TX_JENIS_LABEL={dp:'DP buyer',pelunasan:'Pelunasan buyer',hpp:'HPP',biaya_usaha:'Biaya usaha',modal:'Setoran modal',bayar_hutang:'Bayar supplier',lain:'Lainnya'};
// Keterangan lengkap 1 baris kas: jenis · (buyer utk uang masuk) · kategori · catatan
function txKet(t){
  const label=TX_JENIS_LABEL[t.jenis]||t.jenis;
  const parts=[label];
  if(t.arah==='masuk' && t.buyer_name) parts.push(t.buyer_name);
  // invoice/PI dari dokumen order (kalau catatan belum memuat "Inv")
  if((t.jenis==='dp'||t.jenis==='pelunasan') && t.invNo && !/inv[ :]/i.test(t.catatan||'')) parts.push('Inv '+t.invNo);
  if(t.kategori && t.kategori!==label && t.kategori!=='Penjualan') parts.push(t.kategori);
  if(t.catatan) parts.push(t.catatan);
  return parts.join(' · ');
}
let ledgerCache=null; let kasForm=false; let hppCache=null;
let kasEditId=null; let kasOrderFilter='all';
function setKasOrder(v){ kasOrderFilter=v; render(); }
// Cache bersama data berat (dipakai ulang antar tab Ringkasan/HPP/Penjualan/Laporan/Arus kas)
let vsData=null, txData=null, vsPromise=null, txPromise=null;
// Dedup fetch: kalau beberapa view minta data yang sama BERSAMAAN, cukup 1 query (simpan promise-nya).
async function getVS(){
  if(vsData) return vsData;
  if(!vsPromise) vsPromise=(async()=>{ try{ const { data }=await sb.from('v_order_summary').select('id,no_order,status,nilai_jual,hpp,laba,piutang,masuk_buyer'); vsData=data||[]; }catch(e){ vsData=vsData||[]; } vsPromise=null; return vsData; })();
  return vsPromise;
}
async function getTX(){
  if(txData) return txData;
  if(!txPromise) txPromise=(async()=>{ try{
    let { data,error }=await sb.from('transactions').select('id,tanggal,arah,jenis,jumlah,kategori,catatan,order_id,orders(no_order,buyers(nama))').order('tanggal');
    if(error){ const r=await sb.from('transactions').select('id,tanggal,arah,jenis,jumlah,kategori,catatan,order_id,orders(no_order)').order('tanggal'); data=r.data; }
    // Nomor PI/Invoice per order (dari order_docs) untuk melengkapi keterangan DP/pelunasan yang ber-order
    const docMap={}; try{ const { data:docs }=await sb.from('order_docs').select('order_id,jenis,nomor');
      const rank=j=>j==='invoice'?3:(j==='pi_dp'?2:1);
      (docs||[]).forEach(d=>{ if(!d.order_id||!d.nomor) return; const cur=docMap[d.order_id]; if(!cur||rank(d.jenis)>rank(cur.jenis)) docMap[d.order_id]={jenis:d.jenis,nomor:d.nomor}; });
    }catch(e){}
    txData=(data||[]).map(t=>({...t, buyer_name:(t.orders&&t.orders.buyers)?t.orders.buyers.nama:null, invNo:(t.order_id&&docMap[t.order_id])?docMap[t.order_id].nomor:null }));
  }catch(e){ txData=txData||[]; } txPromise=null; return txData; })();
  return txPromise;
}
async function loadLedger(){
  try{
    const data=await getTX();
    const rows=(data||[]).map(t=>({...t, order_no:t.orders?t.orders.no_order:null}));
    // Setoran modal (owner + investor) dari menu Modal → tampil sebagai UANG MASUK di Arus Kas,
    // sehingga saldo awal dimulai dari modal. (Sumber tunggal: tabel modal_setoran; tak bisa diedit dari sini.)
    try{
      const { data:ms }=await sb.from('modal_setoran').select('id,tanggal,jumlah,nama,catatan');
      (ms||[]).forEach(m=>{ const neg=Number(m.jumlah)<0; rows.push({ id:'modal_'+m.id, tanggal:m.tanggal, arah:neg?'keluar':'masuk', jenis:'modal', jumlah:Math.abs(Number(m.jumlah)||0),
        kategori:neg?'Penarikan modal':'Setoran modal', catatan:(neg?('Tarik modal '+(m.nama||'')):(m.nama?('Modal '+m.nama):'Setoran modal'))+(m.catatan?(' · '+m.catatan):''),
        order_id:null, order_no:null, _ro:true }); });
    }catch(e){}
    ledgerCache=rows;
  }catch(e){ ledgerCache=ledgerCache||[]; }
  render();
}
async function loadHpp(){
  try{
    const [vs,ors,pos]=await Promise.all([
      getVS(),
      sb.from('orders').select('id,tanggal_order,items'),
      sb.from('purchase_orders').select('order_id,jatuh_tempo,deadline_kirim')
    ]);
    const omap={}; (ors.data||[]).forEach(o=>omap[o.id]=o);
    const pmap={}; (pos.data||[]).forEach(p=>{ if(!p.order_id) return; const e=pmap[p.order_id]||(pmap[p.order_id]={});
      if(p.jatuh_tempo && (!e.jatuh_tempo||p.jatuh_tempo<e.jatuh_tempo)) e.jatuh_tempo=p.jatuh_tempo;
      if(p.deadline_kirim && (!e.deadline_kirim||p.deadline_kirim<e.deadline_kirim)) e.deadline_kirim=p.deadline_kirim; });
    hppCache=(vs||[]).filter(o=>o.status!=='batal').map(o=>({ ...o,
      tglOrder:(omap[o.id]||{}).tanggal_order||null,
      ongkir:ongkirTotal((omap[o.id]||{}).items),
      jatuhTempo:(pmap[o.id]||{}).jatuh_tempo||null,
      deadlineKirim:(pmap[o.id]||{}).deadline_kirim||null }));
  }catch(e){ hppCache=hppCache||[]; }
  render();
}
// ---- Arus Kas (buku kas dari transactions, dengan saldo berjalan) ----
function viewKasModule(){
  if(ledgerCache===null){ loadLedger(); return `<div class="o-wrap"><div class="o-card">Memuat…</div></div>`; }
  if(kasForm) return viewKasForm();
  const canWr=canSeeCost();
  const ym = finMonth==='all'?null:finMonth;
  const byOrder = kasOrderFilter!=='all';

  const all=ledgerCache.slice().sort((a,b)=> String(a.tanggal||'').localeCompare(String(b.tanggal||'')) || String(a.id).localeCompare(String(b.id)));
  let run=0; const saldoById={};
  all.forEach(t=>{ run+=(t.arah==='masuk'?1:-1)*(Number(t.jumlah)||0); saldoById[t.id]=run; });
  const saldoKasTotal=run; // saldo bank keseluruhan saat ini
  const orderNos=[...new Set(all.map(t=>t.order_no).filter(Boolean))].sort();
  const oOpts=`<option value="all" ${kasOrderFilter==='all'?'selected':''}>Semua order</option>`+orderNos.map(n=>`<option value="${escAttr(n)}" ${kasOrderFilter===n?'selected':''}>${esc(n)}</option>`).join('');
  // Baris yang ditampilkan: pilih ORDER → semua bulan order itu (abaikan filter bulan, karena PO bisa lintas bulan).
  // Kalau tidak, ikut filter bulan.
  let opening=0;
  if(!byOrder && ym) all.forEach(t=>{ if(String(t.tanggal||'').slice(0,7)<ym) opening+=(t.arah==='masuk'?1:-1)*(Number(t.jumlah)||0); });
  const shown = byOrder ? all.filter(t=>t.order_no===kasOrderFilter)
              : (ym ? all.filter(t=>String(t.tanggal||'').slice(0,7)===ym) : all);
  let masukT=0, keluarT=0;
  const rows=shown.map(t=>{
    const masuk=t.arah==='masuk'?(Number(t.jumlah)||0):0;
    const keluar=t.arah==='keluar'?(Number(t.jumlah)||0):0;
    masukT+=masuk; keluarT+=keluar;
    const ket=txKet(t);
    const editable=canWr && !t._ro && ['biaya_usaha','modal','lain'].includes(t.jenis); // Edit form hanya utk transaksi manual
    // Boleh hapus: biaya usaha, modal manual, lain, bayar supplier. TIDAK boleh hapus pembayaran buyer (dp/pelunasan) — kelola di kartu order/Penjualan biar tak salah hapus.
    const deletable=canWr && !t._ro && t.jenis!=='dp' && t.jenis!=='pelunasan';
    return `<tr>
      <td style="white-space:nowrap">${t.tanggal?fmtLong(t.tanggal):'-'}</td>
      <td>${esc(ket)}</td>
      <td>${esc(t.order_no||'—')}</td>
      <td style="text-align:right;color:#1D6B4F">${masuk?rp(masuk):''}</td>
      <td style="text-align:right;color:var(--danger)">${keluar?rp(keluar):''}</td>
      <td style="text-align:right;font-weight:600;color:var(--ink-soft)" title="Saldo bank setelah transaksi ini (semua order)">${rp(saldoById[t.id])}</td>
      ${canWr?`<td style="text-align:right;white-space:nowrap">${editable?`<button class="o-btn ghost" data-editkas="${t.id}" style="padding:4px 9px">Edit</button> `:''}${deletable?`<button class="o-btn ghost" data-delkas="${t.id}" style="padding:4px 9px;color:var(--danger);border-color:#E3B9B3">Hapus</button>`:''}</td>`:''}
    </tr>`;
  }).join('');
  const stat=(l,v,c)=>`<div class="o-stat"><div class="l">${l}</div><div class="v" style="${c?`color:${c}`:''}">${rp(v)}</div></div>`;
  // Kartu ringkasan: mode order vs mode bulan.
  const statCards = byOrder
    ? stat('Uang masuk (order ini)', masukT, '#1D6B4F')+stat('Uang keluar (order ini)', keluarT, 'var(--danger)')+stat('Selisih (masuk − keluar)', masukT-keluarT)+stat('Saldo bank saat ini', saldoKasTotal)
    : (ym
        ? stat('Saldo awal bulan', opening, 'var(--ink-soft)')+stat('Uang masuk', masukT, '#1D6B4F')+stat('Uang keluar', keluarT, 'var(--danger)')+stat('Saldo akhir bulan', opening+masukT-keluarT)
        : stat('Total uang masuk', masukT, '#1D6B4F')+stat('Total uang keluar', keluarT, 'var(--danger)')+stat('Saldo kas', saldoKasTotal));
  const ket = byOrder
    ? 'Menampilkan <b>semua bulan</b> untuk order ini (PO bisa lintas bulan) — filter bulan diabaikan. Kolom <b>Saldo</b> = saldo bank berjalan gabungan semua order.'
    : 'DP/pelunasan (dari Penjualan), bayar supplier, biaya usaha, setoran modal (dari menu Modal), setor PPN. Kolom <b>Saldo</b> = saldo bank berjalan (semua order).';

      </table>
    </div>

}
const BIAYA_KATEGORI=['Raw material','Delivery: Supplier ke Warehouse','Delivery: Warehouse ke Buyer','Gaji karyawan','RnB','Sample / Marketing','Biaya usaha lainnya'];
// Kategori biaya operasional yang MASUK HPP bila ditandai ke sebuah order (pemenuhan PO): Gaji + Delivery.
// (Raw material dihitung terpisah dari Tagihan/PO supplier, bukan dari sini.)
const HPP_KATEGORI=['Gaji karyawan','Delivery: Supplier ke Warehouse','Delivery: Warehouse ke Buyer'];
// Klasifikasi 1 transaksi biaya: 'ops_po' = OPS Pemenuhan PO (masuk HPP) | 'beban' = Beban Usaha umum | null.
function costBucket(t){ if(!t||t.jenis!=='biaya_usaha') return null; return (HPP_KATEGORI.includes(t.kategori) && t.order_id) ? 'ops_po' : 'beban'; }
// OPS Pemenuhan PO per order (dari ledger) → tambahan HPP di luar raw material.
function opsPoByOrder(){ const m={}; (ledgerCache||[]).forEach(t=>{ if(costBucket(t)==='ops_po') m[t.order_id]=(m[t.order_id]||0)+(Number(t.jumlah)||0); }); return m; }
// PPN masukan (input VAT) per pembelian ber-PPN = DPP × 11%. Bisa dikreditkan → mengurangi PPN yang disetor & bukan bagian HPP.
// Berlaku untuk SEMUA jenis pembelian ber-PPN: pemenuhan PO, stok/persediaan, DAN operasional (semua punya Faktur Pajak masukan yang bisa dikreditkan).
function billInputVat(b){ if(!b||b.pakai_ppn===false) return 0;
  if(b.items&&b.items.length){ let dpp=0; b.items.forEach(it=>{ if(isOngkir(it)) return; dpp+=(Number(it.qty)||0)*(Number(it.harga)||0); }); return Math.round(dpp*0.11); }
  return Math.round((Number(b.nilai)||0)*11/111); }
function inputVatByOrder(){ const m={}; (billsCache||[]).forEach(b=>{ if(b.jenis==='pemenuhan_po'&&b.order_id) m[b.order_id]=(m[b.order_id]||0)+billInputVat(b); }); return m; }

        <button class="o-btn ghost" id="kxCancel">Batal</button>
      </div>
    </div>
  </div>`;
}
async function saveKas(){
  const err=document.getElementById('kxErr'); if(err) err.textContent='';
  const jenis=document.getElementById('kxJenis').value||'lain';
  const arah=document.getElementById('kxArah').value||'keluar';
  const tgl=document.getElementById('kxTgl').value||today();
  let kategori=document.getElementById('kxKategori').value;
  if(kategori==='__custom') kategori=(document.getElementById('kxKategoriCustom').value||'').trim();
  const jumlah=Number(document.getElementById('kxJumlah').value)||0;
  const cat=document.getElementById('kxCatatan').value.trim();
  const order_id=(document.getElementById('kxOrder')||{}).value||null;
  if(jumlah<=0){ if(err) err.textContent='Jumlah harus lebih dari 0.'; return; }
  const btn=document.getElementById('kxSave'); btn.disabled=true; btn.textContent='Menyimpan…';
  const payload={ tanggal:tgl, arah, jenis, jumlah, kategori, catatan:cat, order_id };
  const { error }= kasEditId
    ? await sb.from('transactions').update(payload).eq('id',kasEditId)
    : await sb.from('transactions').insert(payload);
  if(error){ if(err) err.textContent='Gagal simpan: '+error.message; btn.disabled=false; btn.textContent='Simpan transaksi'; return; }
  ledgerCache=null; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; kasForm=false; kasEditId=null; render();
}
async function delKas(id){ if(!confirm('Hapus transaksi kas ini?')) return; const r=await deleteTxSafe(id); if(r&&r.error){ alert('Gagal hapus: '+r.error+'\n(Pastikan login owner/keuangan.)'); return; } ledgerCache=null; orderFinance=null; finReport=null; dashData=null; hppCache=null; vsData=null; txData=null; billsCache=null; render(); }
// Hapus 1 transaksi dengan aman: ikut hapus pembayaran tagihan yang menaut + segarkan status tagihan/PO.
async function deleteTxSafe(id){
  const { data:bp }=await sb.from('bill_payments').select('id,bill_id').eq('transaction_id',id);
  for(const p of (bp||[])){ await sb.from('bill_payments').delete().eq('id',p.id); await refreshBillStatus(p.bill_id); }
  const { error }=await sb.from('transactions').delete().eq('id',id);
  return error?{error:error.message}:{};
}

// Patokan = jumlah yang disetor (dari perhitungan Coretax), karena Coretax membulatkan ke rupiah penuh.
const PPN_TOL=10;

function ppnSisaMasa(kurang, disetor){ const sel=(kurang||0)-(disetor||0); return Math.abs(sel)<=PPN_TOL?0:Math.max(0,sel); }

let ppnKeluaranCache=null;

  const recs=[];

    await Promise.all((state.months||[]).map(mo=>ensureMonth(mo))); // muat semua bulan paralel dulu

          //  • Dua-duanya kosong → belum ada transaksi pajak (PPN tidak dihitung).
          //  • Hanya No. FP Invoice terisi → seluruh PPN digabung & dilaporkan di pelunasan (mis. Gaga).

function viewPpnModule(){
  // Muat ketiga sumber (PPN keluaran, ledger, tagihan) PARALEL, bukan bergantian.
  if(ppnKeluaranCache===null || ledgerCache===null || billsCache===null){

  const byMonth={};

  const outDetail=[]; let anyNoFP=false;
  (ppnKeluaranCache||[]).forEach(r=>{ const masa=r.masa||'(tanpa tgl FP)'; M(masa).out+=r.ppn; if(r.noFP)anyNoFP=true; outDetail.push({...r, masa}); });

  const masaKeys=Object.keys(byMonth).filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();

    else if(kurang<=0){ statusPill='<span style="color:var(--ink-soft)">—</span>'; }

async function loadFinReport(){

  const [vs,tx,at,pj,bills,bpays,ms,bh,ords]=await Promise.all([

    sel('supplier_bills','id,nilai,tanggal_terima,order_id,jenis,items,pakai_ppn'),
    sel('bill_payments','bill_id,jumlah'),
    sel('modal_setoran','jumlah,tanggal'),
    sel('bagi_hasil','jumlah,tanggal,transaction_id'),

  ]);
  const n=x=>Number(x)||0;

  const m=d=> !ym || String(d||'').slice(0,7)===ym;      // cocok bulan
  const omonth={}; ords.forEach(o=>{ omonth[o.id]=(o.tanggal_order||'').slice(0,7); });
  const oOngkir={}; ords.forEach(o=>{ oOngkir[o.id]=ongkirTotal(o.items); });
  const nb=vs.filter(o=>o.status!=='batal' && (!ym||omonth[o.id]===ym));
  const penjualanGross=nb.reduce((s,o)=>s+n(o.nilai_jual),0);
  // netto dibulatkan per-order (sama dengan menu HPP & rincian per order) supaya angka Laporan cocok; ongkir bebas PPN
  const penjualanNetto=nb.reduce((s,o)=>s+njNettoCalc(o.nilai_jual, oOngkir[o.id]),0);
  const ppn=penjualanGross-penjualanNetto;
  // PPN masukan (kredit) per order dari tagihan pemenuhan PO ber-PPN → raw material dihitung NETTO.
  const inVatByOrd={}; bills.forEach(b=>{ if(b.jenis==='pemenuhan_po'&&b.order_id) inVatByOrd[b.order_id]=(inVatByOrd[b.order_id]||0)+billInputVat(b); });
  const hppRaw=nb.reduce((s,o)=>s+ (n(o.hpp)-(inVatByOrd[o.id]||0)),0); // raw material netto (tanpa PPN masukan)
  const piutang=nb.reduce((s,o)=>s+n(o.piutang),0);
  const txF=tx.filter(t=>m(t.tanggal));
  let kasMasuk=0,kasKeluar=0,biaya=0,opsPo=0,lainMasuk=0;
  txF.forEach(t=>{ const j=n(t.jumlah); if(t.arah==='masuk')kasMasuk+=j; else if(t.arah==='keluar')kasKeluar+=j; const bkt=costBucket(t); if(bkt==='ops_po')opsPo+=j; else if(bkt==='beban')biaya+=j; if(t.arah==='masuk'&&t.jenis==='lain')lainMasuk+=j; });
  // PPN masukan pembelian operasional = kredit pajak (bukan beban) → keluarkan dari Beban Usaha supaya beban netto & Neraca tetap seimbang.
  const opInVat=bills.filter(b=>b.jenis==='operasional' && m(b.tanggal_terima)).reduce((s,b)=>s+billInputVat(b),0);
  biaya=Math.max(0, biaya-opInVat);
  const hpp=hppRaw+opsPo;           // HPP netto = raw material netto + OPS pemenuhan PO
  const labaKotor=penjualanNetto-hpp;
  const saldoKas=kasMasuk-kasKeluar;
  const labaBersih=labaKotor-biaya+lainMasuk; // biaya = Beban Usaha (di luar HPP)
  const asetTetap=at.filter(x=>m(x.tanggal)).reduce((s,x)=>s+n(x.nilai),0);
  // Persediaan (stok): pembelian tanpa order buyer → ASET, mengimbangi hutang supplier yg timbul (Neraca seimbang). Belum jadi HPP.
  // Dicatat NETTO (ex-PPN): PPN masukan-nya sudah jadi kredit pajak (mengurangi hutang pajak), jadi tidak dobel di aset.
  const persediaan=bills.filter(b=>b.jenis==='persediaan' && m(b.tanggal_terima)).reduce((s,b)=>s+n(b.nilai)-billInputVat(b),0);
  const totalAset=saldoKas+piutang+persediaan+asetTetap;
  const pinjamanBelum=pj.filter(p=>p.status!=='lunas'&&m(p.tanggal)).reduce((s,x)=>s+n(x.jumlah),0);
  const paid={}; bpays.forEach(p=>{ paid[p.bill_id]=(paid[p.bill_id]||0)+n(p.jumlah); });
  const supplierSisa=bills.filter(b=>m(b.tanggal_terima)).reduce((s,b)=>s+Math.max(0,n(b.nilai)-(paid[b.id]||0)),0);
  // PPN untuk Neraca — pakai ringkasan yang SAMA dengan menu PPN (keluaran dari FP Penjualan) supaya angkanya cocok.
  // Ini SALDO (all-time), bukan per bulan: hutang pajak = sisa yang belum disetor secara keseluruhan.
  if(ppnKeluaranCache===null) ppnKeluaranCache=await computePpnKeluaran();
  const ppnSum=ppnSummaryFrom(ppnKeluaranCache, bills, tx);
  const pajakMasukan=ppnSum.totIn;
  const ppnKurangBayar=ppnSum.totBayar;
  const pajakDisetor=ppnSum.totD;
  const hutangPajak=ppnSum.sisaTot;
  const hutangBagiHasil=bh.filter(x=>m(x.tanggal)&&!x.transaction_id).reduce((s,x)=>s+n(x.jumlah),0); // bagi hasil belum dibayar = kewajiban
  const totalHutang=pinjamanBelum+supplierSisa+hutangPajak+hutangBagiHasil;
  const setoranModal=ms.filter(x=>m(x.tanggal)).reduce((s,x)=>s+n(x.jumlah),0);
  const bagiHasil=bh.filter(x=>m(x.tanggal)).reduce((s,x)=>s+n(x.jumlah),0);
  const labaDitahan=labaBersih-bagiHasil;
  const totalModal=setoranModal+labaDitahan;
  const selisih=totalAset-(totalHutang+totalModal);
  const ledger=txF.map(t=>({...t, order_no:t.orders?t.orders.no_order:null})).sort((a,b)=>String(a.tanggal||'').localeCompare(String(b.tanggal||'')));
  finReport={penjualanGross,ppn,penjualanNetto,hpp,labaKotor,biaya,lainMasuk,labaBersih,piutang,saldoKas,kasMasuk,kasKeluar,persediaan,asetTetap,totalAset,pinjamanBelum,supplierSisa,pajakMasukan,ppnKurangBayar,pajakDisetor,hutangPajak,hutangBagiHasil,totalHutang,setoranModal,bagiHasil,labaDitahan,totalModal,selisih,ledger,periode:ym};
  render();
}

async function resolveSupplierId(name){
