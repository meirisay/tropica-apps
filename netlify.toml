# Konfigurasi deploy Netlify — otomatis saat push ke branch main.
# Hanya index.html yang dipublikasikan (dokumen .md & folder database/ TIDAK ikut ke publik).
[build]
  # Salin hanya index.html ke folder publish _site
  command = "mkdir -p _site && cp index.html _site/index.html"
  publish = "_site"

# Deploy produksi mengikuti branch main (diatur juga di dashboard Netlify saat link repo).
[context.production]
  command = "mkdir -p _site && cp index.html _site/index.html"
